<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rdb.lab — Relational Database Fundamentals</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F6F8; --sheet:#FFFFFF; --ink:#102A43; --ink2:#486581; --ink3:#829AB1;
  --grid:#D9E2EC; --grid2:#E8EEF3; --key:#F0B429; --keybg:#FFF6DA; --rel:#2F6FED; --relbg:#E8F0FE;
  --ok:#1C8B5E; --okbg:#E3F6EE; --bad:#C93A3A; --badbg:#FDECEC;
  --sans:"IBM Plex Sans",system-ui,sans-serif; --cond:"IBM Plex Sans Condensed","IBM Plex Sans",sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  --r:6px;
}
[data-theme=dark]{ --paper:#0E1A26; --sheet:#132233; --ink:#E4EBF2; --ink2:#9FB3C8; --ink3:#627D98; --grid:#24384D; --grid2:#1B2D40; --keybg:#3A2F12; --relbg:#16294A; --okbg:#10352A; --badbg:#3E1A1C }
*{box-sizing:border-box}
[hidden]{display:none!important}
.exgrid{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:22px;align-items:start}
.exgrid summary{cursor:pointer;font-weight:600;margin-bottom:8px;color:var(--ink2)}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 var(--sans)}
a{color:var(--rel)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--rel);outline-offset:2px}
code,kbd{font-family:var(--mono);font-size:.88em;background:var(--grid2);padding:.08em .35em;border-radius:4px}
h1,h2,h3{font-family:var(--cond);line-height:1.15;letter-spacing:-.01em;margin:0}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--grid)}
.bar{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:22px;padding:0 20px;height:56px}
.mark{font:600 19px var(--mono);text-decoration:none;color:var(--ink);white-space:nowrap}
.mark b{color:var(--key);font-weight:600}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1}
.nav a{padding:7px 11px;border-radius:var(--r);text-decoration:none;color:var(--ink2);font-weight:500;font-size:15px;white-space:nowrap}
.nav a:hover{color:var(--ink);background:var(--grid2)}
.nav a.on{color:var(--ink);background:var(--sheet);box-shadow:inset 0 0 0 1px var(--grid)}
.tbtn{border:1px solid var(--grid);background:var(--sheet);border-radius:var(--r);padding:5px 10px;cursor:pointer;font-size:14px;color:var(--ink2)}
.dbstat{font-size:13px;color:var(--ink3);white-space:nowrap}
.dbstat i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ink3);margin-right:6px;vertical-align:1px}
.dbstat.ready i{background:var(--ok)}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 80px}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:40px;align-items:start;padding:26px 0 40px}
.hero h1{font-size:clamp(44px,6.4vw,84px);font-weight:700;line-height:.95;letter-spacing:-.03em}
.hero p{font-size:18px;color:var(--ink2);max-width:34ch;margin:18px 0 22px}
.hero .ctas{display:flex;gap:10px;flex-wrap:wrap}

/* buttons */
.btn{border:1px solid var(--grid);background:var(--sheet);border-radius:var(--r);padding:8px 14px;cursor:pointer;font-weight:500;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:8px;font-size:15px}
.btn:hover{border-color:var(--ink3)}
.btn.pri{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btn.pri:hover{opacity:.9}
.btn.gold{background:var(--key);border-color:var(--key);color:#102A43}
.btn.sm{padding:4px 10px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:default}

/* console (editor + result) */
.console{background:var(--sheet);border:1px solid var(--grid);border-radius:10px;overflow:hidden}
.ctool{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--grid);background:var(--grid2);font-size:13px;color:var(--ink2)}
.ctool .sp{flex:1}
.ctool select{font:inherit;border:1px solid var(--grid);border-radius:5px;background:var(--sheet);color:var(--ink);padding:2px 6px}
.ed{position:relative;font:14px/1.6 var(--mono)}
.ed pre,.ed textarea{margin:0;padding:12px 14px 12px 14px;font:inherit;white-space:pre-wrap;word-wrap:break-word;tab-size:2}
.ed pre{position:absolute;inset:0;pointer-events:none;overflow:hidden;color:var(--ink)}
.ed textarea{position:relative;display:block;width:100%;min-height:inherit;border:0;resize:vertical;background:transparent;color:transparent;caret-color:var(--ink);outline:none;overflow:hidden}
.ed textarea::selection{background:var(--relbg);color:transparent}
.kw{color:var(--rel);font-weight:600}.fn{color:#8A4FD6}.st{color:#B7791F}[data-theme=dark] .st{color:#F0B429}.nu{color:var(--ok)}.cm{color:var(--ink3);font-style:italic}
.cbar{display:flex;gap:8px;align-items:center;padding:8px 10px;border-top:1px solid var(--grid);flex-wrap:wrap}
.cbar .hint{font-size:13px;color:var(--ink3);margin-left:auto}
.res{border-top:1px solid var(--grid);max-height:380px;overflow:auto}
.res:empty{display:none}
.res .msg{padding:10px 14px;font-size:14px}
.res .msg.err{background:var(--badbg);color:var(--bad);font-family:var(--mono);font-size:13px}
.res .msg.okm{color:var(--ink2)}
table.rs{border-collapse:collapse;font:13px/1.45 var(--mono);width:max-content;min-width:100%}
table.rs th{position:sticky;top:0;background:var(--sheet);text-align:left;font-weight:600;padding:6px 12px;border-bottom:2px solid var(--grid);white-space:nowrap}
table.rs td{padding:5px 12px;border-bottom:1px solid var(--grid2);white-space:nowrap;max-width:340px;overflow:hidden;text-overflow:ellipsis}
table.rs td.n{text-align:right}
table.rs td .null{color:var(--ink3);font-style:italic}
table.rs tr:hover td{background:var(--grid2)}
.rcount{font-size:12px;color:var(--ink3);padding:6px 12px;border-top:1px solid var(--grid2)}

/* sections */
.sec{margin-top:54px}
.sec>h2{font-size:30px;margin-bottom:6px}
.sec>p.sub{color:var(--ink2);margin:0 0 18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}

/* "result-set" style lists */
table.set{border-collapse:collapse;width:100%;background:var(--sheet);border:1px solid var(--grid);border-radius:10px;overflow:hidden}
table.set th{text-align:left;font:600 13px var(--sans);color:var(--ink3);padding:9px 14px;border-bottom:1px solid var(--grid);background:var(--grid2)}
table.set td{padding:12px 14px;border-bottom:1px solid var(--grid2);vertical-align:top}
table.set tr:last-child td{border-bottom:0}
table.set tr.link{cursor:pointer}
table.set tr.link:hover td{background:var(--grid2)}
table.set .w{font:500 13px var(--mono);color:var(--ink3);white-space:nowrap}
table.set .t{font-weight:600}
table.set .d{color:var(--ink2);font-size:14px}
.bar5{display:inline-block;width:90px;height:6px;border-radius:3px;background:var(--grid2);vertical-align:middle;overflow:hidden}
.bar5 i{display:block;height:100%;background:var(--key)}
.num{font:500 13px var(--mono);color:var(--ink2);white-space:nowrap}

/* notes */
.lay{display:grid;grid-template-columns:230px minmax(0,1fr);gap:44px}
.toc{position:sticky;top:76px;align-self:start;font-size:14px}
.toc a{display:block;padding:5px 10px;border-left:2px solid var(--grid);text-decoration:none;color:var(--ink2)}
.toc a.on{border-color:var(--key);color:var(--ink);font-weight:600}
.toc .wk{font:500 12px var(--mono);color:var(--ink3);display:block}
.doc{max-width:780px}
.doc .eyebrow{font:500 14px var(--mono);color:var(--ink3)}
.doc h1{font-size:44px;margin:4px 0 10px}
.doc h2{font-size:25px;margin:40px 0 10px;padding-top:6px}
.doc p,.doc li{font-size:16.5px}
.doc .lead{font-size:19px;color:var(--ink2)}
.doc ul,.doc ol{padding-left:22px}
.doc li{margin:4px 0}
.doc b{font-weight:600;background:linear-gradient(transparent 62%,var(--keybg) 62%)}
table.t{border-collapse:collapse;width:100%;margin:12px 0;font-size:15px;background:var(--sheet);border:1px solid var(--grid)}
table.t th{text-align:left;background:var(--grid2);font-weight:600;padding:7px 10px;border-bottom:1px solid var(--grid)}
table.t td{padding:7px 10px;border-bottom:1px solid var(--grid2);vertical-align:top}
.key,.trap{border-radius:8px;padding:4px 16px;margin:16px 0}
.key{background:var(--keybg);border-left:4px solid var(--key)}
.trap{background:var(--badbg);border-left:4px solid var(--bad)}
.doc .key b,.doc .trap b{background:none}
.runbox{margin:14px 0}
.runbox .console{border-radius:8px}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:50px;border-top:1px solid var(--grid);padding-top:20px}
.pager a{text-decoration:none;color:var(--ink2);font-size:14px}.pager a b{display:block;color:var(--ink);font-size:17px}
.small{font-size:14px}.muted{color:var(--ink3)}

/* schema */
.schema{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin:14px 0;align-items:start}
.tb{background:var(--sheet);border:1px solid var(--grid);border-radius:8px;overflow:hidden;font-size:13px}
.tb h4{margin:0;padding:7px 10px;font:600 14px var(--mono);background:var(--ink);color:var(--paper);display:flex;justify-content:space-between;cursor:pointer}
.tb h4 span{font-weight:400;opacity:.7;font-size:12px}
.tb div{padding:3px 10px;font-family:var(--mono);display:flex;gap:6px;align-items:baseline;border-bottom:1px solid var(--grid2)}
.tb div:last-child{border:0}
.tb .ty{margin-left:auto;color:var(--ink3);font-size:11.5px}
.tb .pk{color:var(--ink);font-weight:600}
.tg{font:600 10px var(--sans);border-radius:3px;padding:0 4px}
.tg.p{background:var(--key);color:#102A43}.tg.f{background:var(--relbg);color:var(--rel)}

/* playground */
.play{display:grid;grid-template-columns:270px minmax(0,1fr);gap:20px}
.side{display:flex;flex-direction:column;gap:10px}
.side .schema{grid-template-columns:1fr;margin:0}

/* exercises */
.exhead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.exq{font-size:19px;margin:10px 0 16px;max-width:820px}
.verdict{padding:10px 14px;font-weight:500;font-size:15px}
.verdict.ok{background:var(--okbg);color:var(--ok)}
.verdict.no{background:var(--badbg);color:var(--bad)}
.sol{margin-top:14px}
.dots{display:flex;flex-wrap:wrap;gap:5px}
.dot{width:26px;height:26px;border-radius:5px;border:1px solid var(--grid);background:var(--sheet);font:500 11px var(--mono);display:grid;place-items:center;text-decoration:none;color:var(--ink2)}
.dot.done{background:var(--ok);border-color:var(--ok);color:#fff}
.dot.cur{outline:2px solid var(--key);outline-offset:1px}

/* quiz */
.qcard{background:var(--sheet);border:1px solid var(--grid);border-radius:10px;padding:22px;max-width:760px}
.qcard h3{font:500 20px/1.4 var(--sans);margin-bottom:14px}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--grid);background:var(--sheet);border-radius:8px;padding:10px 14px;margin:8px 0;cursor:pointer;font-size:15.5px}
.opt:hover{border-color:var(--ink3)}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad)}
.opt .c{font-family:var(--mono);font-size:.92em}
pre.code{font:13.5px/1.55 var(--mono);background:var(--grid2);border-radius:8px;padding:10px 14px;white-space:pre-wrap;margin:10px 0}
.expl{margin-top:12px;padding:10px 14px;border-radius:8px;background:var(--grid2);font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 18px}
.chip{border:1px solid var(--grid);background:var(--sheet);border-radius:20px;padding:4px 12px;cursor:pointer;font-size:14px}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.progress{height:4px;background:var(--grid2);border-radius:2px;margin:12px 0 20px;max-width:760px}
.progress i{display:block;height:100%;background:var(--key);border-radius:2px;transition:width .3s}

/* cheat */
.cheat{columns:2 340px;column-gap:24px}
.cheat .c{break-inside:avoid;background:var(--sheet);border:1px solid var(--grid);border-radius:8px;padding:12px 16px;margin:0 0 18px}
.cheat h3{font-size:19px;margin-bottom:6px}
.cheat pre{font:13px/1.55 var(--mono);margin:6px 0;white-space:pre-wrap}
.cheat p{margin:4px 0;font-size:14.5px}

.loading{padding:30px;color:var(--ink3)}
/* learn */
.lrn{display:grid;grid-template-columns:250px minmax(0,1fr);gap:40px}
.lmap{position:sticky;top:76px;align-self:start;max-height:calc(100vh - 96px);overflow:auto;font-size:14px}
.lmap h4{font:600 13px var(--sans);color:var(--ink3);margin:14px 0 4px}
.lmap a{display:flex;gap:8px;align-items:center;padding:4px 6px;border-radius:5px;text-decoration:none;color:var(--ink2)}
.lmap a:hover{background:var(--grid2)}
.lmap a.on{background:var(--sheet);color:var(--ink);font-weight:600;box-shadow:inset 0 0 0 1px var(--grid)}
.lmap .ck{flex:none;width:16px;height:16px;border-radius:50%;border:1.5px solid var(--grid);display:grid;place-items:center;font-size:10px;color:#fff}
.lmap .ck.d{background:var(--ok);border-color:var(--ok)}
.lstep{max-width:780px}
.lstep .unit{font:500 14px var(--mono);color:var(--ink3)}
.lstep h1{font-size:40px;margin:4px 0 14px}
.lstep .x p{font-size:17.5px}
.lstep .x b{font-weight:600;background:linear-gradient(transparent 62%,var(--keybg) 62%)}
.yourturn{margin-top:28px;border-top:2px solid var(--key);padding-top:14px}
.yourturn h2{font-size:22px;margin-bottom:6px}
.lnav{display:flex;gap:10px;margin-top:26px;align-items:center}
/* name gate */
.gate{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,var(--ink) 55%,transparent);display:grid;place-items:center;padding:20px}
.gate form{background:var(--sheet);border-radius:12px;padding:28px;max-width:420px;width:100%;box-shadow:0 20px 60px rgba(16,42,67,.3)}
.gate h2{font-size:30px;margin-bottom:6px}
.gate input{width:100%;font:inherit;font-size:18px;padding:10px 12px;border:1px solid var(--grid);border-radius:8px;background:var(--paper);color:var(--ink);margin:14px 0 6px}
.gate .small{color:var(--ink3)}
/* admin */
.adm table.set td{font-size:14px}
.adm .kpis{display:flex;gap:28px;flex-wrap:wrap;margin:16px 0 26px}
.adm .kpis div{font:600 30px var(--cond)}.adm .kpis span{display:block;font:400 13px var(--sans);color:var(--ink3)}
.who{font-size:13px;color:var(--ink3);white-space:nowrap}
@media (max-width:900px){
  .hero,.grid2,.lay,.play,.exgrid,.lrn{grid-template-columns:1fr}
  .lmap{position:static;max-height:220px}
  .toc{position:static;display:flex;overflow-x:auto;gap:4px}
  .toc a{border-left:0;border-bottom:2px solid var(--grid);white-space:nowrap}
  .toc .wk{display:none}
  .dbstat span{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top"><div class="bar">
  <a class="mark" href="#/">rdb<b>.</b>lab</a>
  <nav class="nav" id="nav"></nav>
  <span class="dbstat" id="dbstat"><i></i><span>starting PostgreSQL</span></span>
  <button class="tbtn" id="theme" aria-label="Toggle dark mode">dark</button>
</div></header>
<main class="wrap" id="app"></main>
<script type="module">
const DATA = __DATA__;
const LEARN = DATA.learn, CFG = DATA.cfg || {};
const NOTES = DATA.notes, EX = DATA.ex, QZ = DATA.qz, SCHEMA = DATA.schema, SEED = DATA.seed, CHEAT = DATA.cheat;
const $ = (s, r=document) => r.querySelector(s), $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const app = $('#app');
const shuffle = a => { a = [...a]; for (let i = a.length-1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; };

/* ---------- storage ---------- */
const KEY = 'rdblab.v1';
let S = {}; try { S = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(e) {}
S.done = S.done || {}; S.learn = S.learn || {}; S.drafts = S.drafts || {}; S.quiz = S.quiz || {}; S.mock = S.mock || [];
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} };
try { if (S.theme) document.documentElement.dataset.theme = S.theme; } catch(e) {}
$('#theme').onclick = () => { const d = document.documentElement.dataset.theme === 'dark' ? '' : 'dark'; document.documentElement.dataset.theme = d; S.theme = d; save(); $('#theme').textContent = d ? 'light' : 'dark'; };
$('#theme').textContent = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';

/* ---------- name + progress reporting ---------- */
const api = (path, body) => CFG.url ? fetch(CFG.url + '/rest/v1/' + path, { method: 'POST', keepalive: true, headers: { apikey: CFG.key, Authorization: 'Bearer ' + CFG.key, 'Content-Type': 'application/json', Prefer: 'return=minimal' }, body: JSON.stringify(body) }) : Promise.resolve(null);
function track(kind, ref = null, extra = {}){
  if (!S.uid || !CFG.url) return;
  api('events', { student_id: S.uid, kind, ref: ref == null ? null : String(ref), ok: extra.ok ?? null, score: extra.score ?? null, total: extra.total ?? null, detail: extra.detail ?? null }).catch(() => {});
}
function gate(){
  if (S.name || location.hash.startsWith('#/admin')) return;
  const g = document.createElement('div'); g.className = 'gate';
  g.innerHTML = `<form><h2>Welcome to rdb.lab</h2><p>Type your name once to start. It's saved on this device.</p><label for="nm" class="small">Your name</label><input id="nm" autocomplete="name" maxlength="60" required placeholder="First and last name"><p class="small">Your name, progress, quiz and mock exam scores are shared with the person who runs this site, so they can follow how the group is doing.</p><button class="btn pri" style="width:100%;justify-content:center;margin-top:8px">Start learning</button></form>`;
  document.body.append(g); $('#nm', g).focus();
  $('form', g).onsubmit = e => {
    e.preventDefault(); const n = $('#nm', g).value.trim().replace(/\s+/g, ' '); if (!n) return;
    S.name = n; S.uid = (crypto.randomUUID ? crypto.randomUUID() : 'u' + Date.now() + Math.random().toString(16).slice(2)); save();
    api('students', { id: S.uid, name: n }).then(() => track('join')).catch(() => {});
    g.remove(); route();
  };
}

/* ---------- PostgreSQL in the browser ---------- */
let pg = null, pgReady = null;
const ID = x => x;
const PARSERS = {16: v => v === 't' ? 'true' : 'false'}; [20,21,23,700,701,1700,1082,1083,1114,1184,1186,1266,114,3802].forEach(o => PARSERS[o] = ID);
function startDB(){
  if (pgReady) return pgReady;
  pgReady = (async () => {
    const { PGlite } = await import('./vendor/pglite/index.js');
    pg = new PGlite();
    await pg.exec(SEED);
    const st = $('#dbstat'); st.classList.add('ready'); st.lastElementChild.textContent = 'PostgreSQL ready';
    return pg;
  })().catch(e => { $('#dbstat').lastElementChild.textContent = 'database failed to load'; throw e; });
  return pgReady;
}
async function resetDB(){ await startDB(); await pg.exec(SEED); }
let queue = Promise.resolve();
function run(sql, db='enterprise', rollback=true){
  const job = queue.then(async () => {
    await startDB();
    const t0 = performance.now();
    if (rollback) await pg.exec('BEGIN');
    try {
      await pg.exec(`SET search_path TO ${db}; SET datestyle TO ISO, DMY;`);
      const r = await pg.exec(sql, { rowMode: 'array', parsers: PARSERS });
      return { results: r, ms: performance.now() - t0 };
    } finally {
      if (rollback) { try { await pg.exec('ROLLBACK'); } catch(e) {} }
    }
  });
  queue = job.catch(() => {});
  return job;
}

/* ---------- SQL highlighter + editor ---------- */
const KW = 'SELECT|FROM|WHERE|AND|OR|NOT|IN|IS|NULL|AS|ORDER|BY|GROUP|HAVING|ASC|DESC|DISTINCT|JOIN|INNER|LEFT|RIGHT|FULL|OUTER|CROSS|NATURAL|ON|USING|BETWEEN|LIKE|ILIKE|OFFSET|FETCH|NEXT|FIRST|ROWS?|ONLY|WITH|TIES|NULLS|LAST|LIMIT|INSERT|INTO|VALUES|UPDATE|SET|DELETE|CREATE|TABLE|ALTER|DROP|COLUMN|CASE|WHEN|THEN|ELSE|END|TRUE|FALSE|INTERVAL|DATE|TIMESTAMP|TIME|SHOW|LEADING|TRAILING|BOTH|UNION|ALL|EXISTS|PRIMARY|KEY|FOREIGN|REFERENCES|CONSTRAINT|BEGIN|COMMIT|ROLLBACK';
const FN = 'COUNT|SUM|AVG|MIN|MAX|ROUND|TRUNC|MOD|UPPER|LOWER|INITCAP|LENGTH|SUBSTRING|SUBSTR|POSITION|CONCAT|CONCAT_WS|LPAD|RPAD|TRIM|REPLACE|TO_CHAR|TO_DATE|TO_NUMBER|CAST|AGE|DATE_PART|DATE_TRUNC|EXTRACT|NOW|CURRENT_DATE|CURRENT_TIME|CURRENT_TIMESTAMP|COALESCE|ABS|CEIL|FLOOR';
const TOK = new RegExp(`(--[^\\n]*)|('(?:[^']|'')*'?)|("(?:[^"])*"?)|\\b(\\d+(?:\\.\\d+)?)\\b|\\b(${FN})\\b(?=\\s*\\(|\\b)|\\b(${KW})\\b`, 'gi');
function hl(src){
  let out = '', last = 0;
  src.replace(TOK, (m, cm, st, id, nu, fn, kw, off) => {
    out += esc(src.slice(last, off));
    const cls = cm ? 'cm' : st ? 'st' : id ? '' : nu ? 'nu' : fn ? 'fn' : 'kw';
    out += cls ? `<span class="${cls}">${esc(m)}</span>` : esc(m);
    last = off + m.length; return m;
  });
  return out + esc(src.slice(last)) + '\n';
}
function editor(box, value, onRun, minH=110){
  box.innerHTML = `<div class="ed"><pre aria-hidden="true"></pre><textarea spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="SQL editor"></textarea></div>`;
  const ta = $('textarea', box), pre = $('pre', box);
  const fit = () => { ta.style.height = 'auto'; ta.style.height = Math.max(ta.scrollHeight, minH) + 'px'; };
  const sync = () => { pre.innerHTML = hl(ta.value); fit(); };
  ta.value = value || ''; sync();
  ta.addEventListener('input', sync);
  ta.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); onRun && onRun(); }
    else if (e.key === 'Tab' && !e.shiftKey) { e.preventDefault(); const s = ta.selectionStart; ta.setRangeText('  ', s, ta.selectionEnd, 'end'); sync(); }
  });
  return { get: () => ta.value, set: v => { ta.value = v; sync(); }, el: ta };
}
function table(r){
  if (!r.fields || !r.fields.length) return `<div class="msg okm">${r.affectedRows != null ? `Done. ${r.affectedRows} row(s) affected.` : 'Done.'}</div>`;
  const nums = new Set([20,21,23,700,701,1700]);
  const head = r.fields.map(f => `<th>${esc(f.name)}</th>`).join('');
  const rows = r.rows.slice(0, 500).map(row => '<tr>' + row.map((v, i) => `<td class="${nums.has(r.fields[i].dataTypeID) ? 'n' : ''}" title="${esc(v)}">${v === null ? '<span class="null">null</span>' : esc(v)}</td>`).join('') + '</tr>').join('');
  return `<table class="rs"><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table><div class="rcount">${r.rows.length} row${r.rows.length === 1 ? '' : 's'}</div>`;
}
function errMsg(e){ return `<div class="msg err">ERROR: ${esc(e.message || e)}</div>`; }
function consoleBox(box, {sql='', db='enterprise', rollback=true, dbPick=false, extra='', compact=false} = {}){
  box.innerHTML = `<div class="console"><div class="ctool" ${compact ? 'hidden' : ''}>${dbPick ? `<label>database <select class="dbsel"><option value="enterprise">enterprise</option><option value="netflix">netflix</option></select></label>` : `<span>${db}</span>`}<span class="sp"></span>${extra}</div>
    <div class="edw"></div>
    <div class="cbar"><button class="btn pri sm go">Run</button><span class="hint">${compact ? `${db} database, ` : ''}Ctrl + Enter</span></div>
    <div class="res"></div></div>`;
  const sel = $('.dbsel', box); if (sel) sel.value = db;
  const out = $('.res', box);
  const go = async () => {
    out.innerHTML = '<div class="msg okm">Running…</div>';
    try { const { results } = await run(ed.get(), sel ? sel.value : db, rollback); const r = results[results.length - 1]; out.innerHTML = r ? table(r) : '<div class="msg okm">No statement.</div>'; }
    catch(e) { out.innerHTML = errMsg(e); }
  };
  const ed = editor($('.edw', box), sql, go, compact ? 0 : 110);
  $('.go', box).onclick = go;
  return { ed, go, out, db: () => sel ? sel.value : db, setDb: v => { if (sel) sel.value = v; } };
}

/* ---------- schema cards ---------- */
function schemaHTML(db, clickable){
  return SCHEMA[db].map(t => `<div class="tb"><h4 ${clickable ? `data-t="${t.name}" title="Show rows"` : ''}>${t.name}<span>${t.rows} rows</span></h4>${t.cols.map(c => `<div class="${c.pk ? 'pk' : ''}">${c.name}${c.pk ? ' <span class="tg p">PK</span>' : ''}${c.fk ? ` <span class="tg f" title="→ ${c.fk}">FK</span>` : ''}${c.nn && !c.pk ? ' <span class="tg" style="color:var(--ink3)">NN</span>' : ''}<span class="ty">${c.type}</span></div>`).join('')}</div>`).join('');
}

/* ---------- checking answers ---------- */
const norm = v => { if (v === null) return '∅'; const s = String(v).trim(); if (/^-?\d+(\.\d+)?$/.test(s)) return String(+s); return s; };
const hasOrder = sql => /\border\s+by\b/i.test(sql.replace(/\([^()]*\)/g, ''));
async function check(ex, userSql){
  let mine, ref;
  try { const r = await run(userSql, ex.db); mine = r.results[r.results.length - 1]; } catch(e) { return { ok: false, msg: 'Your query gives an error: ' + e.message }; }
  const r2 = await run(ex.sol, ex.db); ref = r2.results[r2.results.length - 1];
  if (!mine || !mine.fields) return { ok: false, msg: 'Your statement returns no result table. Write a SELECT.' };
  const A = mine.rows.map(r => r.map(norm)), B = ref.rows.map(r => r.map(norm));
  if (mine.fields.length !== ref.fields.length) return { ok: false, msg: `You return ${mine.fields.length} column(s), the answer has ${ref.fields.length}.`, mine, ref };
  if (A.length !== B.length) return { ok: false, msg: `You return ${A.length} row(s), the answer has ${B.length}.`, mine, ref };
  const key = r => JSON.stringify(r);
  if (ex.ord && hasOrder(ex.sol)) { if (A.every((r, i) => key(r) === key(B[i]))) return { ok: true }; const sa = A.map(key).sort().join(), sb = B.map(key).sort().join(); return { ok: false, msg: sa === sb ? 'Right rows, wrong order. Check your ORDER BY.' : 'The values differ from the expected result.', mine, ref }; }
  const sa = A.map(key).sort().join('|'), sb = B.map(key).sort().join('|');
  return sa === sb ? { ok: true } : { ok: false, msg: 'Same number of rows, but the values differ. Compare with the expected result.', mine, ref };
}

    app.innerHTML = `<h1 style="font-size:44px">Quiz</h1><p class="muted">Fifteen random questions. Click an answer to see right away if it's correct and why.</p>

function mockResult(){
  const s = Object.values(MK.res).filter(r => r.ok).length;
  app.innerHTML = `<h1 style="font-size:44px">${s} of ${MK.ids.length}</h1><p class="muted">Correct answers are counted by result. Review each question below.</p><button class="btn pri" id="new">New mock exam</button>
  ${MK.ids.map((id, n) => { const r = MK.res[id]; return `<section class="sec" style="margin-top:30px"><p class="exq"><b>${n+1}.</b> ${EX[id].q}</p><div class="verdict ${r.ok ? 'ok' : 'no'}">${r.ok ? 'Correct' : esc(r.msg)}</div>${MK.ans[id] ? `<p class="small muted">Your answer</p><pre class="code">${hl(MK.ans[id])}</pre>` : ''}${r.ok ? '' : `<p class="small muted">A correct answer</p><pre class="code">${hl(EX[id].sol)}</pre>`}</section>`; }).join('')}`;
  $('#new').onclick = () => { MK = null; mock(); };
}

/* ---------- learn from zero ---------- */
const LSTEPS = LEARN.flatMap((u, ui) => u.steps.map((st, si) => ({ ...st, ui, si, key: ui + '.' + si })));
function start(k){
  let n = LSTEPS.findIndex(s => s.key === k);
  if (n < 0) { n = LSTEPS.findIndex(s => !S.learn[s.key]); if (n < 0) n = 0; return location.replace('#/start/' + LSTEPS[n].key); }
  const st = LSTEPS[n], u = LEARN[st.ui], doneN = LSTEPS.filter(s => S.learn[s.key]).length;
  app.innerHTML = `<div class="lrn"><nav class="lmap" aria-label="Lessons"><div class="small muted">${doneN} of ${LSTEPS.length} steps done</div>
    ${LEARN.map((un, ui) => `<h4>${ui + 1}. ${esc(un.title)}</h4>${un.steps.map((s2, si) => `<a href="#/start/${ui}.${si}" class="${ui + '.' + si === k ? 'on' : ''}"><span class="ck ${S.learn[ui + '.' + si] ? 'd' : ''}">${S.learn[ui + '.' + si] ? '✓' : ''}</span>${esc(s2.t)}</a>`).join('')}`).join('')}</nav>
    <article class="lstep"><div class="unit">Lesson ${st.ui + 1}: ${esc(u.title)}, step ${st.si + 1} of ${u.steps.length}</div><h1>${esc(st.t)}</h1><div class="x">${st.x}</div>
    ${st.ex ? `<p class="small muted" style="margin-bottom:6px">Example. Press Run, change something, run it again.</p><div id="lex"></div>` : ''}
    <div class="yourturn"><h2>Your turn</h2>${st.task ? `<p class="exq" style="font-size:17.5px;margin:6px 0 12px">${st.task.q}</p><div id="ltask"></div><div class="cbar" style="padding:12px 0;border:0"><button class="btn gold" id="lchk">Check</button>${st.task.hint ? '<button class="btn" id="lhint">Hint</button>' : ''}<button class="btn" id="lshow">Show answer</button></div>` : `<p class="exq" style="font-size:17.5px;margin:6px 0 4px">${esc(st.mcq.q)}</p><div id="lmcq">${shuffle(st.mcq.o.map((_, j) => j)).map(j => `<button class="opt" data-j="${j}">${esc(st.mcq.o[j])}</button>`).join('')}</div>`}
    <div id="lfb"></div></div>
    <div class="lnav">${n > 0 ? `<a class="btn" href="#/start/${LSTEPS[n - 1].key}">Back</a>` : ''}<span style="flex:1"></span>${n < LSTEPS.length - 1 ? `<a class="btn ${S.learn[st.key] ? 'pri' : ''}" id="lnext" href="#/start/${LSTEPS[n + 1].key}">${S.learn[st.key] ? 'Next step' : 'Skip'}</a>` : `<a class="btn pri" href="#/exercises">Go to the exercises</a>`}</div></article></div>`;
  if (st.ex) consoleBox($('#lex'), { sql: st.ex, compact: true });
  const fb = $('#lfb');
  const pass = msg => { const first = !S.learn[st.key]; S.learn[st.key] = 1; save(); if (first) track('learn', st.key, { ok: true }); fb.innerHTML = `<div class="verdict ok" style="margin-top:12px">${msg}</div>`; const nx = $('#lnext'); if (nx) { nx.classList.add('pri'); nx.textContent = 'Next step'; nx.focus(); } $$('.lmap a.on .ck').forEach(c => { c.classList.add('d'); c.textContent = '✓'; }); };
  if (st.task) {
    const c = consoleBox($('#ltask'), { sql: S.drafts['L' + st.key] || '', compact: true });
    c.ed.el.addEventListener('input', () => { S.drafts['L' + st.key] = c.ed.get(); save(); });
    $('#lchk').onclick = async () => {
      if (!c.ed.get().trim()) { fb.innerHTML = '<div class="verdict no" style="margin-top:12px">Write your query in the box first.</div>'; return; }
      const r = await check({ sol: st.task.sol, db: 'enterprise', ord: /\border\b|\bsort|first$/i.test(st.task.q) }, c.ed.get());
      if (r.ok) pass('Correct. That is exactly the right result.');
      else fb.innerHTML = `<div class="verdict no" style="margin-top:12px">${esc(r.msg)}</div>${r.ref ? `<p class="small muted">The result should look like this:</p><div class="console res" style="max-height:240px">${table(r.ref)}</div>` : ''}`;
    };
    if (st.task.hint) $('#lhint').onclick = () => { fb.innerHTML = `<div class="expl">Hint: ${st.task.hint}</div>`; };
    $('#lshow').onclick = () => { fb.innerHTML = `<p class="small muted" style="margin-top:12px">One correct answer. Type it yourself in the box and press Check, that's how it sticks.</p><pre class="code">${hl(st.task.sol)}</pre>`; };
  } else {
    let done = false;
    $$('#lmcq .opt').forEach(b => b.onclick = () => { if (done) return; const j = +b.dataset.j; if (j === st.mcq.a) { done = true; b.classList.add('ok'); pass(st.mcq.why ? 'Correct. ' + esc(st.mcq.why) : 'Correct.'); } else { b.classList.add('bad'); fb.innerHTML = '<div class="verdict no" style="margin-top:12px">Not this one. Read the explanation again and try another answer.</div>'; } });
  }
  startDB();
}

/* ---------- admin ---------- */
let ADM = null;
async function admin(){
  if (!CFG.url) { app.innerHTML = '<h1>Admin</h1><p>Reporting isn\'t connected yet.</p>'; return; }
  if (!ADM) {
    app.innerHTML = `<div class="adm"><h1 style="font-size:44px">Admin</h1><form id="af" style="display:flex;gap:10px;max-width:420px;margin-top:16px"><input id="ap" type="password" placeholder="Admin password" autocomplete="current-password" style="flex:1;font:inherit;padding:8px 12px;border:1px solid var(--grid);border-radius:6px;background:var(--sheet);color:var(--ink)"><button class="btn pri">Open</button></form><p id="ae" class="small" style="color:var(--bad)"></p></div>`;
    $('#ap').focus();
    $('#af').onsubmit = async e => {
      e.preventDefault(); $('#ae').textContent = 'Loading…';
      try {
        const r = await fetch(CFG.url + '/rest/v1/rpc/admin_data', { method: 'POST', headers: { apikey: CFG.key, Authorization: 'Bearer ' + CFG.key, 'Content-Type': 'application/json' }, body: JSON.stringify({ pass: $('#ap').value }) });
        const j = await r.json(); if (!r.ok) throw new Error(j.message || 'Wrong password');
        ADM = j; ADM.pass = $('#ap').value; admin();
      } catch (err) { $('#ae').textContent = err.message.includes('password') ? 'Wrong password.' : 'Could not load: ' + err.message; }
    };
    return;
  }
  const ev = ADM.events || [], st = ADM.students || [];
  const by = {}; st.forEach(s => by[s.id] = { ...s, ev: [] }); ev.forEach(e => by[e.student_id] && by[e.student_id].ev.push(e));
  const fmt = t => t ? new Date(t).toLocaleString('en-GB', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
  const rows = Object.values(by).map(s => {
    const learn = new Set(s.ev.filter(e => e.kind === 'learn').map(e => e.ref)).size;
    const exOk = new Set(s.ev.filter(e => e.kind === 'exercise' && e.ok).map(e => e.ref)).size;
    const exTry = s.ev.filter(e => e.kind === 'exercise').length;
    const quiz = s.ev.filter(e => e.kind === 'quiz'), mock = s.ev.filter(e => e.kind === 'mock');
    const best = a => a.length ? Math.max(...a.map(e => Math.round(100 * e.score / e.total))) : null;
    const last = s.ev.length ? s.ev[0].at : s.created_at;
    return { s, learn, exOk, exTry, quizBest: best(quiz), quizN: quiz.length, mockBest: best(mock), mockN: mock.length, mockLast: mock[0], last };
  }).sort((a, b) => new Date(b.last) - new Date(a.last));
  const day = Date.now() - 864e5;
  app.innerHTML = `<div class="adm"><div style="display:flex;align-items:baseline;gap:14px;flex-wrap:wrap"><h1 style="font-size:44px">Admin</h1><button class="btn sm" id="arf">Refresh</button></div>
    <div class="kpis"><div>${st.length}<span>students</span></div><div>${rows.filter(r => new Date(r.last) > day).length}<span>active last 24 h</span></div><div>${ev.filter(e => e.kind === 'mock').length}<span>mock exams taken</span></div><div>${ev.filter(e => e.kind === 'exercise' && e.ok).length}<span>exercises solved</span></div></div>
    <table class="set"><thead><tr><th>name</th><th>last active</th><th>learn steps</th><th>exercises solved</th><th>quiz best</th><th>mock best</th><th>last mock</th></tr></thead><tbody>
    ${rows.map(r => `<tr class="link" data-id="${r.s.id}"><td class="t">${esc(r.s.name)}</td><td class="who">${fmt(r.last)}</td><td class="num">${r.learn} / ${LSTEPS.length}</td><td class="num">${r.exOk} <span class="muted">(${r.exTry} checks)</span></td><td class="num">${r.quizBest == null ? '–' : r.quizBest + '% (' + r.quizN + 'x)'}</td><td class="num">${r.mockBest == null ? '–' : r.mockBest + '% (' + r.mockN + 'x)'}</td><td class="num">${r.mockLast ? r.mockLast.score + '/' + r.mockLast.total + ' ' + fmt(r.mockLast.at) : '–'}</td></tr>`).join('') || '<tr><td colspan="7" class="muted">Nobody has signed in yet. Share the site link.</td></tr>'}
    </tbody></table><div id="adet"></div></div>`;
  $('#arf').onclick = async () => { const p = ADM.pass; ADM = null; app.innerHTML = '<p class="loading">Refreshing…</p>'; const r = await fetch(CFG.url + '/rest/v1/rpc/admin_data', { method: 'POST', headers: { apikey: CFG.key, Authorization: 'Bearer ' + CFG.key, 'Content-Type': 'application/json' }, body: JSON.stringify({ pass: p }) }); ADM = await r.json(); ADM.pass = p; admin(); };
  $$('tr[data-id]').forEach(tr => tr.onclick = () => {
    const s = by[tr.dataset.id], name = k => k === 'learn' ? 'Learn step' : k === 'exercise' ? 'Exercise' : k === 'quiz' ? 'Quiz' : k === 'mock' ? 'Mock exam' : k === 'join' ? 'Joined' : k;
    const what = e => e.kind === 'exercise' ? `${EX[+e.ref] ? esc(EX[+e.ref].q.replace(/<[^>]+>/g, '').slice(0, 90)) : e.ref} <b style="color:var(${e.ok ? '--ok' : '--bad'})">${e.ok ? 'correct' : 'wrong'}</b>` : e.kind === 'learn' ? esc((LSTEPS.find(x => x.key === e.ref) || {}).t || e.ref) : e.kind === 'quiz' ? `${e.score}/${e.total} (${esc(e.ref === 'all' ? 'everything' : CHN[e.ref] || e.ref)})` : e.kind === 'mock' ? `<b>${e.score}/${e.total}</b>${(e.detail || []).map((d, n) => `<details style="margin-top:4px"><summary>Q${n + 1} ${d.ok ? '✓' : '✗'} ${EX[d.q] ? esc(EX[d.q].q.replace(/<[^>]+>/g, '').slice(0, 70)) : ''}</summary><pre class="code">${hl(d.sql || '(no answer)')}</pre></details>`).join('')}` : '';
    $('#adet').innerHTML = `<section class="sec"><h2>${esc(s.name)}</h2><p class="sub">Joined ${fmt(s.created_at)}. ${s.ev.length} recorded actions.</p><table class="set"><tbody>${s.ev.slice(0, 300).map(e => `<tr><td class="who">${fmt(e.at)}</td><td class="w">${name(e.kind)}</td><td class="d">${what(e)}</td></tr>`).join('')}</tbody></table></section>`;
    $('#adet').scrollIntoView({ behavior: 'smooth' });
  });
}

/* ---------- cheat sheet ---------- */
function cheat(){
  app.innerHTML = `<h1 style="font-size:44px">Cheat sheet</h1><p class="muted">The whole term on one page.</p><div class="cheat" style="margin-top:24px">${CHEAT.map(c => `<div class="c"><h3>${esc(c.t)}</h3>${c.b}</div>`).join('')}</div>`;
  $$('.cheat pre', app).forEach(p => p.innerHTML = hl(p.textContent));
}

function route(){
  const [r, a] = location.hash.replace(/^#\/?/, '').split('/');
  nav(r === 'ex' ? 'exercises' : r || '');
  const f = { '': home, start: () => start(a), admin, learn: () => learn(a), play, exercises: () => exercises(a), ex: () => exercise(a), quiz, mock, cheat }[r || ''] || home;
  f(); if (r !== 'quiz' || !QS) scrollTo(0, 0);
}
addEventListener('hashchange', route); route(); gate();
setTimeout(startDB, 300);
window.__rdb = { run, check, EX, QZ, startDB, norm };
</script>
</body>
</html>
