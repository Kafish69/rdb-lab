<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rdb.lab — Relational Database Fundamentals</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F6F8; --sheet:#FFFFFF; --ink:#102A43; --ink2:#486581; --ink3:#829AB1;
  --grid:#D9E2EC; --grid2:#E8EEF3; --key:#F0B429; --keybg:#FFF6DA; --rel:#2F6FED; --relbg:#E8F0FE;
  --ok:#1C8B5E; --okbg:#E3F6EE; --bad:#C93A3A; --badbg:#FDECEC;
  --sans:"IBM Plex Sans",system-ui,sans-serif; --cond:"IBM Plex Sans Condensed","IBM Plex Sans",sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  --r:6px;
}
[data-theme=dark]{ --paper:#0E1A26; --sheet:#132233; --ink:#E4EBF2; --ink2:#9FB3C8; --ink3:#627D98; --grid:#24384D; --grid2:#1B2D40; --keybg:#3A2F12; --relbg:#16294A; --okbg:#10352A; --badbg:#3E1A1C }
*{box-sizing:border-box}
[hidden]{display:none!important}
.exgrid{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:22px;align-items:start}
.exgrid summary{cursor:pointer;font-weight:600;margin-bottom:8px;color:var(--ink2)}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 var(--sans)}
a{color:var(--rel)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--rel);outline-offset:2px}
code,kbd{font-family:var(--mono);font-size:.88em;background:var(--grid2);padding:.08em .35em;border-radius:4px}
h1,h2,h3{font-family:var(--cond);line-height:1.15;letter-spacing:-.01em;margin:0}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--grid)}
.bar{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:22px;padding:0 20px;height:56px}
.mark{font:600 19px var(--mono);text-decoration:none;color:var(--ink);white-space:nowrap}
.mark b{color:var(--key);font-weight:600}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1}
.nav a{padding:7px 11px;border-radius:var(--r);text-decoration:none;color:var(--ink2);font-weight:500;font-size:15px;white-space:nowrap}
.nav a:hover{color:var(--ink);background:var(--grid2)}
.nav a.on{color:var(--ink);background:var(--sheet);box-shadow:inset 0 0 0 1px var(--grid)}
.tbtn{border:1px solid var(--grid);background:var(--sheet);border-radius:var(--r);padding:5px 10px;cursor:pointer;font-size:14px;color:var(--ink2)}
.dbstat{font-size:13px;color:var(--ink3);white-space:nowrap}
.dbstat i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ink3);margin-right:6px;vertical-align:1px}
.dbstat.ready i{background:var(--ok)}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 80px}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:40px;align-items:start;padding:26px 0 40px}
.hero h1{font-size:clamp(44px,6.4vw,84px);font-weight:700;line-height:.95;letter-spacing:-.03em}
.hero p{font-size:18px;color:var(--ink2);max-width:34ch;margin:18px 0 22px}
.hero .ctas{display:flex;gap:10px;flex-wrap:wrap}

/* buttons */
.btn{border:1px solid var(--grid);background:var(--sheet);border-radius:var(--r);padding:8px 14px;cursor:pointer;font-weight:500;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:8px;font-size:15px}
.btn:hover{border-color:var(--ink3)}
.btn.pri{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btn.pri:hover{opacity:.9}
.btn.gold{background:var(--key);border-color:var(--key);color:#102A43}
.btn.sm{padding:4px 10px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:default}

/* console (editor + result) */
.console{background:var(--sheet);border:1px solid var(--grid);border-radius:10px;overflow:hidden}
.ctool{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--grid);background:var(--grid2);font-size:13px;color:var(--ink2)}
.ctool .sp{flex:1}
.ctool select{font:inherit;border:1px solid var(--grid);border-radius:5px;background:var(--sheet);color:var(--ink);padding:2px 6px}
.ed{position:relative;font:14px/1.6 var(--mono)}
.ed pre,.ed textarea{margin:0;padding:12px 14px 12px 14px;font:inherit;white-space:pre-wrap;word-wrap:break-word;tab-size:2}
.ed pre{position:absolute;inset:0;pointer-events:none;overflow:hidden;color:var(--ink)}
.ed textarea{position:relative;display:block;width:100%;min-height:inherit;border:0;resize:vertical;background:transparent;color:transparent;caret-color:var(--ink);outline:none;overflow:hidden}
.ed textarea::selection{background:var(--relbg);color:transparent}
.kw{color:var(--rel);font-weight:600}.fn{color:#8A4FD6}.st{color:#B7791F}[data-theme=dark] .st{color:#F0B429}.nu{color:var(--ok)}.cm{color:var(--ink3);font-style:italic}
.cbar{display:flex;gap:8px;align-items:center;padding:8px 10px;border-top:1px solid var(--grid);flex-wrap:wrap}
.cbar .hint{font-size:13px;color:var(--ink3);margin-left:auto}
.res{border-top:1px solid var(--grid);max-height:380px;overflow:auto}
.res:empty{display:none}
.res .msg{padding:10px 14px;font-size:14px}
.res .msg.err{background:var(--badbg);color:var(--bad);font-family:var(--mono);font-size:13px}
.res .msg.okm{color:var(--ink2)}
table.rs{border-collapse:collapse;font:13px/1.45 var(--mono);width:max-content;min-width:100%}
table.rs th{position:sticky;top:0;background:var(--sheet);text-align:left;font-weight:600;padding:6px 12px;border-bottom:2px solid var(--grid);white-space:nowrap}
table.rs td{padding:5px 12px;border-bottom:1px solid var(--grid2);white-space:nowrap;max-width:340px;overflow:hidden;text-overflow:ellipsis}
table.rs td.n{text-align:left}
table.rs td .null{color:var(--ink3);font-style:italic}
table.rs tr:hover td{background:var(--grid2)}
.rcount{font-size:12px;color:var(--ink3);padding:6px 12px;border-top:1px solid var(--grid2)}

/* sections */
.sec{margin-top:54px}
.sec>h2{font-size:30px;margin-bottom:6px}
.sec>p.sub{color:var(--ink2);margin:0 0 18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}

/* "result-set" style lists */
table.set{border-collapse:collapse;width:100%;background:var(--sheet);border:1px solid var(--grid);border-radius:10px;overflow:hidden}
table.set th{text-align:left;font:600 13px var(--sans);color:var(--ink3);padding:9px 14px;border-bottom:1px solid var(--grid);background:var(--grid2)}
table.set td{padding:12px 14px;border-bottom:1px solid var(--grid2);vertical-align:top}
table.set tr:last-child td{border-bottom:0}
table.set tr.link{cursor:pointer}
table.set tr.link:hover td{background:var(--grid2)}
table.set .w{font:500 13px var(--mono);color:var(--ink3);white-space:nowrap}
table.set .t{font-weight:600}
table.set .d{color:var(--ink2);font-size:14px}
.bar5{display:inline-block;width:90px;height:6px;border-radius:3px;background:var(--grid2);vertical-align:middle;overflow:hidden}
.bar5 i{display:block;height:100%;background:var(--key)}
.num{font:500 13px var(--mono);color:var(--ink2);white-space:nowrap}

/* notes */
.lay{display:grid;grid-template-columns:230px minmax(0,1fr);gap:44px}
.toc{position:sticky;top:76px;align-self:start;font-size:14px}
.toc a{display:block;padding:5px 10px;border-left:2px solid var(--grid);text-decoration:none;color:var(--ink2)}
.toc a.on{border-color:var(--key);color:var(--ink);font-weight:600}
.toc .wk{font:500 12px var(--mono);color:var(--ink3);display:block}
.doc{max-width:780px}
.doc .eyebrow{font:500 14px var(--mono);color:var(--ink3)}
.doc h1{font-size:44px;margin:4px 0 10px}
.doc h2{font-size:25px;margin:40px 0 10px;padding-top:6px}
.doc p,.doc li{font-size:16.5px}
.doc .lead{font-size:19px;color:var(--ink2)}
.doc ul,.doc ol{padding-left:22px}
.doc li{margin:4px 0}
.doc b{font-weight:600;background:linear-gradient(transparent 62%,var(--keybg) 62%)}
table.t{border-collapse:collapse;width:100%;margin:12px 0;font-size:15px;background:var(--sheet);border:1px solid var(--grid)}
table.t th{text-align:left;background:var(--grid2);font-weight:600;padding:7px 10px;border-bottom:1px solid var(--grid)}
table.t td{padding:7px 10px;border-bottom:1px solid var(--grid2);vertical-align:top}
.key,.trap{border-radius:8px;padding:4px 16px;margin:16px 0}
.key{background:var(--keybg);border-left:4px solid var(--key)}
.trap{background:var(--badbg);border-left:4px solid var(--bad)}
.doc .key b,.doc .trap b{background:none}
.runbox{margin:14px 0}
.runbox .console{border-radius:8px}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:50px;border-top:1px solid var(--grid);padding-top:20px}
.pager a{text-decoration:none;color:var(--ink2);font-size:14px}.pager a b{display:block;color:var(--ink);font-size:17px}
.small{font-size:14px}.muted{color:var(--ink3)}

/* schema */
.schema{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin:14px 0;align-items:start}
.tb{background:var(--sheet);border:1px solid var(--grid);border-radius:8px;overflow:hidden;font-size:13px}
.tb h4{margin:0;padding:7px 10px;font:600 14px var(--mono);background:var(--ink);color:var(--paper);display:flex;justify-content:space-between;cursor:pointer}
.tb h4 span{font-weight:400;opacity:.7;font-size:12px}
.tb div{padding:3px 10px;font-family:var(--mono);display:flex;gap:6px;align-items:baseline;border-bottom:1px solid var(--grid2)}
.tb div:last-child{border:0}
.tb .ty{margin-left:auto;color:var(--ink3);font-size:11.5px}
.tb .pk{color:var(--ink);font-weight:600}
.tg{font:600 10px var(--sans);border-radius:3px;padding:0 4px}
.tg.p{background:var(--key);color:#102A43}.tg.f{background:var(--relbg);color:var(--rel)}

/* playground */
.play{display:grid;grid-template-columns:270px minmax(0,1fr);gap:20px}
.side{display:flex;flex-direction:column;gap:10px}
.side .schema{grid-template-columns:1fr;margin:0}

/* exercises */
.exhead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
@media (max-width:600px){.exbox{padding:12px;gap:10px}.exn{width:24px;height:24px;font-size:12px}}
.exq{font-size:19px;margin:10px 0 16px;max-width:820px}
.verdict{padding:10px 14px;font-weight:500;font-size:15px}
.verdict.ok{background:var(--okbg);color:var(--ok)}
.verdict.no{background:var(--badbg);color:var(--bad)}
.sol{margin-top:14px}
.dots{display:flex;flex-wrap:wrap;gap:5px}
.dot{width:26px;height:26px;border-radius:5px;border:1px solid var(--grid);background:var(--sheet);font:500 11px var(--mono);display:grid;place-items:center;text-decoration:none;color:var(--ink2)}
.dot.done{background:var(--ok);border-color:var(--ok);color:#fff}
.dot.cur{outline:2px solid var(--key);outline-offset:1px}

/* quiz */
.qcard{background:var(--sheet);border:1px solid var(--grid);border-radius:10px;padding:22px;max-width:760px}
.qcard h3{font:500 20px/1.4 var(--sans);margin-bottom:14px}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--grid);background:var(--sheet);border-radius:8px;padding:10px 14px;margin:8px 0;cursor:pointer;font-size:15.5px}
.opt:hover{border-color:var(--ink3)}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad)}
.opt .c{font-family:var(--mono);font-size:.92em}
pre.code{font:13.5px/1.55 var(--mono);background:var(--grid2);border-radius:8px;padding:10px 14px;white-space:pre-wrap;margin:10px 0}
.expl{margin-top:12px;padding:10px 14px;border-radius:8px;background:var(--grid2);font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 18px}
.chip{border:1px solid var(--grid);background:var(--sheet);border-radius:20px;padding:4px 12px;cursor:pointer;font-size:14px}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.progress{height:4px;background:var(--grid2);border-radius:2px;margin:12px 0 20px;max-width:760px}
.progress i{display:block;height:100%;background:var(--key);border-radius:2px;transition:width .3s}

/* cheat */
.cheat{columns:2 340px;column-gap:24px}
.cheat .c{break-inside:avoid;background:var(--sheet);border:1px solid var(--grid);border-radius:8px;padding:12px 16px;margin:0 0 18px}
.cheat h3{font-size:19px;margin-bottom:6px}
.cheat pre{font:13px/1.55 var(--mono);margin:6px 0;white-space:pre-wrap}
.cheat p{margin:4px 0;font-size:14.5px}

.loading{padding:30px;color:var(--ink3)}
/* explanations */
.understand{margin-top:12px;background:var(--keybg);border-radius:8px;padding:10px 14px;font-size:15px}
.understand ul{margin:4px 0 0;padding-left:18px}.understand li{margin:3px 0}
.why{font-size:14px;color:var(--ink2);margin:2px 0 8px}
/* example boxes */
.lbox{background:var(--sheet);border:1px solid var(--grid);border-radius:10px;overflow:hidden}
.lpart{border-bottom:1px solid var(--grid)}.lpart:last-child{border:0}
.lh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;background:var(--grid2);font-size:14px}
.lh .sp{flex:1}
.doc .lh b,.lstep .lh b{background:none}
.ln{width:20px;height:20px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font:600 11px var(--mono)}
.ldata{padding:8px 12px 2px}
.lbox .res{border-top:0;max-height:300px}
.lbox .cbar{border-top:1px solid var(--grid2)}
/* playground guide */
.pguide{background:var(--sheet);border:1px solid var(--grid);border-left:4px solid var(--key);border-radius:10px;padding:14px 20px;max-width:900px;margin-top:10px}
.pguide p,.pguide li{font-size:15.5px}.pguide ol{padding-left:20px;margin:6px 0}
/* exercise flow */
.exflow{display:flex;flex-direction:column;gap:14px;max-width:980px}
.exbox{display:flex;gap:16px;background:var(--sheet);border:1px solid var(--grid);border-radius:10px;padding:16px 18px}
.exbox h3{font:600 17px var(--sans)}
.exn{flex:none;width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font:600 14px var(--mono)}
.dtab{margin-bottom:12px}.dname{font:600 14px var(--mono);margin-bottom:4px}
table.rs th.hot{background:var(--key);color:#102A43}
table.rs td.hot{background:var(--keybg)}
ol.steps{padding-left:20px;margin:6px 0}ol.steps li{margin-bottom:6px}ol.steps pre{margin:4px 0}
/* learn */
.lrn{display:grid;grid-template-columns:250px minmax(0,1fr);gap:40px}
.lmap{position:sticky;top:76px;align-self:start;max-height:calc(100vh - 96px);overflow:auto;font-size:14px}
.lmap h4{font:600 13px var(--sans);color:var(--ink3);margin:14px 0 4px}
.lmap a{display:flex;gap:8px;align-items:center;padding:4px 6px;border-radius:5px;text-decoration:none;color:var(--ink2)}
.lmap a:hover{background:var(--grid2)}
.lmap a.on{background:var(--sheet);color:var(--ink);font-weight:600;box-shadow:inset 0 0 0 1px var(--grid)}
.lmap .ck{flex:none;width:16px;height:16px;border-radius:50%;border:1.5px solid var(--grid);display:grid;place-items:center;font-size:10px;color:#fff}
.lmap .ck.d{background:var(--ok);border-color:var(--ok)}
.lstep{max-width:780px}
.lstep .unit{font:500 14px var(--mono);color:var(--ink3)}
.lstep h1{font-size:40px;margin:4px 0 14px}
.lstep .x p{font-size:17.5px}
.lstep .x b{font-weight:600;background:linear-gradient(transparent 62%,var(--keybg) 62%)}
.yourturn{margin-top:28px;border-top:2px solid var(--key);padding-top:14px}
.yourturn h2{font-size:22px;margin-bottom:6px}
.lnav{display:flex;gap:10px;margin-top:26px;align-items:center}
@media (max-width:900px){
  .hero,.grid2,.lay,.play,.exgrid,.lrn{grid-template-columns:1fr}
  .lmap{position:static;max-height:220px}
  .toc{position:static;display:flex;overflow-x:auto;gap:4px}
  .toc a{border-left:0;border-bottom:2px solid var(--grid);white-space:nowrap}
  .toc .wk{display:none}
  .dbstat span{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top"><div class="bar">
  <a class="mark" href="#/">rdb<b>.</b>lab</a>
  <nav class="nav" id="nav"></nav>
  <span class="dbstat" id="dbstat"><i></i><span>starting PostgreSQL</span></span>
  <button class="tbtn" id="theme" aria-label="Toggle dark mode">dark</button>
</div></header>
<main class="wrap" id="app"></main>
<script type="module">
const DATA = {"learn":[{"title":"What a database is","sub":"Tables, rows, columns and keys. No code yet.","steps":[{"t":"A table is a list with columns","x":"<p>A database stores data in <b>tables</b>. A table looks like a spreadsheet: every <b>row</b> is one thing (one employee) and every <b>column</b> is one property of it (last name, salary).</p><p>Below is part of the <code>employees</code> table. Press Run to see it.</p>","ex":"SELECT employee_id, last_name, first_name, salary\nFROM employees;","mcq":{"q":"In the employees table, what is one row?","o":["One employee","One column","All salaries","The whole table"],"a":0,"why":"Each row describes one employee."}},{"t":"Why not just a spreadsheet?","x":"<p>Imagine typing a customer's address every time they buy something. Soon the same address is in 20 rows (<b>redundancy</b>) and one of them has a typo, so you don't know which is right (<b>inconsistency</b>).</p><p>A database splits data into separate tables so every fact is stored <b>once</b>. The software that manages the database is the <b>DBMS</b>. We use PostgreSQL.</p>","ex":null,"mcq":{"q":"The same address is stored in many rows. What's that called?","o":["Redundancy","A primary key","A query","A DBMS"],"a":0,"why":""}},{"t":"Every row needs a unique id: the primary key","x":"<p>Two employees could have the same name. So every table has a <b>primary key (PK)</b>: a column whose value is <b>different for every row</b> and <b>never empty</b>. In <code>employees</code> that's <code>employee_id</code>.</p>","ex":"SELECT employee_id, last_name\nFROM employees;","mcq":{"q":"Which column is the primary key of employees?","o":["employee_id","last_name","salary","department_id"],"a":0,"why":"It's unique and never empty."}},{"t":"Tables are linked with foreign keys","x":"<p>An employee works in a department. Instead of writing the department's name in every employee row, the employee row stores the department's <b>number</b>: <code>employees.department_id</code>. That column points to the primary key of <code>departments</code>. A column that points to another table's PK is a <b>foreign key (FK)</b>.</p>","ex":"SELECT department_id, department_name\nFROM departments;","mcq":{"q":"employees.department_id is 7. What does that tell you?","o":["The employee works in the department whose department_id is 7","The employee has 7 departments","The employee's id is 7","Nothing"],"a":0,"why":""}}]},{"title":"Your first queries","sub":"SELECT and FROM: get columns out of one table.","steps":[{"t":"SELECT * shows everything","x":"<p>A question to the database is a <b>query</b>. The simplest one: <code>SELECT *</code> (= all columns) <code>FROM</code> a table. End it with <code>;</code>.</p>","ex":"SELECT *\nFROM departments;","task":{"q":"Show all columns of the table projects.","sol":"SELECT * FROM projects;","hint":"SELECT * FROM table_name;"}},{"t":"Pick only the columns you need","x":"<p>Instead of <code>*</code>, list the columns you want, separated by commas. They appear in the order you write them.</p>","ex":"SELECT last_name, salary\nFROM employees;","task":{"q":"Show the first name and last name of every employee.","sol":"SELECT first_name, last_name FROM employees;","hint":"Two column names with a comma between them."}},{"t":"Rename a column with AS","x":"<p>An <b>alias</b> changes the column header in the result. Want capitals or spaces? Put it in <b>double quotes</b>.</p>","ex":"SELECT last_name AS \"Family name\", salary AS yearly\nFROM employees;","task":{"q":"Show project_name with the header <b>project</b> and location with the header <b>city</b>.","sol":"SELECT project_name AS project, location AS city FROM projects;","hint":""}},{"t":"Calculate and glue text","x":"<p>You can calculate in SELECT (<code>+ - * /</code>) and glue text with <code>||</code>. Text you type yourself goes in <b>single quotes</b>.</p>","ex":"SELECT last_name, salary / 12 AS per_month,\n       first_name || ' ' || last_name AS full_name\nFROM employees;","task":{"q":"Show each employee's last name and their salary with a 10% raise (salary * 1.1).","sol":"SELECT last_name, salary * 1.1 FROM employees;","hint":""}},{"t":"Remove duplicates with DISTINCT","x":"<p>Several employees work in the same department. <code>DISTINCT</code> shows each value only once.</p>","ex":"SELECT DISTINCT department_id\nFROM employees;","task":{"q":"Show every province where employees live, each only once.","sol":"SELECT DISTINCT province FROM employees;","hint":""}}]},{"title":"Filtering rows","sub":"WHERE: only the rows you want.","steps":[{"t":"WHERE keeps the rows that match","x":"<p>Add <code>WHERE</code> with a condition. Only rows where it's true come back. Numbers are written without quotes.</p>","ex":"SELECT last_name, salary\nFROM employees\nWHERE salary > 40000;","task":{"q":"Show last name and salary of the employees earning less than 30000.","sol":"SELECT last_name, salary FROM employees WHERE salary < 30000;","hint":""}},{"t":"Text needs single quotes","x":"<p>To compare with text, put the text in <b>single quotes</b>. Upper and lower case matter: <code>'bock'</code> is not <code>'Bock'</code>.</p>","ex":"SELECT employee_id, first_name\nFROM employees\nWHERE last_name = 'Bock';","task":{"q":"Show all columns of the employee whose first name is Suzan.","sol":"SELECT * FROM employees WHERE first_name = 'Suzan';","hint":"WHERE first_name = '…'"}},{"t":"Ignore upper/lower case with UPPER","x":"<p>Data isn't always typed the same way. One employee lives in <code>'MAASTRICHT'</code>, others in <code>'Maastricht'</code>. Convert the column first, then compare with capitals.</p>","ex":"SELECT last_name, location\nFROM employees\nWHERE UPPER(location) = 'MAASTRICHT';","task":{"q":"Show last name and location of everyone living in Eindhoven, however it's written.","sol":"SELECT last_name, location FROM employees WHERE UPPER(location) = 'EINDHOVEN';","hint":""}},{"t":"AND, OR and brackets","x":"<p><code>AND</code>: both must be true. <code>OR</code>: one is enough. AND is done before OR, so use <b>brackets</b> when you mix them.</p>","ex":"SELECT last_name, salary, department_id\nFROM employees\nWHERE salary > 30000\n  AND (department_id = 1 OR department_id = 3);","task":{"q":"Show last name and gender of the female employees (gender 'F') in department 7.","sol":"SELECT last_name, gender FROM employees WHERE gender = 'F' AND department_id = 7;","hint":""}},{"t":"BETWEEN and IN","x":"<p><code>BETWEEN 25000 AND 40000</code> includes both limits (small number first). <code>IN (…)</code> is a short way to write many ORs.</p>","ex":"SELECT last_name, province\nFROM employees\nWHERE province IN ('LI', 'NB');","task":{"q":"Show employee_id, project_id and hours of the tasks with between 10 and 20 hours.","sol":"SELECT employee_id, project_id, hours FROM tasks WHERE hours BETWEEN 10 AND 20;","hint":""}},{"t":"LIKE: search with a pattern","x":"<p><code>%</code> means \"anything (or nothing)\", <code>_</code> means \"exactly one character\". <code>'B%'</code> = starts with B, <code>'%s'</code> = ends with s.</p>","ex":"SELECT last_name\nFROM employees\nWHERE last_name LIKE 'J%';","task":{"q":"Show the last names that end with 's'.","sol":"SELECT last_name FROM employees WHERE last_name LIKE '%s';","hint":""}},{"t":"Empty values: IS NULL","x":"<p>An empty cell is <b>NULL</b>. You can't use <code>= NULL</code> (it never matches). Always write <code>IS NULL</code> or <code>IS NOT NULL</code>.</p>","ex":"SELECT employee_id, project_id, hours\nFROM tasks\nWHERE hours IS NULL;","task":{"q":"Show the last name of every employee who HAS a manager (manager_id not empty).","sol":"SELECT last_name FROM employees WHERE manager_id IS NOT NULL;","hint":""}}]},{"title":"Sorting and limiting","sub":"ORDER BY, OFFSET and FETCH.","steps":[{"t":"ORDER BY sorts the result","x":"<p><code>ASC</code> = small to big (default), <code>DESC</code> = big to small. Sort on several columns with commas: the second one only matters when the first is equal.</p>","ex":"SELECT last_name, salary\nFROM employees\nORDER BY salary DESC, last_name;","task":{"q":"Show last name and birth date of all employees, oldest first.","sol":"SELECT last_name, birth_date FROM employees ORDER BY birth_date;","hint":"Oldest = earliest date = ascending."}},{"t":"Only the top rows: FETCH","x":"<p>After ORDER BY you can cut the list: <code>FETCH FIRST 3 ROWS ONLY</code>. <code>WITH TIES</code> also keeps rows that are equal to the last one. <code>OFFSET 2 ROWS</code> skips rows first.</p>","ex":"SELECT last_name, salary\nFROM employees\nORDER BY salary DESC\nFETCH FIRST 2 ROWS WITH TIES;","task":{"q":"Show the 2 employees with the highest salary (last name and salary). Use ONLY, sorted from high to low.","sol":"SELECT last_name, salary FROM employees ORDER BY salary DESC FETCH FIRST 2 ROWS ONLY;","hint":""}},{"t":"The order SQL actually runs in","x":"<p>You write SELECT first, but the database does: <b>FROM → WHERE → SELECT → ORDER BY → FETCH</b>. So an alias from SELECT can be used in ORDER BY, but not in WHERE.</p>","ex":null,"mcq":{"q":"Which runs first?","o":["WHERE","SELECT","ORDER BY","FETCH"],"a":0,"why":"FROM, then WHERE, then SELECT."}}]},{"title":"Functions","sub":"Change how values look: text, numbers, dates.","steps":[{"t":"Text functions","x":"<p><code>UPPER</code>, <code>LOWER</code>, <code>LENGTH</code> (number of characters), <code>SUBSTRING(text, start, length)</code> (a piece of the text).</p>","ex":"SELECT last_name, UPPER(last_name), LENGTH(last_name),\n       SUBSTRING(last_name, 1, 3) AS first3\nFROM employees;","task":{"q":"Show every last name in lowercase.","sol":"SELECT LOWER(last_name) FROM employees;","hint":""}},{"t":"Rounding numbers","x":"<p><code>ROUND(x, 2)</code> rounds to 2 decimals. <code>TRUNC(x)</code> just cuts the decimals off.</p>","ex":"SELECT last_name, salary / 12, ROUND(salary / 12, 2), TRUNC(salary / 12)\nFROM employees;","task":{"q":"Show last name and the monthly salary (salary / 12) rounded to whole euros.","sol":"SELECT last_name, ROUND(salary / 12) FROM employees;","hint":""}},{"t":"Dates: today, age and differences","x":"<p><code>current_date</code> is today. <code>current_date - birth_date</code> gives a number of days. <code>age(birth_date)</code> gives years, months and days. <code>date_part('year', …)</code> takes one part out.</p>","ex":"SELECT last_name, birth_date, age(birth_date),\n       date_part('year', age(birth_date)) AS years\nFROM employees;","task":{"q":"Show the name of each family member and their age in whole years.","sol":"SELECT name, date_part('year', age(birth_date)) FROM family_members;","hint":""}},{"t":"Format a date with TO_CHAR","x":"<p><code>TO_CHAR(date, 'mask')</code> turns a date into text: <code>DD</code> day, <code>MM</code> month number, <code>YYYY</code> year, <code>FMMonth</code> month name without extra spaces.</p>","ex":"SELECT name, TO_CHAR(birth_date, 'DD/MM/YYYY'), TO_CHAR(birth_date, 'FMMonth YYYY')\nFROM family_members;","task":{"q":"Show each employee's last name and birth date written like 01-09-1965 (DD-MM-YYYY).","sol":"SELECT last_name, TO_CHAR(birth_date, 'DD-MM-YYYY') FROM employees;","hint":""}}]},{"title":"Joining tables","sub":"Combine rows from two tables.","steps":[{"t":"Why we need a join","x":"<p>employees only has <code>department_id</code>. The <b>name</b> of the department is in <code>departments</code>. A <b>JOIN</b> puts the matching rows side by side, using the FK = PK condition after <code>ON</code>.</p>","ex":"SELECT e.last_name, d.department_name\nFROM employees e\nJOIN departments d ON (e.department_id = d.department_id);","task":{"q":"Show every project's name with the name of the department that supports it.","sol":"SELECT p.project_name, d.department_name FROM projects p JOIN departments d ON (p.department_id = d.department_id);","hint":"projects.department_id = departments.department_id"}},{"t":"Short names for tables","x":"<p><code>employees e</code> gives the table the nickname <code>e</code>. When a column exists in both tables (like department_id) you <b>must</b> say which one: <code>e.department_id</code>.</p>","ex":null,"mcq":{"q":"Why does SELECT department_id … FROM employees e JOIN departments d … give an error?","o":["department_id exists in both tables, so it's ambiguous","department_id doesn't exist","You can't join on numbers","JOIN needs WHERE"],"a":0,"why":""}},{"t":"Three tables in a chain","x":"<p><code>tasks</code> connects employees and projects (who works on what, and how many hours). Join them one after the other.</p>","ex":"SELECT e.last_name, p.project_name, t.hours\nFROM employees e\nJOIN tasks t ON (e.employee_id = t.employee_id)\nJOIN projects p ON (t.project_id = p.project_id);","task":{"q":"Show each family member's name with the last name of the employee they belong to.","sol":"SELECT f.name, e.last_name FROM family_members f JOIN employees e ON (f.employee_id = e.employee_id);","hint":""}},{"t":"A table joined with itself","x":"<p>An employee's boss is also an employee. Use the same table twice with two nicknames: <code>e</code> for the employee, <code>boss</code> for the manager.</p>","ex":"SELECT e.last_name, boss.last_name AS boss\nFROM employees e\nJOIN employees boss ON (e.manager_id = boss.employee_id);","task":{"q":"Show the last names of the employees whose boss is Zhu.","sol":"SELECT e.last_name FROM employees e JOIN employees boss ON (e.manager_id = boss.employee_id) WHERE boss.last_name = 'Zhu';","hint":""}}]},{"title":"Counting and grouping","sub":"COUNT, SUM, AVG, MIN, MAX, GROUP BY, HAVING.","steps":[{"t":"One number from many rows","x":"<p><b>Aggregate functions</b> turn a column into one value: <code>COUNT(*)</code> number of rows, <code>SUM</code>, <code>AVG</code>, <code>MIN</code>, <code>MAX</code>. They skip NULLs (except COUNT(*)).</p>","ex":"SELECT COUNT(*), SUM(salary), AVG(salary), MIN(salary), MAX(salary)\nFROM employees;","task":{"q":"How many family members are there in total?","sol":"SELECT COUNT(*) FROM family_members;","hint":""}},{"t":"Per group: GROUP BY","x":"<p><code>GROUP BY department_id</code> makes one group per department and calculates per group. <b>Rule:</b> every column in SELECT that isn't inside COUNT/SUM/… must be in GROUP BY.</p>","ex":"SELECT department_id, COUNT(*) AS people, ROUND(AVG(salary)) AS avg_salary\nFROM employees\nGROUP BY department_id;","task":{"q":"Show for each project_id the total number of hours worked (from tasks).","sol":"SELECT project_id, SUM(hours) FROM tasks GROUP BY project_id;","hint":""}},{"t":"Filter groups: HAVING","x":"<p><code>WHERE</code> filters rows <b>before</b> grouping. <code>HAVING</code> filters groups <b>after</b> grouping, and can use COUNT/SUM/AVG. You can never put COUNT/SUM in WHERE.</p>","ex":"SELECT department_id, COUNT(*)\nFROM employees\nGROUP BY department_id\nHAVING COUNT(*) > 2;","task":{"q":"Show the project_ids where more than 2 employees work (count the rows in tasks).","sol":"SELECT project_id, COUNT(*) FROM tasks GROUP BY project_id HAVING COUNT(*) > 2;","hint":""}}]},{"title":"Keeping rows without a match","sub":"LEFT JOIN and finding what's missing.","steps":[{"t":"LEFT JOIN keeps everything on the left","x":"<p>A normal JOIN drops employees without family members. <code>LEFT JOIN</code> keeps <b>all</b> rows of the left table and fills the right side with NULL when there's no match.</p>","ex":"SELECT e.last_name, f.name\nFROM employees e\nLEFT JOIN family_members f ON (e.employee_id = f.employee_id);","task":{"q":"Show every department name with its projects, also departments without projects.","sol":"SELECT d.department_name, p.project_name FROM departments d LEFT JOIN projects p ON (d.department_id = p.department_id);","hint":""}},{"t":"Who has nothing? LEFT JOIN + IS NULL","x":"<p>After a LEFT JOIN, the rows without a match have NULL on the right side. Keep only those with <code>WHERE right_table.primary_key IS NULL</code>.</p>","ex":"SELECT e.last_name\nFROM employees e\nLEFT JOIN family_members f ON (e.employee_id = f.employee_id)\nWHERE f.employee_id IS NULL;","task":{"q":"Which employees (last name) don't work on any project?","sol":"SELECT e.last_name FROM employees e LEFT JOIN tasks t ON (e.employee_id = t.employee_id) WHERE t.employee_id IS NULL;","hint":""}},{"t":"You made it","x":"<p>That's the whole term in small steps. Now go to <b>Exercises</b> for the real exam-style questions, and try a <b>Mock exam</b> when you feel ready. The <b>Notes</b> explain every topic in more depth.</p>","ex":null,"mcq":{"q":"Employees without family: which column do you test with IS NULL?","o":["f.employee_id (part of family_members' primary key)","f.birth_date","e.employee_id","e.last_name"],"a":0,"why":"Use a column that is never empty in a real row of the right table."}}]}],"cfg":{},"notes":[{"id":"intro","title":"Databases, keys and data models","week":"Week 1","covers":"DB vs DBMS, keys, integrity rules, data models, SQL groups","html":"<p class=\"lead\">Before you write a single query you need the vocabulary: what a database is, why we don't just use a spreadsheet, and how keys tie tables together.</p>\n\n<h2>Why not just a spreadsheet?</h2>\n<p>A web shop tracks sales in one sheet: name, product, price, quantity, date, address. Anouar buys three times, so his address is typed three times, and once it's different. Two problems appear:</p>\n<ul>\n<li><b>Redundancy</b>: the same data is stored in several places.</li>\n<li><b>Inconsistency</b>: the copies disagree, so you no longer know which one is correct (is that one Anouar who moved, or two different people?).</li>\n</ul>\n<p>The <b>database approach</b> splits the data into subjects called <b>entities</b> (Customer, Product, Order, Address). Each entity becomes a table and every fact is stored once.</p>\n\n<h2>Benefits of the database approach</h2>\n<table class=\"t\"><tr><th>Benefit</th><th>What it means</th></tr>\n<tr><td>Shared data</td><td>Many users and applications use the same data at the same time.</td></tr>\n<tr><td>Integrated and coherent</td><td>All data is stored centrally and related: application → DBMS → DB.</td></tr>\n<tr><td>Low redundancy</td><td>Data isn't stored twice (normalisation), so there are few inconsistencies.</td></tr>\n<tr><td>Data independence</td><td>The structure is described in the database itself (data dictionary), so a structural change doesn't force a change in the application.</td></tr>\n<tr><td>Integrity</td><td>Built-in <b>constraints</b> check business rules automatically (e.g. a maximum rent).</td></tr>\n<tr><td>Security</td><td>Centralised, so it's easier to control who may access what and do which operations.</td></tr>\n<tr><td>Standards</td><td>Easy to agree on names and formats (an address is always street / number / postal code / city).</td></tr></table>\n\n<h2>Database vs DBMS</h2>\n<p><b>Database</b>: an integrated collection of data that can be used by many users at the same time and meets the information needs of an organisation. It contains <b>data and metadata</b> (the structure). The documentation of the structure is kept automatically.</p>\n<p><b>DBMS</b> (DataBase Management System): the <b>software</b> to use and manage the database. PostgreSQL is a DBMS. It lets you:</p>\n<ul><li>retrieve data with queries (SELECT)</li><li>change table contents with DML (INSERT, UPDATE, DELETE)</li><li>define and change the structure with DDL (CREATE, ALTER, DROP)</li><li>handle security, transactions and maintenance (availability, performance, backups)</li></ul>\n\n<h2>Properties of a relational table</h2>\n<ul>\n<li>Every attribute is <b>atomic</b>: one value per cell (a project can't have two department numbers in one cell).</li>\n<li>Every row is <b>unique</b>: no duplicate rows.</li>\n<li>Rows have <b>no order</b>. Column names are unique and their order has no meaning either.</li>\n</ul>\n\n<h2>Terminology</h2>\n<table class=\"t\"><tr><th>Term</th><th>Meaning</th></tr>\n<tr><td>table / relation</td><td>the whole set of rows and columns</td></tr>\n<tr><td>column / attribute</td><td>one property, e.g. <code>salary</code></td></tr>\n<tr><td>row / tuple</td><td>one record</td></tr>\n<tr><td>attribute value</td><td>the value in one cell</td></tr>\n<tr><td>population</td><td>the set of values that actually occur in a column</td></tr>\n<tr><td>domain</td><td>the set of values that are <i>possible</i> for a column</td></tr>\n<tr><td>NULL</td><td>a missing or unknown value. It is not 0 and not an empty string.</td></tr></table>\n\n<h2>The three kinds of key</h2>\n<div class=\"key\"><p><b>Primary key (PK)</b>: an attribute or combination of attributes that uniquely identifies a row. It must be unique and can never be empty. Prefer a meaningless key (an id): the more meaning a key has, the bigger the chance it has to change.</p>\n<p><b>Alternative / candidate key</b>: another attribute that could also have been the PK (email, department_name). It's not used to model relations, but you enforce it with a <b>UNIQUE</b> constraint.</p>\n<p><b>Foreign key (FK)</b>: an attribute that refers to the PK (or a unique attribute) of another table. That's how a relationship between two tables is made. Its data type must match the PK it refers to.</p></div>\n<p>The FK sits on the <b>many side</b> (*) of a relationship, the PK on the <b>one side</b> (1). Every FK is one line in the data model.</p>\n\n<h2>Integrity rules of the relational model</h2>\n<table class=\"t\"><tr><th>Rule</th><th>Says</th></tr>\n<tr><td>Key constraint</td><td>The PK must be unique and stay unique.</td></tr>\n<tr><td>Entity integrity</td><td>The PK must always have a value (never NULL).</td></tr>\n<tr><td>Referential integrity</td><td>The values of an FK must be a <b>subset</b> of the values of the PK it refers to (you can't refer to a department that doesn't exist).</td></tr></table>\n\n<h2>Reading a logical data model</h2>\n<ul>\n<li><b>Entity</b>: capital letter, singular (<code>Employee</code>). <b>Attribute</b>: lowercase with underscores (<code>first_name</code>).</li>\n<li>Tags: <b>&lt;&lt;PK&gt;&gt;</b> primary key, <b>&lt;&lt;FK&gt;&gt;</b> foreign key, <b>&lt;&lt;NN&gt;&gt;</b> not null (mandatory), <b>&lt;&lt;UQ&gt;&gt;</b> unique.</li>\n<li>Multiplicities in this course: <b>1 – *</b> and <b>1 – 1</b>.</li>\n<li><b>Many-to-many</b> can't be stored directly. You add an <b>intermediate entity</b> whose PK is the combination of the two FKs. In the shop: <code>Order(customer_id, product_id, …)</code>. In enterprise: <code>tasks(employee_id, project_id, hours)</code>.</li>\n<li><b>Recursive relationship</b>: an entity related to itself. <code>employees.manager_id</code> refers to <code>employees.employee_id</code>. The CEO has <code>manager_id</code> = NULL.</li>\n</ul>\n<div class=\"trap\"><p>\"Every customer must have an email and no two customers can share one\" → <b>&lt;&lt;NN&gt;&gt; &lt;&lt;UQ&gt;&gt;</b>. Mandatory → NN. Can't repeat → UQ. Both → both tags. It does <b>not</b> become the PK.</p></div>\n<p><b>Logical</b> data model: what do we store and how is it related? <b>Physical</b> data model: how do we build it in a specific DBMS (tables, columns, data types such as <code>INT</code>, <code>VARCHAR(100)</code>, <code>DATE</code>, constraints, indexes).</p>\n\n<h2>The enterprise database</h2>\n<p>All examples and exercises use this database. Click a table name in the playground to see its rows.</p>\n<div class=\"schema\" data-db=\"enterprise\"></div>\n<ul>\n<li><code>employees.department_id</code> → the department the employee <b>works in</b>. <code>departments.manager_id</code> → the employee who <b>manages</b> the department. These are two different relationships.</li>\n<li><code>employees.manager_id</code> → the direct boss (recursive).</li>\n<li><code>tasks</code> is the intermediate table between employees and projects. <code>hours</code> belongs there because it's about one employee on one project.</li>\n<li><code>locations</code> has a composite PK (department_id, location): one department can have several locations.</li>\n<li><code>family_members</code> has PK (employee_id, name): two employees can both have a child called Alex.</li>\n</ul>\n\n<h2>SQL in one picture</h2>\n<p>SQL is <b>declarative</b>: you say <i>what</i> you want, not the steps to get it (that would be procedural). You can use it interactively or embedded in a program (Java, C#…).</p>\n<table class=\"t\"><tr><th>Group</th><th>Statements</th><th>Purpose</th></tr>\n<tr><td>DQL (data retrieval)</td><td>SELECT</td><td>read data</td></tr>\n<tr><td>DML</td><td>INSERT, UPDATE, DELETE</td><td>change the contents</td></tr>\n<tr><td>DDL</td><td>CREATE, ALTER, DROP, TRUNCATE</td><td>create and change objects</td></tr>\n<tr><td>DCL</td><td>GRANT, REVOKE</td><td>security</td></tr>\n<tr><td>Transaction control</td><td>COMMIT, ROLLBACK, SAVEPOINT</td><td>group changes that must succeed or fail together</td></tr></table>\n\n<h2>User profiles</h2>\n<ul><li><b>Data administrator</b>: centrally responsible for the data (what data, which format, which database).</li>\n<li><b>Database administrator (DBA)</b>: technically responsible for implementing and maintaining the database.</li>\n<li><b>Application developer</b>: builds the applications that use the database.</li>\n<li><b>End user</b>: uses the database through an application.</li></ul>\n\n"},{"id":"select","title":"SELECT, WHERE, ORDER BY and FETCH","week":"Week 2","covers":"SELECT, DISTINCT, WHERE, LIKE, IN, NULL, ORDER BY, OFFSET/FETCH","html":"<p class=\"lead\">Everything you'll ever query starts here: one table, the right columns, the right rows, in the right order.</p>\n\n<h2>The skeleton and the order it runs in</h2>\n<div class=\"runbox\" data-db=\"enterprise\" data-sql=\"SELECT employee_id, last_name, first_name, department_id\nFROM employees\nWHERE department_id = 7\nORDER BY employee_id;\"></div>\n<div class=\"key\"><p>You <b>write</b> SELECT → FROM → WHERE → ORDER BY, but the database <b>executes</b>:</p>\n<ol><li><b>FROM</b>: which table</li><li><b>WHERE</b>: which rows (selection)</li><li><b>SELECT</b>: which columns and how (projection)</li><li><b>ORDER BY</b>: the order</li><li><b>OFFSET / FETCH</b>: how many rows</li></ol>\n<p>That's why a column alias made in SELECT can be used in ORDER BY but <b>not</b> in WHERE.</p></div>\n\n<h2>SELECT without FROM</h2>\n<div class=\"runbox\" data-db=\"enterprise\" data-sql=\"SELECT 2+2, CURRENT_DATE, 150 * 0.85 AS discounted;\"></div>\n\n<h2>The select list</h2>\n<ul>\n<li><code>*</code> = all columns</li>\n<li>constants: <code>'text'</code>, <code>345</code></li>\n<li>arithmetic: <code>+ - * /</code></li>\n<li><code>||</code> glues text together</li>\n<li>functions: <code>SUM()</code>, <code>UPPER()</code>…</li>\n</ul>\n<div class=\"runbox\" data-db=\"enterprise\" data-sql=\"SELECT employee_id\n      ,last_name || ' ' || first_name AS full_name\n      ,salary * 1.1 raise\nFROM employees;\"></div>\n<p><b>Column alias</b>: with or without <code>AS</code>. Without double quotes, PostgreSQL turns it into lowercase (<code>FamilyName</code> → <code>familyname</code>). With <b>\"double quotes\"</b> you keep capitals, spaces and any symbol.</p>\n<div class=\"runbox\" data-db=\"enterprise\" data-sql=\"SELECT employee_id &quot;Employee {number}&quot;, last_name AS &quot;Family name&quot;\nFROM employees;\"></div>\n<div class=\"key\"><p><b>Quote rules</b>: numbers no quotes · text and dates in <b>'single quotes'</b> · identifiers (aliases with spaces/capitals) in <b>\"double quotes\"</b>.</p></div>\n\n<h2>DISTINCT</h2>\n<p>Removes duplicate <b>rows</b> from the result. With several columns, the <i>combination</i> must be unique.</p>\n<div class=\"runbox\" data-db=\"enterprise\" data-sql=\"SELECT DISTINCT department_id FROM employees;\"></div>\n<div class=\"runbox\" data-db=\"enterprise\" data-sql=\"SELECT DISTINCT department_id dept, salary FROM employees;\"></div>\n\n<h2>WHERE: picking rows</h2>\n<p>Comparisons: <code>= &lt;&gt; != &lt; &gt; &lt;= &gt;=</code>.</p>\n<div class=\"runbox\" data-db=\"enterprise\" data-sql=\"SELECT employee_id, last_name, birth_date\nFROM employees\nWHERE birth_date &lt; '31-12-1980';\"></div>\n<p><b>BETWEEN low AND high</b>: both limits included, and low must come first. <code>BETWEEN 40000 AND 25000</code> returns nothing.</p>\n<div class=\"runbox\" data-db=\"enterprise\" data-sql=\"SELECT employee_id, last_name, salary\nFROM employees\nWHERE salary BETWEEN 25000 AND 40000;\"></div>\n<p><b>Text is case-sensitive.</b> <code>first_name = 'WILLEM'</code> finds nothing. Convert first:</p>\n<div class=\"runbox\" data-db=\"enterprise\" data-sql=\"SELECT employee_id FROM employees WHERE UPPER(first_name) = 'WILLEM';\"></div>\n<p><code>INITCAP('hELLO wORLD')</code> → <code>Hello World</code>.</p>\n\n<h2>LIKE with wildcards</h2>\n<table class=\"t\"><tr><th>Wildcard</th><th>Means</th></tr><tr><td><code>%</code></td><td>0, 1 or many characters</td></tr><tr><td><code>_</code></td><td>exactly one character</td></tr></table>\n<div class=\"runbox\" data-db=\"enterprise\" data-sql=\"SELECT employee_id, last_name FROM employees\nWHERE UPPER(last_name) LIKE '_O%';   -- 2nd letter is an O\"></div>\n<p><code>'%ases_'</code> matches <i>databases1</i>, not <i>databases</i> (the _ needs one character) and not <i>cases77</i> (only one).</p>\n\n<h2>AND, OR, NOT and brackets</h2>\n<div class=\"trap\"><p><b>AND is evaluated before OR.</b> This query means \"(salary &gt; 30000 AND dept 1) OR dept 3\", so every dept-3 employee appears, whatever the salary:</p></div>\n<div class=\"runbox\" data-db=\"enterprise\" data-sql=\"SELECT employee_id, salary, department_id FROM employees\nWHERE salary &gt; 30000 AND department_id = 1 OR department_id = 3;\"></div>\n<div class=\"runbox\" data-db=\"enterprise\" data-sql=\"SELECT employee_id, salary, department_id FROM employees\nWHERE salary &gt; 30000 AND (department_id = 1 OR department_id = 3);\"></div>\n\n<h2>IN (list)</h2>\n<div class=\"runbox\" data-db=\"enterprise\" data-sql=\"SELECT employee_id, first_name, salary FROM employees\nWHERE first_name IN ('Suzan', 'Martina');\"></div>\n<p><code>NOT IN</code> is the opposite. <code>IN</code> is the short way of writing many ORs.</p>\n\n<h2>IS NULL / IS NOT NULL</h2>\n<div class=\"trap\"><p><code>= NULL</code>, <code>!= NULL</code> and <code>NOT x = NULL</code> never return anything. NULL isn't a value you can compare: comparing with NULL gives \"unknown\". Always use <b>IS NULL</b> / <b>IS NOT NULL</b>.</p></div>\n<div class=\"runbox\" data-db=\"enterprise\" data-sql=\"SELECT employee_id, last_name FROM employees WHERE manager_id IS NULL;\"></div>\n<div class=\"runbox\" data-db=\"enterprise\" data-sql=\"SELECT * FROM tasks WHERE hours = NULL;   -- runs, but returns 0 rows!\"></div>\n\n<h2>ORDER BY</h2>\n<ul>\n<li><code>ASC</code> is the default, <code>DESC</code> reverses.</li>\n<li>Several columns: sort by the first, then <i>within</i> equal values by the second.</li>\n<li>You can sort by alias or by column <b>number</b> in the select list.</li>\n<li><b>NULL counts as the largest value</b>: last with ASC, first with DESC. Change with <code>NULLS FIRST</code> / <code>NULLS LAST</code>.</li>\n</ul>\n<div class=\"runbox\" data-db=\"enterprise\" data-sql=\"SELECT employee_id, last_name &quot;long name&quot;, department_id dept\nFROM employees\nORDER BY dept DESC, &quot;long name&quot; ASC;\"></div>\n<div class=\"runbox\" data-db=\"enterprise\" data-sql=\"SELECT * FROM tasks ORDER BY hours ASC NULLS FIRST;\"></div>\n\n<h2>Pagination: OFFSET and FETCH</h2>\n<div class=\"runbox\" data-db=\"enterprise\" data-sql=\"SELECT last_name FROM employees\nORDER BY last_name\nOFFSET 3 ROWS\nFETCH NEXT 4 ROWS ONLY;\"></div>\n<ul>\n<li><code>OFFSET n ROWS</code> skips n rows (default 0). OFFSET bigger than the number of rows → no output. An expression must be in brackets: <code>OFFSET (2*2) ROWS</code>.</li>\n<li><code>FETCH NEXT n ROWS ONLY</code> returns at most n rows. <code>FIRST</code> = <code>NEXT</code>, <code>ROW</code> = <code>ROWS</code>.</li>\n<li>Always combine with <b>ORDER BY</b>, otherwise \"the first 3\" means nothing (rows have no order).</li>\n</ul>\n<div class=\"key\"><p><b>WITH TIES</b>: also returns the rows that are equal to the last one. \"Top 2 salaries\" with ONLY cuts one of the two 43000 earners off. WITH TIES shows both, so you get 3 rows.</p></div>\n<div class=\"runbox\" data-db=\"enterprise\" data-sql=\"SELECT last_name, salary FROM employees\nORDER BY salary DESC\nFETCH FIRST 2 ROWS WITH TIES;\"></div>\n<p>PostgreSQL also knows <code>LIMIT 3 OFFSET 2</code>, but the course uses OFFSET/FETCH.</p>\n\n"},{"id":"functions","title":"Conversions, numbers, dates and text","week":"Week 3","covers":"TO_CHAR, TO_DATE, CAST, ROUND, dates, text functions","html":"<p class=\"lead\">Functions change how values look or let you calculate with them. The exam loves TO_CHAR masks, date arithmetic and text functions like SUBSTRING and POSITION.</p>\n\n<h2>Implicit vs explicit conversion</h2>\n<p>PostgreSQL converts automatically where it can: <code>'29-10-2010'</code> becomes a date when a date is expected, and a date becomes text in <code>'*** ' || current_date</code>. This depends on client settings (<code>datestyle</code>), so it's safer to convert <b>explicitly</b>.</p>\n<div class=\"runbox\" data-db=\"enterprise\" data-sql=\"SHOW datestyle;\"></div>\n<p>This site uses <code>ISO, DMY</code>: dates are shown as 2026-11-12 and typed as day-month-year ('31-12-1980', '1-JAN-1980').</p>\n\n<h2>TO_CHAR: date or number → text</h2>\n<div class=\"runbox\" data-db=\"enterprise\" data-sql=\"SELECT name, to_char(birth_date, 'DD/MM/YYYY') AS dmy\n      ,to_char(birth_date, 'FMDay DD FMMonth YYYY') AS long\nFROM family_members;\"></div>\n<table class=\"t\"><tr><th>Mask</th><th>Gives</th><th>Mask</th><th>Gives</th></tr>\n<tr><td>YYYY / YY</td><td>2026 / 26</td><td>Month / month / MONTH</td><td>November (padded to 9 chars)</td></tr>\n<tr><td>MM</td><td>11</td><td>Mon</td><td>Nov</td></tr>\n<tr><td>DD</td><td>day of month 12</td><td>Day / Dy</td><td>Thursday / Thu</td></tr>\n<tr><td>D</td><td>day of week (1 = Sunday)</td><td>DDD</td><td>day of year</td></tr>\n<tr><td>HH24:MI:SS</td><td>17:05:09</td><td>Q / WW</td><td>quarter / week of year</td></tr></table>\n<div class=\"key\"><p><b>FM</b> (fill mode) removes the padding spaces: <code>'Month'</code> → \"May&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;\", <code>'FMMonth'</code> → \"May\". <b>TM</b> (translation mode) uses the language of <code>lc_time</code> for day and month names.</p></div>\n<p>Numbers: <code>9</code> = digit (dropped if not significant), <code>0</code> = digit always shown, <code>.</code> or <code>D</code> = decimal point, <code>,</code> or <code>G</code> = group separator, <code>L</code> = currency, <code>S</code> = sign. A leading space is reserved for the sign, so <code>trim()</code> it or use FM.</p>\n<div class=\"runbox\" data-db=\"enterprise\" data-sql=\"SELECT '*'||to_char(485,'999')||'*', '*'||to_char(485,'0999.9')||'*', '*'||to_char(485,'FM999')||'*';\"></div>\n<div class=\"trap\"><p><code>employee_id</code> is <b>text</b> (varchar). <code>WHERE employee_id = 999666666</code> fails (text = integer). Fix: quotes <code>'999666666'</code>, or <code>CAST(employee_id AS INT) = 999666666</code>, or <code>trim(to_char(999666666,'999999999'))</code>.</p></div>\n\n<h2>TO_DATE, TO_NUMBER, CAST</h2>\n<div class=\"runbox\" data-db=\"enterprise\" data-sql=\"SELECT to_date('20 Sep 2021','DD Mon YYYY')\n      ,to_number('12,345.6-','99,999.9S')\n      ,CAST('2500' AS INT) + 3\n      ,'2500'::int + 3;\"></div>\n<p><code>to_date('20 Sep','DD Mon')</code> without a year gives year 1 BC. <code>x::type</code> is PostgreSQL's short form of CAST.</p>\n\n<h2>ROUND, TRUNC, MOD</h2>\n<div class=\"runbox\" data-db=\"enterprise\" data-sql=\"SELECT round(15251.675), round(15251.675,1), round(15256.675,-1)\n      ,trunc(15251.675,1), trunc(15251.675,-1), mod(5,3), mod(7,35);\"></div>\n<p><b>ROUND</b> rounds, <b>TRUNC</b> just cuts off. A negative position works left of the decimal point (-1 = tens). <b>MOD</b> is the remainder after division.</p>\n\n<h2>Dates and times</h2>\n<ul>\n<li><code>current_date</code>, <code>current_time</code>, <code>current_timestamp</code> / <code>now()</code></li>\n<li><b>date − date = number of days</b> (an integer)</li>\n<li>date + 7 = seven days later. Use <code>interval</code> for anything else: <code>+ interval '3 months'</code></li>\n<li><code>age(birth_date)</code> → an interval like \"45 years 4 mons 22 days\"</li>\n<li><code>date_part('year', …)</code> = <code>EXTRACT(YEAR FROM …)</code></li>\n<li><code>date_part('dow', …)</code>: Sunday 0 … Saturday 6. <code>'isodow'</code>: Monday 1 … Sunday 7</li>\n<li><code>date_trunc('month', ts)</code> cuts a timestamp back to the start of the month</li>\n</ul>\n<div class=\"runbox\" data-db=\"enterprise\" data-sql=\"SELECT last_name, birth_date\n      ,date_part('year', age(birth_date)) AS age\n      ,birth_date + interval '65 years' AS retirement\nFROM employees;\"></div>\n<div class=\"runbox\" data-db=\"enterprise\" data-sql=\"SELECT employee_id, name FROM family_members\nWHERE relationship IN ('SON','DAUGHTER')\n  AND date_part('year', age(birth_date)) &lt; 18;\"></div>\n\n<h2>Text functions</h2>\n<table class=\"t\"><tr><th>Function</th><th>Example → result</th></tr>\n<tr><td>UPPER / LOWER / INITCAP</td><td>INITCAP('jan peeters') → Jan Peeters</td></tr>\n<tr><td>LENGTH(s)</td><td>LENGTH('Jan Janssens') → 12 (spaces count)</td></tr>\n<tr><td>SUBSTRING(s, start, len) / SUBSTR</td><td>SUBSTRING('Bordoloi',1,4) → Bord. Without len: to the end.</td></tr>\n<tr><td>POSITION('o' IN s)</td><td>POSITION('o' IN 'Bordoloi') → 2 (first one, 0 if absent)</td></tr>\n<tr><td>CONCAT(a, b, …)</td><td>ignores NULL</td></tr>\n<tr><td>CONCAT_WS(sep, a, b, …)</td><td>CONCAT_WS(',', 'a', 2, NULL, 22) → a,2,22</td></tr>\n<tr><td>LPAD / RPAD(s, n, fill)</td><td>LPAD('hi',5,'xy') → xyxhi. A longer string is <b>cut</b> to n.</td></tr>\n<tr><td>TRIM([LEADING|TRAILING|BOTH] 'c' FROM s)</td><td>default BOTH and a space</td></tr>\n<tr><td>REPLACE(s, from, to)</td><td>REPLACE('ab*cd*','*','') → abcd</td></tr></table>\n<div class=\"trap\"><p><code>'a' || NULL</code> is <b>NULL</b>, while <code>CONCAT('a', NULL)</code> is <b>'a'</b>. Watch out with <code>infix</code>, which is often NULL.</p></div>\n<div class=\"runbox\" data-db=\"enterprise\" data-sql=\"SELECT first_name || ' ' || infix || ' ' || last_name AS with_bars\n      ,CONCAT_WS(' ', first_name, infix, last_name) AS with_concat_ws\nFROM employees;\"></div>\n<div class=\"runbox\" data-db=\"enterprise\" data-sql=\"SELECT lower(substring(first_name,1,3)) || '.' || lower(substring(last_name,1,3)) || '@kdg.be' AS email\nFROM employees;\"></div>\n<p>TRIM removes <i>characters from a set</i>, not a word: <code>TRIM('DRN' FROM 'PARTNER')</code> → \"PARTNE\" (only the R at the end is in the set and it stops at E).</p>\n\n"},{"id":"joins","title":"Inner, non-equi and self joins","week":"Week 4","covers":"INNER JOIN, USING, NATURAL, non-equi and self joins","html":"<p class=\"lead\">Data is split over tables, so most real questions need a join: put rows of two tables side by side when a condition matches.</p>\n\n<h2>The Cartesian product (what goes wrong)</h2>\n<div class=\"runbox\" data-db=\"enterprise\" data-sql=\"SELECT employee_id, last_name, department_name\nFROM employees, departments;\"></div>\n<p>No join condition → every employee combined with every department: 8 × 3 = 24 rows, most of them nonsense.</p>\n\n<h2>INNER JOIN … ON</h2>\n<div class=\"runbox\" data-db=\"enterprise\" data-sql=\"SELECT e.employee_id, e.last_name, e.department_id, d.department_name\nFROM employees e\nJOIN departments d ON (e.department_id = d.department_id);\"></div>\n<ul>\n<li><code>INNER</code> is the default, so <code>JOIN</code> = <code>INNER JOIN</code>.</li>\n<li>Only rows with a match on both sides appear.</li>\n<li>A column that exists in both tables (<code>department_id</code>) must be <b>prefixed</b> or you get \"column reference is ambiguous\".</li>\n<li><b>Table aliases</b> (<code>e</code>, <code>d</code>) keep it short. Once you give an alias, use it.</li>\n<li>You can still add <code>WHERE</code> and <code>ORDER BY</code>.</li>\n</ul>\n\n<h2>USING and NATURAL JOIN</h2>\n<div class=\"runbox\" data-db=\"enterprise\" data-sql=\"SELECT employee_id, last_name, department_id, department_name\nFROM employees JOIN departments USING (department_id);\"></div>\n<p><code>USING (col)</code> works when the column has the same name in both tables. Then you write it <b>without</b> prefix.</p>\n<div class=\"trap\"><p><b>NATURAL JOIN</b> joins on <i>every</i> column with the same name. employees and departments both have <code>manager_id</code>, so it joins on department_id <b>and</b> manager_id and gives a wrong (much smaller) result. Prefer USING or ON.</p></div>\n<div class=\"runbox\" data-db=\"enterprise\" data-sql=\"SELECT employee_id, last_name, department_name\nFROM employees NATURAL JOIN departments;\"></div>\n\n<h2>Three or more tables</h2>\n<div class=\"runbox\" data-db=\"enterprise\" data-sql=\"SELECT e.last_name, p.project_name, t.hours\nFROM employees e\nJOIN tasks t    ON (e.employee_id = t.employee_id)\nJOIN projects p ON (t.project_id = p.project_id);\"></div>\n<p>Join in a chain: each ON may only use tables that are already in the FROM above it. tasks is the bridge between employees and projects.</p>\n<p>With a <b>composite key</b> you join on all its parts: <code>ON (e.student_id = g.student_id AND e.section_id = g.section_id)</code>.</p>\n\n<h2>Non-equi join</h2>\n<p>The condition doesn't have to be <code>=</code>. Classic: find the salary scale where the salary falls between a lower and upper limit.</p>\n<div class=\"runbox\" data-db=\"enterprise\" data-sql=\"SELECT e.last_name, e.salary, p.project_name, p.location\nFROM employees e\nJOIN projects p ON (p.location &lt;&gt; e.location AND p.department_id = e.department_id);\"></div>\n<p>Pattern: <code>JOIN scales ON (salary/12 BETWEEN limit_lower AND limit_upper)</code>.</p>\n\n<h2>Self join</h2>\n<p>A table joined with itself, with two different aliases as if they were two tables.</p>\n<p><b>Who is the boss of 999444444?</b> <code>e</code> = the employee, <code>mgr</code> = the boss.</p>\n<div class=\"runbox\" data-db=\"enterprise\" data-sql=\"SELECT mgr.last_name\nFROM employees e\nJOIN employees mgr ON (e.manager_id = mgr.employee_id)\nWHERE e.employee_id = '999444444';\"></div>\n<p><b>Every employee with the name of their boss:</b></p>\n<div class=\"runbox\" data-db=\"enterprise\" data-sql=\"SELECT e.last_name, e.first_name, boss.last_name AS boss\nFROM employees e\nJOIN employees boss ON (e.manager_id = boss.employee_id);\"></div>\n<p>Bordoloi is missing: he has no boss (manager_id NULL), so an inner join drops him. (Week 5: LEFT JOIN keeps him.)</p>\n<p><b>Who ELSE works in the same department as Bock?</b></p>\n<div class=\"runbox\" data-db=\"enterprise\" data-sql=\"SELECT e.last_name, e.department_id\nFROM employees bock\nJOIN employees e ON (bock.department_id = e.department_id)\nWHERE UPPER(bock.last_name) = 'BOCK'\n  AND UPPER(e.last_name) &lt;&gt; 'BOCK';\"></div>\n<p><b>Who earns more than Bock?</b> (a self non-equi join; Bock drops out automatically because he doesn't earn more than himself)</p>\n<div class=\"runbox\" data-db=\"enterprise\" data-sql=\"SELECT e.last_name, e.salary\nFROM employees e\nJOIN employees bock ON (bock.salary &lt; e.salary)\nWHERE UPPER(bock.last_name) = 'BOCK';\"></div>\n<p><b>Pairs living in the same place, without doubles:</b> use <code>&lt;</code> instead of <code>&lt;&gt;</code>, otherwise you get (A,B) and (B,A).</p>\n<div class=\"runbox\" data-db=\"enterprise\" data-sql=\"SELECT e1.location, e1.first_name, e2.first_name\nFROM employees e1\nJOIN employees e2 ON (UPPER(e1.location) = UPPER(e2.location) AND e1.employee_id &lt; e2.employee_id)\nORDER BY e1.location;\"></div>\n<p><b>Recursive: whose boss's boss is Bordoloi?</b> Join three times.</p>\n<div class=\"runbox\" data-db=\"enterprise\" data-sql=\"SELECT e.last_name\nFROM employees e\nJOIN employees boss  ON (e.manager_id = boss.employee_id)\nJOIN employees boss2 ON (boss.manager_id = boss2.employee_id)\nWHERE boss2.last_name = 'Bordoloi';\"></div>\n<div class=\"key\"><p>Method for every self join: first write it in steps (\"step 1: what are Bock's hours on project 2? step 2: who has more?\"), then merge the steps into one query with one alias per role.</p></div>\n\n"},{"id":"group","title":"Aggregate functions, GROUP BY and HAVING","week":"Week 5","covers":"COUNT, SUM, AVG, MIN, MAX, GROUP BY, HAVING","html":"<p class=\"lead\">Aggregate functions turn many rows into one number. GROUP BY does that per group; HAVING filters the groups.</p>\n\n<h2>The five functions</h2>\n<div class=\"runbox\" data-db=\"enterprise\" data-sql=\"SELECT COUNT(*) AS n, SUM(salary), ROUND(AVG(salary)), MIN(salary), MAX(salary)\nFROM employees;\"></div>\n<ul>\n<li>They <b>ignore NULL</b>, except <code>COUNT(*)</code> which counts rows.</li>\n<li><code>COUNT(*)</code> = number of rows · <code>COUNT(col)</code> = number of non-NULL values · <code>COUNT(DISTINCT col)</code> = number of different non-NULL values.</li>\n<li><code>SUM(DISTINCT salary)</code> adds every different salary only once.</li>\n<li>MIN/MAX also work on text (alphabetical) and dates (MIN birth_date = the oldest person).</li>\n</ul>\n<div class=\"runbox\" data-db=\"enterprise\" data-sql=\"SELECT COUNT(*), COUNT(hours), COUNT(DISTINCT employee_id) FROM tasks;\"></div>\n<div class=\"trap\"><p>An aggregate function is <b>never allowed in WHERE</b>. <code>WHERE AVG(salary) &gt; 30000</code> → error. WHERE runs per row, before any group exists.</p></div>\n\n<h2>GROUP BY</h2>\n<div class=\"runbox\" data-db=\"enterprise\" data-sql=\"SELECT department_id, COUNT(*) AS count_emp, ROUND(AVG(salary)) AS avg_sal\nFROM employees\nGROUP BY department_id\nORDER BY department_id;\"></div>\n<div class=\"key\"><p><b>The golden rule</b>: every column in SELECT that is not inside an aggregate function must be in GROUP BY. <code>SELECT department_id, COUNT(*), first_name … GROUP BY department_id</code> → error: which of the four first names should it show?</p></div>\n<p>Grouping on several columns makes a group per combination:</p>\n<div class=\"runbox\" data-db=\"enterprise\" data-sql=\"SELECT department_id, gender, COUNT(*)\nFROM employees\nGROUP BY department_id, gender\nORDER BY 1, 2;\"></div>\n\n<h2>HAVING</h2>\n<div class=\"runbox\" data-db=\"enterprise\" data-sql=\"SELECT department_id, ROUND(AVG(salary)) AS avg_salary\nFROM employees\nGROUP BY department_id\nHAVING AVG(salary) &gt; 33000;\"></div>\n<table class=\"t\"><tr><th></th><th>WHERE</th><th>HAVING</th></tr>\n<tr><td>filters</td><td>individual rows</td><td>whole groups</td></tr>\n<tr><td>runs</td><td>before grouping</td><td>after grouping</td></tr>\n<tr><td>aggregates allowed?</td><td>no</td><td>yes</td></tr></table>\n<div class=\"key\"><p>Full execution order: <b>FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY → OFFSET/FETCH</b>. So an alias from SELECT can't be used in HAVING (<code>HAVING avg_salary &gt; 33000</code> fails), but it can in ORDER BY.</p></div>\n<p>A filter on a normal column belongs in WHERE (faster, it throws rows away before grouping): <code>WHERE UPPER(location) IN ('EINDHOVEN','OEGSTGEEST')</code> beats putting it in HAVING.</p>\n<div class=\"runbox\" data-db=\"enterprise\" data-sql=\"SELECT department_id, AVG(salary)\nFROM employees\nWHERE gender = 'F'\nGROUP BY department_id\nHAVING AVG(salary) &gt; 30000;\"></div>\n\n<h2>Nesting aggregates</h2>\n<p><code>AVG(MAX(salary))</code> needs a GROUP BY and then can only return one row (no department_id next to it). Cleaner: put the inner step in a subquery in FROM.</p>\n<div class=\"runbox\" data-db=\"enterprise\" data-sql=\"SELECT ROUND(AVG(max_sal)) AS avg_of_max\nFROM (SELECT MAX(salary) AS max_sal FROM employees GROUP BY department_id) AS x;\"></div>\n\n<h2>Aggregates with joins</h2>\n<div class=\"runbox\" data-db=\"enterprise\" data-sql=\"SELECT p.project_name, COUNT(t.employee_id) AS workers, SUM(t.hours) AS total\nFROM projects p\nJOIN tasks t ON (p.project_id = t.project_id)\nGROUP BY p.project_name\nHAVING SUM(t.hours) &gt; 30\nORDER BY p.project_name;\"></div>\n\n"},{"id":"outer","title":"Outer joins","week":"Week 5","covers":"LEFT, RIGHT, FULL joins and finding what is missing","html":"<p class=\"lead\">An inner join only keeps matches. An outer join keeps all rows of one (or both) tables and fills the missing side with NULL.</p>\n\n<h2>The idea: a temporary NULL row</h2>\n<p>For every row without a match, the outer join temporarily adds a <b>NULL row</b> to the other table. You choose which table must keep all its rows.</p>\n<div class=\"runbox\" data-db=\"enterprise\" data-sql=\"SELECT e.employee_id, e.first_name, f.name, f.relationship\nFROM employees e\nLEFT JOIN family_members f ON (e.employee_id = f.employee_id)\nORDER BY e.employee_id;\"></div>\n<table class=\"t\"><tr><th>Join</th><th>Keeps</th></tr>\n<tr><td>[INNER] JOIN</td><td>only matches</td></tr>\n<tr><td>LEFT [OUTER] JOIN</td><td>all rows of the table on the left (before JOIN)</td></tr>\n<tr><td>RIGHT [OUTER] JOIN</td><td>all rows of the table on the right</td></tr>\n<tr><td>FULL [OUTER] JOIN</td><td>all rows of both</td></tr></table>\n<p><code>A LEFT JOIN B</code> = <code>B RIGHT JOIN A</code>.</p>\n\n<h2>Who has NO match? (anti-join)</h2>\n<div class=\"runbox\" data-db=\"enterprise\" data-sql=\"SELECT e.employee_id, e.last_name\nFROM employees e\nLEFT JOIN family_members f ON (e.employee_id = f.employee_id)\nWHERE f.employee_id IS NULL;\"></div>\n<div class=\"trap\"><p>Test IS NULL on a column that can <b>never</b> be NULL in a real row: the PK or a NOT NULL column of the right table (<code>f.employee_id</code>, <code>f.name</code>). If you test a nullable column (<code>f.birth_date</code>, <code>t.hours</code>), real rows with an empty value also slip in. In the slides, Bock and his daughter Anke (without birth_date) appear by mistake.</p></div>\n<p>Also look at <i>which</i> column you show: <code>f.employee_id</code> is NULL for the unmatched rows, <code>e.employee_id</code> never is.</p>\n\n<h2>Projects nobody works on, employees with no tasks</h2>\n<div class=\"runbox\" data-db=\"enterprise\" data-sql=\"SELECT e.first_name, e.last_name\nFROM employees e\nLEFT JOIN tasks t ON (e.employee_id = t.employee_id)\nWHERE t.project_id IS NULL;\"></div>\n\n<h2>Counting after an outer join</h2>\n<div class=\"key\"><p><code>COUNT(*)</code> also counts the NULL row, so an employee with 0 projects gets <b>1</b>. Use <code>COUNT(t.project_id)</code> to get 0.</p></div>\n<div class=\"runbox\" data-db=\"enterprise\" data-sql=\"SELECT e.last_name, COUNT(*) AS wrong, COUNT(t.project_id) AS right_count\nFROM employees e\nLEFT JOIN tasks t ON (e.employee_id = t.employee_id)\nGROUP BY e.employee_id, e.last_name\nORDER BY right_count;\"></div>\n\n<h2>Self outer join: employees who manage nobody</h2>\n<div class=\"runbox\" data-db=\"enterprise\" data-sql=\"SELECT e.last_name\nFROM employees e\nLEFT JOIN employees sub ON (sub.manager_id = e.employee_id)\nWHERE sub.employee_id IS NULL;\"></div>\n<p>And every employee with their boss, the CEO included:</p>\n<div class=\"runbox\" data-db=\"enterprise\" data-sql=\"SELECT e.last_name, boss.last_name AS boss\nFROM employees e\nLEFT JOIN employees boss ON (e.manager_id = boss.employee_id);\"></div>\n\n<h2>FULL OUTER JOIN</h2>\n<p>Shows departments without employees <b>and</b> employees without department in one result. Try it after adding both in the playground:</p>\n<div class=\"runbox\" data-db=\"enterprise\" data-sql=\"INSERT INTO departments VALUES (4, 'Research', '999444444', now());\nINSERT INTO employees (employee_id, last_name, first_name) VALUES ('999999999','Janssens','Jan');\nSELECT d.department_id, d.department_name, e.employee_id, e.last_name\nFROM departments d\nFULL JOIN employees e ON (d.department_id = e.department_id)\nORDER BY d.department_id;\"></div>\n<p class=\"small\">Changes made by a Run button here are rolled back right away, so the database stays clean.</p>\n\n"},{"id":"exam","title":"Exam guide","week":"Recap","covers":"How to attack a question, the mistakes that cost points","html":"<p class=\"lead\">On the exam you get a database and <b>open questions</b>: you write the SQL yourself, without IDE. Practise on paper first, then check it here.</p>\n\n<h2>How to attack every question</h2>\n<ol>\n<li><b>Which tables?</b> Underline every attribute the question mentions and find its table. Need two tables? Find the FK that links them.</li>\n<li><b>Which rows?</b> → WHERE. \"per …\" or \"for each …\" → GROUP BY. A condition on a count/sum/average → HAVING.</li>\n<li><b>\"also those without …\" / \"all … (if any)\"</b> → OUTER JOIN. \"who doesn't have …\" → LEFT JOIN + IS NULL on a PK column.</li>\n<li><b>Compare with another row of the same table</b> (\"same department as\", \"earns more than\") → self join.</li>\n<li><b>Which columns and headers?</b> Match the result table exactly: aliases, concatenation, order of columns.</li>\n<li><b>ORDER BY</b> last. Check NULLs, case (UPPER) and quotes.</li>\n</ol>\n\n<h2>The mistakes that cost points</h2>\n<ul>\n<li><code>= NULL</code> instead of <code>IS NULL</code>.</li>\n<li>Aggregate in WHERE; non-aggregated column missing from GROUP BY.</li>\n<li>Alias used in WHERE or HAVING.</li>\n<li>Missing brackets around OR.</li>\n<li>Text compared without UPPER/LOWER, so 'MAASTRICHT' and 'Maastricht' differ.</li>\n<li>Number written with quotes or text id without quotes.</li>\n<li>Ambiguous column: prefix it.</li>\n<li>COUNT(*) after a LEFT JOIN.</li>\n<li>FETCH without ORDER BY; ONLY where WITH TIES was asked (\"the employee(s) with the lowest salary\").</li>\n<li><code>||</code> with a NULL column wipes the whole text.</li>\n<li>BETWEEN with the high value first.</li>\n</ul>\n"}],"ex":[{"s":"select","q":"Show every column of the departments table.","sol":"SELECT * FROM departments;","hint":"SELECT * FROM …","db":"enterprise","ord":false},{"s":"select","q":"Show the project name and location of every project.","sol":"SELECT project_name, location FROM projects;","hint":"","db":"enterprise","ord":false},{"s":"select","q":"Show each employee's last name and salary, with the headers <b>Name</b> and <b>Yearly pay</b> (keep the capitals and the space).","sol":"SELECT last_name AS \"Name\", salary AS \"Yearly pay\" FROM employees;","hint":"Double quotes keep capitals and spaces.","db":"enterprise","ord":false},{"s":"select","q":"Show each employee's first name and last name glued together in one column called <b>full_name</b>, e.g. <i>Bijoy Bordoloi</i>.","sol":"SELECT first_name || ' ' || last_name AS full_name FROM employees;","hint":"","db":"enterprise","ord":false},{"s":"select","q":"Show each employee's last name and their salary per month (salary divided by 12).","sol":"SELECT last_name, salary / 12 FROM employees;","hint":"","db":"enterprise","ord":false},{"s":"select","q":"Calculate 2 + 2 and today's date in one query, without a table.","sol":"SELECT 2 + 2, CURRENT_DATE;","hint":"SELECT without FROM.","db":"enterprise","ord":false},{"s":"select","q":"Show the different genders that occur in employees, each once.","sol":"SELECT DISTINCT gender FROM employees;","hint":"","db":"enterprise","ord":false},{"s":"select","q":"Show the different combinations of department and gender in employees.","sol":"SELECT DISTINCT department_id, gender FROM employees;","hint":"","db":"enterprise","ord":false},{"s":"select","q":"Show last name and department of the employees in department 3.","sol":"SELECT last_name, department_id FROM employees WHERE department_id = 3;","hint":"","db":"enterprise","ord":false},{"s":"select","q":"Show the employees (last name, birth date) born before 1 January 1980.","sol":"SELECT last_name, birth_date FROM employees WHERE birth_date < '01-01-1980';","hint":"Dates go in single quotes.","db":"enterprise","ord":false},{"s":"select","q":"Show last name and salary of the employees earning between 30000 and 45000, both limits included.","sol":"SELECT last_name, salary FROM employees WHERE salary BETWEEN 30000 AND 45000;","hint":"","db":"enterprise","ord":false},{"s":"select","q":"Find the employee whose first name is douglas, however it's capitalised in the table.","sol":"SELECT * FROM employees WHERE LOWER(first_name) = 'douglas';","hint":"Convert the column with LOWER or UPPER first.","db":"enterprise","ord":false},{"s":"select","q":"Show the last names that contain an 'e' anywhere (upper or lower case).","sol":"SELECT last_name FROM employees WHERE LOWER(last_name) LIKE '%e%';","hint":"","db":"enterprise","ord":false},{"s":"select","q":"Show the last names whose third letter is an 'r'.","sol":"SELECT last_name FROM employees WHERE LOWER(last_name) LIKE '__r%';","hint":"Two underscores, then r.","db":"enterprise","ord":false},{"s":"select","q":"Show last name, salary and department of employees in department 7 who earn more than 30000.","sol":"SELECT last_name, salary, department_id FROM employees WHERE department_id = 7 AND salary > 30000;","hint":"","db":"enterprise","ord":false},{"s":"select","q":"Show last name, gender and department of the women who work in department 3 or 7.","sol":"SELECT last_name, gender, department_id FROM employees WHERE gender = 'F' AND (department_id = 3 OR department_id = 7);","hint":"Brackets around the OR.","db":"enterprise","ord":false},{"s":"select","q":"Show the projects located in Eindhoven or Maarssen, using IN.","sol":"SELECT * FROM projects WHERE location IN ('Eindhoven', 'Maarssen');","hint":"","db":"enterprise","ord":false},{"s":"select","q":"Show the employees who do NOT live in the province NB or LI.","sol":"SELECT last_name, province FROM employees WHERE province NOT IN ('NB', 'LI');","hint":"","db":"enterprise","ord":false},{"s":"select","q":"Show the employees that have an infix (the infix is filled in).","sol":"SELECT first_name, infix, last_name FROM employees WHERE infix IS NOT NULL;","hint":"","db":"enterprise","ord":false},{"s":"select","q":"Show the tasks with hours filled in, sorted from most to fewest hours.","sol":"SELECT * FROM tasks WHERE hours IS NOT NULL ORDER BY hours DESC;","hint":"","db":"enterprise","ord":true},{"s":"select","q":"Show all employees sorted by department (ascending) and within each department by salary from high to low. Show department, last name and salary.","sol":"SELECT department_id, last_name, salary FROM employees ORDER BY department_id, salary DESC;","hint":"","db":"enterprise","ord":true},{"s":"select","q":"Show all tasks sorted by hours from high to low, but with the empty hours at the bottom.","sol":"SELECT * FROM tasks ORDER BY hours DESC NULLS LAST;","hint":"","db":"enterprise","ord":true},{"s":"select","q":"Show the 3 youngest employees (last name, birth date), youngest first.","sol":"SELECT last_name, birth_date FROM employees ORDER BY birth_date DESC FETCH FIRST 3 ROWS ONLY;","hint":"Youngest = latest birth date.","db":"enterprise","ord":false},{"s":"select","q":"Sorted by last name, skip the first 2 employees and show the next 3 (last name only).","sol":"SELECT last_name FROM employees ORDER BY last_name OFFSET 2 ROWS FETCH NEXT 3 ROWS ONLY;","hint":"","db":"enterprise","ord":true},{"s":"select","q":"Show the employees with the 2 highest salaries, including everyone who shares the second-highest salary. Sort from high to low.","sol":"SELECT last_name, salary FROM employees ORDER BY salary DESC FETCH FIRST 2 ROWS WITH TIES;","hint":"","db":"enterprise","ord":true},{"s":"functions","q":"Show every birth date of the employees written as day/month/year, e.g. <i>10/11/1977</i>.","sol":"SELECT last_name, TO_CHAR(birth_date, 'DD/MM/YYYY') FROM employees;","hint":"","db":"enterprise","ord":false},{"s":"functions","q":"Show each family member's name and the month they were born in as a word, without extra spaces (e.g. <i>May</i>).","sol":"SELECT name, TO_CHAR(birth_date, 'FMMonth') FROM family_members;","hint":"FM removes the padding.","db":"enterprise","ord":false},{"s":"functions","q":"Show each employee's last name and the year they were born as a number.","sol":"SELECT last_name, date_part('year', birth_date) FROM employees;","hint":"","db":"enterprise","ord":false},{"s":"functions","q":"Show each employee's last name and their age in whole years.","sol":"SELECT last_name, date_part('year', age(birth_date)) FROM employees;","hint":"","db":"enterprise","ord":false},{"s":"functions","q":"Show the employees who are older than 45. Show last name and birth date.","sol":"SELECT last_name, birth_date FROM employees WHERE age(birth_date) > interval '45 years';","hint":"","db":"enterprise","ord":false},{"s":"functions","q":"Show each department name and the date exactly 10 years after its manager started (mgr_start_date + 10 years).","sol":"SELECT department_name, mgr_start_date + interval '10 years' FROM departments;","hint":"","db":"enterprise","ord":false},{"s":"functions","q":"Show each family member's name and how many days old they are.","sol":"SELECT name, current_date - birth_date FROM family_members;","hint":"","db":"enterprise","ord":false},{"s":"functions","q":"Show the employees born on a Sunday (use date_part with 'dow').","sol":"SELECT last_name, birth_date FROM employees WHERE date_part('dow', birth_date) = 0;","hint":"dow: Sunday is 0.","db":"enterprise","ord":false},{"s":"functions","q":"Show each employee's last name in capitals and the number of letters in it.","sol":"SELECT UPPER(last_name), LENGTH(last_name) FROM employees;","hint":"","db":"enterprise","ord":false},{"s":"functions","q":"Show the first letter of the first name followed by a dot and
