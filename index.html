akes the whole name NULL.","db":"enterprise","ord":false},{"s":"w3","q":"Show the full name of each employee using CONCAT_WS so a missing infix causes no problem.","sol":"SELECT CONCAT_WS(' ', first_name, infix, last_name) AS full_name FROM employees;","hint":"","db":"enterprise","ord":false},{"s":"w3","q":"Show each employee's street in lowercase, right-padded with '*' to 30 characters.","sol":"SELECT RPAD(LOWER(street), 30, '*') AS street FROM employees;","hint":"","db":"enterprise","ord":false},{"s":"w3","q":"Show each street with a leading 'Z' removed.","sol":"SELECT TRIM(LEADING 'Z' FROM street) AS street FROM employees;","hint":"","db":"enterprise","ord":false},{"s":"w3","q":"List the employees with the letter 'o' in both their first and last name.","sol":"SELECT first_name, last_name FROM employees WHERE POSITION('o' IN LOWER(first_name)) > 0 AND POSITION('o' IN LOWER(last_name)) > 0;","hint":"","db":"enterprise","ord":false},{"s":"w3","q":"List the employees with 'oo' in their last name and no other o's.","sol":"SELECT last_name FROM employees WHERE LOWER(last_name) LIKE '%oo%' AND LENGTH(last_name) - LENGTH(REPLACE(LOWER(last_name),'o','')) = 2;","hint":"Count o's: length minus length without o's.","db":"enterprise","ord":false},{"s":"w3","q":"Make an email address: first 3 letters of first name + '.' + first 3 of last name + '@kdg.be', all lowercase, without ||.","sol":"SELECT LOWER(CONCAT(SUBSTRING(first_name,1,3), '.', SUBSTRING(last_name,1,3), '@kdg.be')) AS email FROM employees;","hint":"","db":"enterprise","ord":false},{"s":"w3","q":"Show salary per month (salary/12) rounded to 2 decimals, and truncated to whole euros.","sol":"SELECT last_name, ROUND(salary/12, 2) AS rounded, TRUNC(salary/12) AS truncated FROM employees;","hint":"","db":"enterprise","ord":false},{"s":"w3","q":"On which day of the week (name) was each employee born?","sol":"SELECT last_name, to_char(birth_date, 'FMDay') AS weekday FROM employees;","hint":"","db":"enterprise","ord":false},{"s":"w3","q":"Show the position of the first 'o' in each last name, but only names that contain an 'o'.","sol":"SELECT last_name, POSITION('o' IN last_name) AS pos FROM employees WHERE POSITION('o' IN last_name) > 0;","hint":"","db":"enterprise","ord":false},{"s":"w3","q":"Show the last 3 letters of every last name.","sol":"SELECT last_name, SUBSTRING(last_name, LENGTH(last_name)-2, 3) AS last3 FROM employees;","hint":"","db":"enterprise","ord":false},{"s":"w3","q":"How many full months has each department manager been manager (mgr_start_date until today)?","sol":"SELECT department_name, date_part('year', age(mgr_start_date))*12 + date_part('month', age(mgr_start_date)) AS months FROM departments;","hint":"","db":"enterprise","ord":false},{"s":"w3","q":"Show the employees born in the month of July or September.","sol":"SELECT last_name, birth_date FROM employees WHERE date_part('month', birth_date) IN (7, 9);","hint":"","db":"enterprise","ord":false},{"s":"w4","q":"Show every department with its projects: department id and name, project id, name and location (no Cartesian product!).","sol":"SELECT d.department_id, d.department_name, p.project_id, p.project_name, p.location FROM departments d JOIN projects p ON (d.department_id = p.department_id);","hint":"","db":"enterprise","ord":false},{"s":"w4","q":"List all department managers with employee number, last name, salary and parking spot.","sol":"SELECT e.employee_id, e.last_name, e.salary, e.parking_spot FROM departments d JOIN employees e ON (d.manager_id = e.employee_id);","hint":"Join on departments.manager_id, not on department_id.","db":"enterprise","ord":false},{"s":"w4","q":"List the projects and the employees working on them: project name, project location, employee last name and the employee's department name.","sol":"SELECT p.project_name, p.location, e.last_name, d.department_name FROM projects p JOIN tasks t ON (p.project_id = t.project_id) JOIN employees e ON (t.employee_id = e.employee_id) JOIN departments d ON (e.department_id = d.department_id);","hint":"","db":"enterprise","ord":false},{"s":"w4","q":"Same as the previous one, but only projects located in Eindhoven or supported by department Administration.","sol":"SELECT p.project_name, p.location, e.last_name, d.department_name FROM projects p JOIN tasks t ON (p.project_id = t.project_id) JOIN employees e ON (t.employee_id = e.employee_id) JOIN departments d ON (e.department_id = d.department_id) JOIN departments pd ON (p.department_id = pd.department_id) WHERE UPPER(p.location) = 'EINDHOVEN' OR UPPER(pd.department_name) = 'ADMINISTRATION';","hint":"The supporting department of the project is a different role than the employee's department: join departments twice.","db":"enterprise","ord":false},{"s":"w4","q":"List employees with their children (SON/DAUGHTER), sorted by employee last name and then child's name.","sol":"SELECT e.last_name, f.name, f.relationship FROM employees e JOIN family_members f ON (e.employee_id = f.employee_id) WHERE f.relationship IN ('SON','DAUGHTER') ORDER BY e.last_name, f.name;","hint":"","db":"enterprise","ord":true},{"s":"w4","q":"Which male employees live somewhere else than employee Jochems? Show last name and location.","sol":"SELECT e.last_name, e.location FROM employees e JOIN employees j ON (UPPER(e.location) <> UPPER(j.location)) WHERE j.last_name = 'Jochems' AND e.gender = 'M';","hint":"","db":"enterprise","ord":false},{"s":"w4","q":"List pairs of employees with their birthday in the same month (each pair once).","sol":"SELECT e1.last_name, e2.last_name, date_part('month', e1.birth_date) AS month FROM employees e1 JOIN employees e2 ON (date_part('month', e1.birth_date) = date_part('month', e2.birth_date) AND e1.employee_id < e2.employee_id);","hint":"","db":"enterprise","ord":false},{"s":"w4","q":"Which projects are supported by the same department as project 3? Show all project data.","sol":"SELECT p.* FROM projects p3 JOIN projects p ON (p3.department_id = p.department_id) WHERE p3.project_id = 3;","hint":"","db":"enterprise","ord":false},{"s":"w4","q":"Show the employees for whom Bordoloi is the boss of their boss.","sol":"SELECT e.last_name FROM employees e JOIN employees b ON (e.manager_id = b.employee_id) JOIN employees bb ON (b.manager_id = bb.employee_id) WHERE bb.last_name = 'Bordoloi';","hint":"","db":"enterprise","ord":false},{"s":"w4","q":"Show each employee's last name with the last name of their boss (header <b>boss</b>).","sol":"SELECT e.last_name, boss.last_name AS boss FROM employees e JOIN employees boss ON (e.manager_id = boss.employee_id);","hint":"","db":"enterprise","ord":false},{"s":"w4","q":"Who earns more than Bock? Show last name and salary.","sol":"SELECT e.last_name, e.salary FROM employees e JOIN employees b ON (b.salary < e.salary) WHERE b.last_name = 'Bock';","hint":"","db":"enterprise","ord":false},{"s":"w4","q":"Which employees (last name + hours) worked more hours on project 2 than Bock?","sol":"SELECT e.last_name, t.hours FROM employees b JOIN tasks tb ON (b.employee_id = tb.employee_id) JOIN tasks t ON (tb.project_id = t.project_id AND t.hours > tb.hours) JOIN employees e ON (t.employee_id = e.employee_id) WHERE b.last_name = 'Bock' AND tb.project_id = 2;","hint":"","db":"enterprise","ord":false},{"s":"w4","q":"For each department, show the name and the last name of its manager, with the date they started.","sol":"SELECT d.department_name, e.last_name, d.mgr_start_date FROM departments d JOIN employees e ON (d.manager_id = e.employee_id);","hint":"","db":"enterprise","ord":false},{"s":"w4","q":"Which employees work on a project located in the place where they live? Show last name, location and project name.","sol":"SELECT e.last_name, e.location, p.project_name FROM employees e JOIN tasks t ON (e.employee_id = t.employee_id) JOIN projects p ON (t.project_id = p.project_id) WHERE UPPER(e.location) = UPPER(p.location);","hint":"","db":"enterprise","ord":false},{"s":"w4","q":"Show the departments and all their locations, sorted by department name.","sol":"SELECT d.department_name, l.location FROM departments d JOIN locations l ON (d.department_id = l.department_id) ORDER BY d.department_name, l.location;","hint":"","db":"enterprise","ord":true},{"s":"w4","q":"Which employees work in a department located in their own place of residence? Use USING for the department join.","sol":"SELECT last_name, e.location FROM employees e JOIN locations l USING (department_id) WHERE UPPER(e.location) = UPPER(l.location);","hint":"Careful: with USING, department_id has no prefix, but location exists in both tables so it needs one.","db":"enterprise","ord":false},{"s":"w5","q":"How many hours did employee 999444444 register in total, and on how many tasks are the hours filled in?","sol":"SELECT SUM(hours), COUNT(hours) FROM tasks WHERE employee_id = '999444444';","hint":"COUNT(hours) skips the NULL.","db":"enterprise","ord":false},{"s":"w5","q":"On how many different projects are people working?","sol":"SELECT COUNT(DISTINCT project_id) FROM tasks;","hint":"","db":"enterprise","ord":false},{"s":"w5","q":"How many hours were spent on average on project 30 (rounded to 1 decimal)?","sol":"SELECT ROUND(AVG(hours), 1) FROM tasks WHERE project_id = 30;","hint":"","db":"enterprise","ord":false},{"s":"w5","q":"How many employees have children?","sol":"SELECT COUNT(DISTINCT employee_id) FROM family_members WHERE relationship IN ('SON','DAUGHTER');","hint":"","db":"enterprise","ord":false},{"s":"w5","q":"What's the highest number of hours spent on project 20?","sol":"SELECT MAX(hours) FROM tasks WHERE project_id = 20;","hint":"","db":"enterprise","ord":false},{"s":"w5","q":"What's the birth date of the youngest child of employee 999111111?","sol":"SELECT MAX(birth_date) FROM family_members WHERE employee_id = '999111111' AND relationship IN ('SON','DAUGHTER');","hint":"Youngest = most recent date = MAX.","db":"enterprise","ord":false},{"s":"w5","q":"What's the average length of the employees' last names?","sol":"SELECT AVG(LENGTH(last_name)) FROM employees;","hint":"","db":"enterprise","ord":false},{"s":"w5","q":"For each project, give the number of employees working on it.","sol":"SELECT project_id, COUNT(*) AS employees FROM tasks GROUP BY project_id ORDER BY project_id;","hint":"","db":"enterprise","ord":false},{"s":"w5","q":"For each department, give the number of employees from the province of Limburg (LI).","sol":"SELECT department_id, COUNT(*) FROM employees WHERE province = 'LI' GROUP BY department_id;","hint":"","db":"enterprise","ord":false},{"s":"w5","q":"Give the number of subordinates of each manager.","sol":"SELECT manager_id, COUNT(*) AS subordinates FROM employees WHERE manager_id IS NOT NULL GROUP BY manager_id;","hint":"","db":"enterprise","ord":false},{"s":"w5","q":"How many projects does each department support per location?","sol":"SELECT department_id, location, COUNT(*) AS projects FROM projects GROUP BY department_id, location ORDER BY department_id, location;","hint":"","db":"enterprise","ord":false},{"s":"w5","q":"For each department, give the average salary of the employees earning more than 30000.","sol":"SELECT department_id, AVG(salary) FROM employees WHERE salary > 30000 GROUP BY department_id;","hint":"Per row → WHERE.","db":"enterprise","ord":false},{"s":"w5","q":"Give the average salary of female employees per department, only where that average is higher than 30000.","sol":"SELECT department_id, AVG(salary) FROM employees WHERE gender = 'F' GROUP BY department_id HAVING AVG(salary) > 30000;","hint":"","db":"enterprise","ord":false},{"s":"w5","q":"Show how many sons and how many daughters each employee has, only where an employee has more than one child of the same sex.","sol":"SELECT employee_id, relationship, COUNT(*) FROM family_members WHERE relationship IN ('SON','DAUGHTER') GROUP BY employee_id, relationship HAVING COUNT(*) > 1;","hint":"","db":"enterprise","ord":false},{"s":"w5","q":"For each department, count the female employees earning less than 33000 who have a parking spot.","sol":"SELECT department_id, COUNT(*) FROM employees WHERE gender = 'F' AND salary < 33000 AND parking_spot IS NOT NULL GROUP BY department_id;","hint":"","db":"enterprise","ord":false},{"s":"w5","q":"For each employee (last name), the number of projects they work(ed) on. Only employees with at least one project.","sol":"SELECT e.last_name, COUNT(*) AS projects FROM employees e JOIN tasks t ON (e.employee_id = t.employee_id) GROUP BY e.employee_id, e.last_name;","hint":"","db":"enterprise","ord":false},{"s":"w5","q":"How many projects are there per location, only for Eindhoven and Oegstgeest?","sol":"SELECT location, COUNT(project_id) AS number_of_projects FROM projects WHERE UPPER(location) IN ('EINDHOVEN','OEGSTGEEST') GROUP BY location;","hint":"Filter rows in WHERE, not in HAVING: it's faster.","db":"enterprise","ord":false},{"s":"w5","q":"Show the departments with more than 2 employees, with their rounded average salary.","sol":"SELECT department_id, ROUND(AVG(salary)) AS avg_salary, COUNT(*) FROM employees GROUP BY department_id HAVING COUNT(*) > 2;","hint":"","db":"enterprise","ord":false},{"s":"w5","q":"Show the highest salary per department, only where it's below 45000.","sol":"SELECT department_id, MAX(salary) FROM employees GROUP BY department_id HAVING MAX(salary) < 45000;","hint":"","db":"enterprise","ord":false},{"s":"w5","q":"List the projects with more than 30 hours in total: <i>3 employees</i> | <i>perform tasks on Debtors</i> | <i>which is supported by dept. Administration</i>, with headers #employees, project, department, sorted by project name.","sol":"SELECT COUNT(t.employee_id) || ' employees' AS \"#employees\", 'perform tasks on ' || p.project_name AS project, 'which is supported by dept. ' || d.department_name AS department FROM projects p JOIN tasks t ON (p.project_id = t.project_id) JOIN departments d ON (p.department_id = d.department_id) GROUP BY p.project_name, d.department_name HAVING SUM(t.hours) > 30 ORDER BY p.project_name;","hint":"The combo exercise from class.","db":"enterprise","ord":true},{"s":"w5","q":"Give the average of the highest salaries of all departments.","sol":"SELECT ROUND(AVG(max_sal)) FROM (SELECT MAX(salary) AS max_sal FROM employees GROUP BY department_id) x;","hint":"Subquery in FROM.","db":"enterprise","ord":false},{"s":"w5","q":"Per gender: number of employees, lowest and highest birth date.","sol":"SELECT gender, COUNT(*), MIN(birth_date), MAX(birth_date) FROM employees GROUP BY gender;","hint":"","db":"enterprise","ord":false},{"s":"w5o","q":"Show all employees with the names of their family members (also employees without family).","sol":"SELECT e.employee_id, e.last_name, f.name, f.relationship FROM employees e LEFT JOIN family_members f ON (e.employee_id = f.employee_id);","hint":"","db":"enterprise","ord":false},{"s":"w5o","q":"Which employees have no family members?","sol":"SELECT e.employee_id, e.last_name FROM employees e LEFT JOIN family_members f ON (e.employee_id = f.employee_id) WHERE f.employee_id IS NULL;","hint":"Test a column that's never NULL in a real row.","db":"enterprise","ord":false},{"s":"w5o","q":"Which employees aren't assigned to any project? First and last name.","sol":"SELECT e.first_name, e.last_name FROM employees e LEFT JOIN tasks t ON (e.employee_id = t.employee_id) WHERE t.employee_id IS NULL;","hint":"","db":"enterprise","ord":false},{"s":"w5o","q":"List all departments and the projects they support (if any): department name, project name, location.","sol":"SELECT d.department_name, p.project_name, p.location FROM departments d LEFT JOIN projects p ON (d.department_id = p.department_id);","hint":"","db":"enterprise","ord":false},{"s":"w5o","q":"For every employee (all of them), the number of projects. Employees without projects show 0.","sol":"SELECT e.last_name, COUNT(t.project_id) AS projects FROM employees e LEFT JOIN tasks t ON (e.employee_id = t.employee_id) GROUP BY e.employee_id, e.last_name;","hint":"COUNT(*) would give 1 for the NULL row.","db":"enterprise","ord":false},{"s":"w5o","q":"List the employees whose last name starts with G or J, with their department name and their family members' names (if any).","sol":"SELECT e.last_name, d.department_name, f.name FROM employees e LEFT JOIN departments d ON (e.department_id = d.department_id) LEFT JOIN family_members f ON (e.employee_id = f.employee_id) WHERE UPPER(e.last_name) LIKE 'G%' OR UPPER(e.last_name) LIKE 'J%';","hint":"","db":"enterprise","ord":false},{"s":"w5o","q":"List employees whose first name starts with B, D, G, L or M, with the projects they work on (if any): last name, first name, project name, hours. Sort by last name and project name.","sol":"SELECT e.last_name, e.first_name, p.project_name, t.hours FROM employees e LEFT JOIN tasks t ON (e.employee_id = t.employee_id) LEFT JOIN projects p ON (t.project_id = p.project_id) WHERE SUBSTRING(e.first_name,1,1) IN ('B','D','G','L','M') ORDER BY e.last_name, p.project_name;","hint":"","db":"enterprise","ord":true},{"s":"w5o","q":"List the employees who aren't the manager of any other employee.","sol":"SELECT e.last_name FROM employees e LEFT JOIN employees s ON (s.manager_id = e.employee_id) WHERE s.employee_id IS NULL;","hint":"","db":"enterprise","ord":false},{"s":"w5o","q":"Show every employee with the last name of their boss, including the employee without boss.","sol":"SELECT e.last_name, b.last_name AS boss FROM employees e LEFT JOIN employees b ON (e.manager_id = b.employee_id);","hint":"","db":"enterprise","ord":false},{"s":"w5o","q":"List the employees who are not the manager of another employee OR who don't have a manager.","sol":"SELECT DISTINCT e.last_name FROM employees e LEFT JOIN employees s ON (s.manager_id = e.employee_id) WHERE s.employee_id IS NULL OR e.manager_id IS NULL;","hint":"","db":"enterprise","ord":false},{"s":"w5o","q":"Projects with the total hours worked on them; also projects without any task (total empty).","sol":"SELECT p.project_name, SUM(t.hours) AS total FROM projects p LEFT JOIN tasks t ON (p.project_id = t.project_id) GROUP BY p.project_name ORDER BY p.project_name;","hint":"","db":"enterprise","ord":false},{"s":"nf","q":"List all movies (title, release date) that are not available globally.","sol":"SELECT title, release_date FROM movie WHERE available_globally = false;","hint":"","db":"netflix","ord":false},{"s":"nf","q":"Show the movies without a known runtime or release date.","sol":"SELECT title FROM movie WHERE runtime IS NULL OR release_date IS NULL;","hint":"","db":"netflix","ord":false},{"s":"nf","q":"Show title and runtime of the movies longer than 2 hours, longest first. Runtime is in minutes.","sol":"SELECT title, runtime FROM movie WHERE runtime > 120 ORDER BY runtime DESC;","hint":"","db":"netflix","ord":true},{"s":"nf","q":"Show title and runtime formatted as e.g. <i>2h 18min</i> for every movie with a runtime.","sol":"SELECT title, (runtime / 60) || 'h ' || mod(runtime, 60) || 'min' AS duration FROM movie WHERE runtime IS NOT NULL;","hint":"Integer division and MOD.","db":"netflix","ord":false},{"s":"nf","q":"Which movies have a different original title than the title? Show both.","sol":"SELECT title, original_title FROM movie WHERE title <> original_title;","hint":"","db":"netflix","ord":false},{"s":"nf","q":"Show the 3 longest movies; include ties.","sol":"SELECT title, runtime FROM movie WHERE runtime IS NOT NULL ORDER BY runtime DESC FETCH FIRST 3 ROWS WITH TIES;","hint":"","db":"netflix","ord":false},{"s":"nf","q":"Show each movie's title and release year, released in 2023 or later.","sol":"SELECT title, date_part('year', release_date) AS year FROM movie WHERE release_date >= '01-01-2023';","hint":"","db":"netflix","ord":false},{"s":"nf","q":"Show the release date of every TV show as e.g. <i>17 September 2021</i>.","sol":"SELECT title, to_char(release_date, 'FMDD FMMonth YYYY') AS released FROM tv_show;","hint":"","db":"netflix","ord":false},{"s":"nf","q":"How many movies are there per locale? Most first.","sol":"SELECT locale, COUNT(*) FROM movie GROUP BY locale ORDER BY 2 DESC;","hint":"","db":"netflix","ord":true},{"s":"nf","q":"Show every season with the title of its TV show.","sol":"SELECT t.title AS show, s.title AS season, s.season_number FROM season s JOIN tv_show t ON (s.tv_show_id = t.id);","hint":"","db":"netflix","ord":false},{"s":"nf","q":"How many seasons does each TV show have? Show the title, also shows with 0 seasons.","sol":"SELECT t.title, COUNT(s.id) AS seasons FROM tv_show t LEFT JOIN season s ON (t.id = s.tv_show_id) GROUP BY t.title ORDER BY t.title;","hint":"","db":"netflix","ord":false},{"s":"nf","q":"Which TV shows have more than one season? Show title and number of seasons.","sol":"SELECT t.title, COUNT(*) AS seasons FROM tv_show t JOIN season s ON (t.id = s.tv_show_id) GROUP BY t.title HAVING COUNT(*) > 1;","hint":"","db":"netflix","ord":false},{"s":"nf","q":"Show the weekly Top-10 entries for movies: movie title, start date, rank. Sort by start date, then rank.","sol":"SELECT m.title, v.start_date, v.view_rank FROM view_summary v JOIN movie m ON (v.movie_id = m.id) WHERE v.duration = 'WEEKLY' ORDER BY v.start_date, v.view_rank;","hint":"","db":"netflix","ord":true},{"s":"nf","q":"Which movies have ever been number 1 in a weekly ranking? No duplicates.","sol":"SELECT DISTINCT m.title FROM view_summary v JOIN movie m ON (v.movie_id = m.id) WHERE v.view_rank = 1 AND v.duration = 'WEEKLY';","hint":"","db":"netflix","ord":false},{"s":"nf","q":"Total views per movie over all reporting periods, highest first. Only movies with views.","sol":"SELECT m.title, SUM(v.views) AS total_views FROM movie m JOIN view_summary v ON (m.id = v.movie_id) GROUP BY m.title HAVING SUM(v.views) IS NOT NULL ORDER BY total_views DESC;","hint":"","db":"netflix","ord":true},{"s":"nf","q":"Show every movie with the number of view_summary records about it, including movies with none.","sol":"SELECT m.title, COUNT(v.id) AS records FROM movie m LEFT JOIN view_summary v ON (m.id = v.movie_id) GROUP BY m.title ORDER BY m.title;","hint":"","db":"netflix","ord":false},{"s":"nf","q":"Which movies have no viewing statistics at all?","sol":"SELECT m.title FROM movie m LEFT JOIN view_summary v ON (m.id = v.movie_id) WHERE v.id IS NULL;","hint":"","db":"netflix","ord":false},{"s":"nf","q":"For season statistics: TV show title, season title, period start, hours viewed. Only SEMI_ANNUALLY reports.","sol":"SELECT t.title AS show, s.title AS season, v.start_date, v.hours_viewed FROM view_summary v JOIN season s ON (v.season_id = s.id) JOIN tv_show t ON (s.tv_show_id = t.id) WHERE v.duration = 'SEMI_ANNUALLY';","hint":"","db":"netflix","ord":false},{"s":"nf","q":"Total hours viewed per TV show (over all its seasons and periods).","sol":"SELECT t.title, SUM(v.hours_viewed) AS hours FROM tv_show t JOIN season s ON (t.id = s.tv_show_id) JOIN view_summary v ON (s.id = v.season_id) GROUP BY t.title ORDER BY hours DESC;","hint":"","db":"netflix","ord":false},{"s":"nf","q":"For each reporting duration (WEEKLY / SEMI_ANNUALLY): number of records, average views (rounded) and the latest end date.","sol":"SELECT duration, COUNT(*), ROUND(AVG(views)), MAX(end_date) FROM view_summary GROUP BY duration;","hint":"","db":"netflix","ord":false},{"s":"nf","q":"Which weekly records reached the top 5 and spent more than 2 weeks in the top 10? Show id, rank and weeks.","sol":"SELECT id, view_rank, cumulative_weeks_in_top10 FROM view_summary WHERE duration = 'WEEKLY' AND view_rank <= 5 AND cumulative_weeks_in_top10 > 2;","hint":"","db":"netflix","ord":false},{"s":"nf","q":"Pairs of movies released in the same year (each pair once): title 1, title 2, year.","sol":"SELECT m1.title, m2.title, date_part('year', m1.release_date) AS year FROM movie m1 JOIN movie m2 ON (date_part('year', m1.release_date) = date_part('year', m2.release_date) AND m1.id < m2.id);","hint":"","db":"netflix","ord":false},{"s":"nf","q":"Which movies are longer than Lift? Title and runtime.","sol":"SELECT m.title, m.runtime FROM movie m JOIN movie l ON (m.runtime > l.runtime) WHERE l.title = 'Lift';","hint":"","db":"netflix","ord":false},{"s":"nf","q":"Show the number of days each weekly reporting period lasts (id, days).","sol":"SELECT id, end_date - start_date + 1 AS days FROM view_summary WHERE duration = 'WEEKLY';","hint":"","db":"netflix","ord":false},{"s":"nf","q":"Show the titles of all seasons in uppercase, without the show name before the colon (e.g. <i>SEASON 1</i>). Only titles containing a colon.","sol":"SELECT UPPER(TRIM(SUBSTRING(title, POSITION(':' IN title) + 1))) AS season FROM season WHERE POSITION(':' IN title) > 0;","hint":"","db":"netflix","ord":false},{"s":"nf","q":"Average hours viewed per view, rounded to 2 decimals, for every record with views (id, hours per view).","sol":"SELECT id, ROUND(hours_viewed::numeric / views, 2) AS hours_per_view FROM view_summary WHERE views IS NOT NULL;","hint":"Cast to numeric, otherwise integer division cuts the decimals.","db":"netflix","ord":false}],"qz":[{"c":"intro","q":"The same customer address is stored in three rows of a spreadsheet. What is this called?","o":["Redundancy","Integrity","Atomicity","Normalisation"],"a":0,"ex":"Storing the same data in several places. It leads to inconsistency.","code":null},{"c":"intro","q":"Two copies of Anouar's address disagree. This is…","o":["Inconsistency","Redundancy","Referential integrity","A NULL value"],"a":0,"ex":"","code":null},{"c":"intro","q":"What is a DBMS?","o":["The software to use and manage a database","The data itself","A table with metadata","A query language"],"a":0,"ex":"PostgreSQL is a DBMS.","code":null},{"c":"intro","q":"A database contains…","o":["Data and metadata (its structure)","Only data","Only tables of numbers","Only queries"],"a":0,"ex":"","code":null},{"c":"intro","q":"'A structural change of a table doesn't force a change in the RT UPDATE DELETE · DDL CREATE ALTER DROP TRUNCATE · DCL GRANT REVOKE · TCL COMMIT ROLLBACK SAVEPOINT</p>"},{"t":"Select list","b":"<pre>SELECT DISTINCT a, b * 1.1 AS raise,\n  last_name || ' ' || first_name \"Full name\"\nFROM t;</pre><p>Numbers bare · text/dates 'single' · aliases \"double\" (else lowercased).</p>"},{"t":"WHERE","b":"<pre>WHERE x BETWEEN 10 AND 20      -- incl., low first\n  AND UPPER(name) LIKE '_A%'  -- % many, _ one\n  AND dept IN (1, 3)\n  AND manager_id IS NULL      -- never = NULL\n  AND (a = 1 OR b = 2)        -- AND before OR</pre>"},{"t":"ORDER BY and paging","b":"<pre>ORDER BY dept DESC, 2 ASC NULLS FIRST\nOFFSET 3 ROWS\nFETCH NEXT 4 ROWS ONLY      -- or WITH TIES</pre><p>NULL = largest: last in ASC, first in DESC.</p>"},{"t":"Conversion","b":"<pre>to_char(d, 'FMDay DD FMMonth YYYY')\nto_char(n, 'FM9990.00')\nto_date('20 Sep 2021', 'DD Mon YYYY')\nto_number('€2500', 'L9999')\nCAST(x AS INT)   x::int</pre><p>FM no padding · TM translated names · 9 optional digit · 0 forced digit.</p>"},{"t":"Numbers","b":"<pre>round(15251.675, 1)  → 15251.7\nround(15256.675, -1) → 15260\ntrunc(15251.675, 1)  → 15251.6\nmod(5, 3)            → 2</pre>"},{"t":"Dates","b":"<pre>current_date - birth_date      -- days (int)\nbirth_date + interval '65 years'\nage(birth_date)                -- interval\ndate_part('year', age(birth_date))\nEXTRACT(MONTH FROM d)\ndate_part('dow', d)  -- Sun 0..Sat 6\ndate_trunc('month', ts)</pre>"},{"t":"Text","b":"<pre>UPPER LOWER INITCAP LENGTH\nSUBSTRING(s, start, len)  POSITION('o' IN s)\nCONCAT(a, b)  CONCAT_WS(' ', a, b)\nLPAD(s, 10, '*')  RPAD(s, 10, '.')\nTRIM(LEADING 'z' FROM s)  REPLACE(s, 'e', 'o')</pre><p>'a' || NULL = NULL, CONCAT ignores NULL.</p>"},{"t":"Joins","b":"<pre>FROM employees e\nJOIN departments d ON (e.department_id = d.department_id)\nJOIN tasks t USING (employee_id)</pre><p>No condition = Cartesian product. NATURAL JOIN joins on every same-named column (dangerous). Prefix columns that exist in both tables.</p>"},{"t":"Self join","b":"<pre>FROM employees e\nJOIN employees boss ON (e.manager_id = boss.employee_id)\n-- pairs once: e1.id < e2.id</pre>"},{"t":"Aggregates","b":"<pre>COUNT(*) COUNT(col) COUNT(DISTINCT col)\nSUM AVG MIN MAX       -- ignore NULL\nSELECT dept, COUNT(*)\nFROM employees\nWHERE gender = 'F'      -- rows\nGROUP BY dept\nHAVING AVG(salary) > 30000;  -- groups</pre><p>Every non-aggregated column in SELECT goes in GROUP BY. Never an aggregate in WHERE.</p>"},{"t":"Outer joins","b":"<pre>FROM employees e\nLEFT JOIN family_members f ON (e.employee_id = f.employee_id)\nWHERE f.employee_id IS NULL   -- no match</pre><p>Test IS NULL on a PK / NOT NULL column. Count with COUNT(f.col), not COUNT(*). FULL JOIN keeps both sides.</p>"}],"schema":{"enterprise":[{"name":"employees","rows":8,"cols":[{"name":"employee_id","type":"varchar(9)","nn":true,"pk":true},{"name":"last_name","type":"varchar(25)","nn":true,"pk":false},{"name":"infix","type":"varchar(10)","nn":false,"pk":false},{"name":"first_name","type":"varchar(25)","nn":false,"pk":false},{"name":"street","type":"varchar(40)","nn":false,"pk":false},{"name":"postal_code","type":"varchar(6)","nn":false,"pk":false},{"name":"location","type":"varchar(20)","nn":false,"pk":false},{"name":"province","type":"char(2)","nn":false,"pk":false},{"name":"birth_date","type":"date","nn":false,"pk":false},{"name":"parking_spot","type":"numeric(4)","nn":false,"pk":false},{"name":"salary","type":"numeric(7)","nn":false,"pk":false},{"name":"gender","type":"char(1)","nn":false,"pk":false},{"name":"department_id","type":"numeric(2)","nn":false,"pk":false,"fk":"departments"},{"name":"manager_id","type":"varchar(9)","nn":false,"pk":false,"fk":"employees"}]},{"name":"departments","rows":3,"cols":[{"name":"department_id","type":"numeric(2)","nn":true,"pk":true},{"name":"department_name","type":"varchar(20)","nn":true,"pk":false},{"name":"manager_id","type":"varchar(9)","nn":false,"pk":false,"fk":"employees"},{"name":"mgr_start_dat /* ---------- PostgreSQL in the browser ---------- */
let pg = null, pgReady = null;
const ID = x => x;
const PARSERS = {16: v => v === 't' ? 'true' : 'false'}; [20,21,23,700,701,1700,1082,1083,1114,1184,1186,1266,114,3802].forEach(o => PARSERS[o] = ID);
function startDB(){
  if (pgReady) return pgReady;
  pgReady = (async () => {
    const { PGlite } = await import('./vendor/pglite/index.js');
    pg = new PGlite();
    await pg.exec(SEED);
    const st = $('#dbstat'); st.classList.add('ready'); st.lastElementChild.textContent = 'PostgreSQL ready';
    return pg;
  })().catch(e => { $('#dbstat').lastElementChild.textContent = 'database failed to load'; throw e; });
  return pgReady;
}
async function resetDB(){ await startDB(); await pg.exec(SEED); }
let queue = Promise.resolve();
function run(sql, db='enterprise', rollback=true){
  const job = queue.then(async () => {
    await startDB();
    const t0 = performance.now();
    if (rollback) await pg.exec('BEGIN');
    try {
      await pg.exec(`SET search_path TO ${db}; SET datestyle TO ISO, DMY;`);
      const r = await pg.exec(sql, { rowMode: 'array', parsers: PARSERS });
      return { results: r, ms: performance.now() - t0 };
    } finally {
      if (rollback) { try { await pg.exec('ROLLBACK'); } catch(e) {} }
    }
  });
  queue = job.catch(() => {});
  return job;
}

/* ---------- SQL highlighter + editor ---------- */
const KW = 'SELECT|FROM|WHERE|AND|OR|NOT|IN|IS|NULL|AS|ORDER|BY|GROUP|HAVING|ASC|DESC|DISTINCT|JOIN|INNER|LEFT|RIGHT|FULL|OUTER|CROSS|NATURAL|ON|USING|BETWEEN|LIKE|ILIKE|OFFSET|FETCH|NEXT|FIRST|ROWS?|ONLY|WITH|TIES|NULLS|LAST|LIMIT|INSERT|INTO|VALUES|UPDATE|SET|DELETE|CREATE|TABLE|ALTER|DROP|COLUMN|CASE|WHEN|THEN|ELSE|END|TRUE|FALSE|INTERVAL|DATE|TIMESTAMP|TIME|SHOW|LEADING|TRAILING|BOTH|UNION|ALL|EXISTS|PRIMARY|KEY|FOREIGN|REFERENCES|CONSTRAINT|BEGIN|COMMIT|ROLLBACK';
const FN = 'COUNT|SUM|AVG|MIN|MAX|ROUND|TRUNC|MOD|UPPER|LOWER|INITCAP|LENGTH|SUBSTRING|SUBSTR|POSITION|CONCAT|CONCAT_WS|LPAD|RPAD|TRIM|REPLACE|TO_CHAR|TO_DATE|TO_NUMBER|CAST|AGE|DATE_PART|DATE_TRUNC|EXTRACT|NOW|CURRENT_DATE|CURRENT_TIME|CURRENT_TIMESTAMP|COALESCE|ABS|CEIL|FLOOR';
const TOK = new RegExp(`(--[^\\n]*)|('(?:[^']|'')*'?)|("(?:[^"])*"?)|\\b(\\d+(?:\\.\\d+)?)\\b|\\b(${FN})\\b(?=\\s*\\(|\\b)|\\b(${KW})\\b`, 'gi');
function hl(src){
  let out = '', last = 0;
  src.replace(TOK, (m, cm, st, id, nu, fn, kw, off) => {
    out += esc(src.slice(last, off));
    const cls = cm ? 'cm' : st ? 'st' : id ? '' : nu ? 'nu' : fn ? 'fn' : 'kw';
    out += cls ? `<span class="${cls}">${esc(m)}</span>` : esc(m);
    last = off + m.length; return m;
  });
  return out + esc(src.slice(last)) + '\n';
}
function editor(box, value, onRun, minH=110){
  box.innerHTML = `<div class="ed"><pre aria-hidden="true"></pre><textarea spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="SQL editor"></textarea></div>`;
  const ta = $('textarea', box), pre = $('pre', box);
  const fit = () => { ta.style.height = 'auto'; ta.style.height = Math.max(ta.scrollHeight, minH) + 'px'; };
  const sync = () => { pre.innerHTML = hl(ta.value); fit(); };
  ta.value = value || ''; sync();
  ta.addEventListener('input', sync);
  ta.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); onRun && onRun(); }
    else if (e.key === 'Tab' && !e.shiftKey) { e.preventDefault(); const s = ta.selectionStart; ta.setRangeText('  ', s, ta.selectionEnd, 'end'); sync(); }
  });
  return { get: () => ta.value, set: v => { ta.value = v; sync(); }, el: ta };
}
function table(r){
  if (!r.fields || !r.fields.length) return `<div class="msg okm">${r.affectedRows != null ? `Done. ${r.affectedRows} row(s) affected.` : 'Done.'}</div>`;
  const nums = new Set([20,21,23,700,701,1700]);
  const head = r.fields.map(f => `<th>${esc(f.name)}</th>`).join('');
  const rows = r.rows.slice(0, 500).map(row => '<tr>' + row.map((v, i) => `<td class="${nums.has(r.fields[i].dataTypeID) ? 'n' : ''}" title="${esc(v)}">${v === null ? '<span class="null">null</span>' : esc(v)}</td>`).join('') + '</tr>').join('');
  return `<table class="rs"><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table><div class="rcount">${r.rows.length} row${r.rows.length === 1 ? '' : 's'}</div>`;
}
function errMsg(e){ return `<div class="msg err">ERROR: ${esc(e.message || e)}</div>`; }
function consoleBox(box, {sql='', db='enterprise', rollback=true, dbPick=false, extra='', compact=false} = {}){
  box.innerHTML = `<div class="console"><div class="ctool" ${compact ? 'hidden' : ''}>${dbPick ? `<label>database <select class="dbsel"><option value="enterprise">enterprise</option><option value="netflix">netflix</option></select></label>` : `<span>${db}</span>`}<span class="sp"></span>${extra}</div>

/* ---------- checking answers ---------- */
const norm = v => { if (v === null) return '∅'; const s = String(v).trim(); if (/^-?\d+(\.\d+)?$/.test(s)) return String(+s); return s; };
const hasOrder = sql => /\border\s+by\b/i.test(sql.replace(/\([^()]*\)/g, ''));
async function check(ex, userSql){
  let mine, ref;
  try { const r = await run(userSql, ex.db); mine = r.results[r.results.length - 1]; } catch(e) { return { ok: false, msg: 'Your query gives an error: ' + e.message }; }
  const r2 = await run(ex.sol, ex.db); ref = r2.results[r2.results.length - 1];
  if (!mine || !mine.fields) return { ok: false, msg: 'Your statement returns no result table. Write a SELECT.' };
  const A = mine.rows.map(r => r.map(norm)), B = ref.rows.map(r => r.map(norm));
  if (mine.fields.length !== ref.fields.length) return { ok: false, msg: `You return ${mine.fields.length} column(s), the answer has ${ref.fields.length}.`, mine, ref };
  if (A.length !== B.length) return { ok: false, msg: `You return ${A.length} row(s), the answer has ${B.length}.`, mine, ref };
  const key = r => JSON.stringify(r);
  if (ex.ord && hasOrder(ex.sol)) { if (A.every((r, i) => key(r) === key(B[i]))) return { ok: true }; const sa = A.map(key).sort().join(), sb = B.map(key).sort().join(); return { ok: false, msg: sa === sb ? 'Right rows, wrong order. Check your ORDER BY.' : 'The values differ from the expected result.', mine, ref }; }
  const sa = A.map(key).sort().join('|'), sb = B.map(key).sort().join('|');
  return sa === sb ? { ok: true } : { ok: false, msg: 'Same number of rows, but the values differ. Compare with the expected result.', mine, ref };
}

/* ---------- quiz ---------- */
const CHN = Object.fromEntries(NOTES.map(n => [n.id, n.title]));
let QS = null;
function quiz(){
  const cats = [...new Set(QZ.map(q => q.c))];
  const pick = S.qcat || 'all';
  if (!QS) {
    app.innerHTML = `<h1 style="font-size:44px">Quiz</h1><p class="muted">Fifteen random questions. Click an answer to see right away if it's correct and why.</p>
    <div class="chips">${['all', ...cats].map(c => `<button class="chip ${c === pick ? 'on' : ''}" data-c="${c}">${c === 'all' ? 'Everything' : esc(CHN[c] || c)}</button>`).join('')}</div>
    <button class="btn pri" id="qgo">Start</button>
    ${Object.keys(S.quiz).length ? `<p class="small muted" style="margin-top:20px">Best scores: ${Object.entries(S.quiz).map(([k, v]) => `${k === 'all' ? 'Everything' : esc(CHN[k] || k)} ${v}%`).join(', ')}</p>` : ''}`;
    $$('.chip').forEach(b => b.onclick = () => { S.qcat = b.dataset.c; save(); quiz(); });
    $('#qgo').onclick = () => { const pool = QZ.filter(q => pick === 'all' || q.c === pick); QS = { cat: pick, qs: shuffle(pool).slice(0, 15).map(q => ({ ...q, ord: shuffle(q.o.map((_, j) => j)) })), i: 0, ok: 0 }; quiz(); };
    return;
  }
  if (QS.i >= QS.qs.length) {
    const pct = Math.round(100 * QS.ok / QS.qs.length); S.quiz[QS.cat] = Math.max(S.quiz[QS.cat] || 0, pct); save(); if (!QS.sent) { QS.sent = 1; track('quiz', QS.cat, { score: QS.ok, total: QS.qs.length }); }
    app.innerHTML = `<div class="qcard"><h3>${QS.ok} of ${QS.qs.length} correct (${pct}%)</h3><p class="muted">${pct >= 80 ? 'Solid. Try the exercises next.' : 'Read the chapter again and retry.'}</p><button class="btn pri" id="again">New round</button></div>`;
    $('#again').onclick = () => { QS = null; quiz(); }; return;
  }
  const q = QS.qs[QS.i];
  app.innerHTML = `<div class="small muted">${esc(CHN[q.c] || q.c)}, question ${QS.i + 1} of ${QS.qs.length}</div><div class="progress"><i style="width:${100 * QS.i / QS.qs.length}%"></i></div>
    <div class="qcard"><h3>${esc(q.q)}</h3>${q.code ? `<pre class="code">${hl(q.code)}</pre>` : ''}
    ${q.ord.map(j => `<button class="opt" data-j="${j}"><span class="${/[<>=(*'"_%]/.test(q.o[j]) ? 'c' : ''}">${esc(q.o[j])}</span></button>`).join('')}<div id="ex"></div></div>`;
  let done = false;
  $$('.opt').forEach(b => b.onclick = () => {
    if (done) return; done = true; const j = +b.dataset.j, ok = j === q.a; if (ok) QS.ok++;
    b.classList.add(ok ? 'ok' : 'bad'); $(`.opt[data-j="${q.a}"]`).classList.add('ok');
    $('#ex').innerHTML = `${q.ex ? `<div class="expl">${esc(q.ex)}</div>` : ''}<p><button class="btn pri" id="nx">${QS.i + 1 < QS.qs.length ? 'Next question' : 'See score'}</button></p>`;
    $('#nx').onclick = () => { QS.i++; quiz(); }; $('#nx').focus();
  });
}

/* ---------- learn from zero ---------- */
const LSTEPS = LEARN.flatMap((u, ui) => u.steps.map((st, si) => ({ ...st, ui, si, key: ui + '.' + si })));
function start(k){
  let n = LSTEPS.findIndex(s => s.key === k);
  if (n < 0) { n = LSTEPS.findIndex(s => !S.learn[s.key]); if (n < 0) n = 0; return location.replace('#/start/' + LSTEPS[n].key); }
  const st = LSTEPS[n], u = LEARN[st.ui], doneN = LSTEPS.filter(s => S.learn[s.key]).length;
  app.innerHTML = `<div class="lrn"><nav class="lmap" aria-label="Lessons"><div class="small muted">${doneN} of ${LSTEPS.length} steps done</div>
    ${LEARN.map((un, ui) => `<h4>${ui + 1}. ${esc(un.title)}</h4>${un.steps.map((s2, si) => `<a href="#/start/${ui}.${si}" class="${ui + '.' + si === k ? 'on' : ''}"><span class="ck ${S.learn[ui + '.' + si] ? 'd' : ''}">${S.learn[ui + '.' + si] ? '✓' : ''}</span>${esc(s2.t)}</a>`).join('')}`).join('')}</nav>
    <article class="lstep"><div class="unit">Lesson ${st.ui + 1}: ${esc(u.title)}, step ${st.si + 1} of ${u.steps.length}</div><h1>${esc(st.t)}</h1><div class="x">${st.x}</div>
    ${st.ex ? `<p class="small muted" style="margin-bottom:6px">Example. Press Run, change something, run it again.</p><div id="lex"></div>` : ''}
    <div class="yourturn"><h2>Your turn</h2>${st.task ? `<p class="exq" style="font-size:17.5px;margin:6px 0 12px">${st.task.q}</p><div id="ltask"></div><div class="cbar" style="padding:12px 0;border:0"><button class="btn gold" id="lchk">Check</button>${st.task.hint ? '<button class="btn" id="lhint">Hint</button>' : ''}<button class="btn" id="lshow">Show answer</button></div>` : `<p class="exq" style="font-size:17.5px;margin:6px 0 4px">${esc(st.mcq.q)}</p><div id="lmcq">${shuffle(st.mcq.o.map((_, j) => j)).map(j => `<button class="opt" data-j="${j}">${esc(st.mcq.o[j])}</button>`).join('')}</div>`}
    <div id="lfb"></div></div>
    <div class="lnav">${n > 0 ? `<a class="btn" href="#/start/${LSTEPS[n - 1].key}">Back</a>` : ''}<span style="flex:1"></span>${n < LSTEPS.length - 1 ? `<a class="btn ${S.learn[st.key] ? 'pri' : ''}" id="lnext" href="#/start/${LSTEPS[n + 1].key}">${S.learn[st.key] ? 'Next step' : 'Skip'}</a>` : `<a class="btn pri" href="#/exercises">Go to the exercises</a>`}</div></article></div>`;
  if (st.ex) consoleBox($('#lex'), { sql: st.ex, compact: true });
  const fb = $('#lfb');
  const pass = msg => { const first = !S.learn[st.key]; S.learn[st.key] = 1; save(); if (first) track('learn', st.key, { ok: true }); fb.innerHTML = `<div class="verdict ok" style="margin-top:12px">${msg}</div>`; const nx = $('#lnext'); if (nx) { nx.classList.add('pri'); nx.textContent = 'Next step'; nx.focus(); } $$('.lmap a.on .ck').forEach(c => { c.classList.add('d'); c.textContent = '✓'; }); };
  if (st.task) {
    const c = consoleBox($('#ltask'), { sql: S.drafts['L' + st.key] || '', compact: true });
    c.ed.el.addEventListener('input', () => { S.drafts['L' + st.key] = c.ed.get(); save(); });
    $('#lchk').onclick = async () => {
      if (!c.ed.get().trim()) { fb.innerHTML = '<div class="verdict no" style="margin-top:12px">Write your query in the box first.</div>'; return; }
      const r = await check({ sol: st.task.sol, db: 'enterprise', ord: /\border\b|\bsort|first$/i.test(st.task.q) }, c.ed.get());
      if (r.ok) pass('Correct. That is exactly the right result.');
      else fb.innerHTML = `<div class="verdict no" style="margin-top:12px">${esc(r.msg)}</div>${r.ref ? `<p class="small muted">The result should look like this:</p><div class="console res" style="max-height:240px">${table(r.ref)}</div>` : ''}`;
    };
    if (st.task.hint) $('#lhint').onclick = () => { fb.innerHTML = `<div class="expl">Hint: ${st.task.hint}</div>`; };
    $('#lshow').onclick = () => { fb.innerHTML = `<p class="small muted" style="margin-top:12px">One correct answer. Type it yourself in the box and press Check, that's how it sticks.</p><pre class="code">${hl(st.task.sol)}</pre>`; };
  } else {
    let done = false;
    $$('#lmcq .opt').forEach(b => b.onclick = () => { if (done) return; const j = +b.dataset.j; if (j === st.mcq.a) { done = true; b.classList.add('ok'); pass(st.mcq.why ? 'Correct. ' + esc(st.mcq.why) : 'Correct.'); } else { b.classList.add('bad'); fb.innerHTML = '<div class="verdict no" style="margin-top:12px">Not this one. Read the explanation again and try another answer.</div>'; } });
  }
  startDB();
}

  }).sort((a, b) => new Date(b.last) - new Date(a.last));

    <div class="kpis"><div>${st.length}<span>students</span></div><div>${rows.filter(r => new Date(r.last) > day).length}<span>active last 24 h</span></div><div>${ev.filter(e => e.kind === 'mock').length}<span>mock exams taken</span></div><div>${ev.filter(e => e.kind === 'exercise' && e.ok).length}<span>exercises solved</span></div></div>

    </tbody></table><div id="adet"></div></div>`;
  $('#arf').onclick = async () => { const p = ADM.pass; ADM = null; app.innerHTML = '<p class="loading">Refreshing…</p>'; const r = await fetch(CFG.url + '/rest/v1/rpc/admin_data', { method: 'POST', headers: { apikey: CFG.key, Authorization: 'Bearer ' + CFG.key, 'Content-Type': 'application/json' }, body: JSON.stringify({ pass: p }) }); ADM = await r.json(); ADM.pass = p; admin(); };

    $('#adet').scrollIntoView({ behavior: 'smooth' });
  });
}
