the last name, e.g. <i>B. Bordoloi</i>.","sol":"SELECT SUBSTRING(first_name, 1, 1) || '. ' || last_name FROM employees;","hint":"","db":"enterprise","ord":false},{"s":"functions","q":"Show each last name and the position of the first 'e' in it (0 when there is none).","sol":"SELECT last_name, POSITION('e' IN last_name) FROM employees;","hint":"","db":"enterprise","ord":false},{"s":"functions","q":"Show the full name of every employee (first name, infix, last name) separated by spaces, without the result becoming empty when infix is NULL.","sol":"SELECT CONCAT_WS(' ', first_name, infix, last_name) FROM employees;","hint":"CONCAT_WS skips NULLs.","db":"enterprise","ord":false},{"s":"functions","q":"Show each project name padded on the left with dots to 25 characters.","sol":"SELECT LPAD(project_name, 25, '.') FROM projects;","hint":"","db":"enterprise","ord":false},{"s":"functions","q":"Show each street with 'straat' replaced by 'str.'","sol":"SELECT REPLACE(street, 'straat', 'str.') FROM employees;","hint":"","db":"enterprise","ord":false},{"s":"functions","q":"Show each salary divided by 12, rounded to 1 decimal and, in another column, truncated to whole euros.","sol":"SELECT ROUND(salary / 12, 1), TRUNC(salary / 12) FROM employees;","hint":"","db":"enterprise","ord":false},{"s":"functions","q":"Show the salary of every employee formatted with 2 decimals and no leading spaces, e.g. <i>55000.00</i>.","sol":"SELECT TO_CHAR(salary, 'FM99999.00') FROM employees;","hint":"","db":"enterprise","ord":false},{"s":"functions","q":"Show the employees whose employee_id, converted to a number, is bigger than 999500000.","sol":"SELECT employee_id, last_name FROM employees WHERE CAST(employee_id AS INT) > 999500000;","hint":"employee_id is text: CAST it.","db":"enterprise","ord":false},{"s":"functions","q":"Show the remainder of each parking spot number divided by 2 (MOD), next to the last name.","sol":"SELECT last_name, MOD(parking_spot, 2) FROM employees;","hint":"","db":"enterprise","ord":false},{"s":"joins","q":"Show each employee's last name with the name of the department they work in.","sol":"SELECT e.last_name, d.department_name FROM employees e JOIN departments d ON (e.department_id = d.department_id);","hint":"","db":"enterprise","ord":false},{"s":"joins","q":"Show each employee's last name with their department name, only for the department Production, sorted by last name.","sol":"SELECT e.last_name, d.department_name FROM employees e JOIN departments d ON (e.department_id = d.department_id) WHERE d.department_name = 'Production' ORDER BY e.last_name;","hint":"","db":"enterprise","ord":true},{"s":"joins","q":"Show each employee's last name and department name, joining with USING.","sol":"SELECT last_name, department_name FROM employees JOIN departments USING (department_id);","hint":"With USING, write department_id without prefix.","db":"enterprise","ord":false},{"s":"joins","q":"Show each department name with the last name of the employee who manages it.","sol":"SELECT d.department_name, e.last_name FROM departments d JOIN employees e ON (d.manager_id = e.employee_id);","hint":"departments.manager_id points to employees.employee_id.","db":"enterprise","ord":false},{"s":"joins","q":"Show each department name with all its locations.","sol":"SELECT d.department_name, l.location FROM departments d JOIN locations l ON (d.department_id = l.department_id);","hint":"","db":"enterprise","ord":false},{"s":"joins","q":"Show for every task: employee last name, project name and hours.","sol":"SELECT e.last_name, p.project_name, t.hours FROM employees e JOIN tasks t ON (e.employee_id = t.employee_id) JOIN projects p ON (t.project_id = p.project_id);","hint":"","db":"enterprise","ord":false},{"s":"joins","q":"Show the last names of employees who work on the project Warehouse.","sol":"SELECT e.last_name FROM employees e JOIN tasks t ON (e.employee_id = t.employee_id) JOIN projects p ON (t.project_id = p.project_id) WHERE p.project_name = 'Warehouse';","hint":"","db":"enterprise","ord":false},{"s":"joins","q":"Show each family member's name, relationship and the department name of their employee.","sol":"SELECT f.name, f.relationship, d.department_name FROM family_members f JOIN employees e ON (f.employee_id = e.employee_id) JOIN departments d ON (e.department_id = d.department_id);","hint":"","db":"enterprise","ord":false},{"s":"joins","q":"Show each employee's last name with the last name of their boss, in a column called <b>boss</b>.","sol":"SELECT e.last_name, b.last_name AS boss FROM employees e JOIN employees b ON (e.manager_id = b.employee_id);","hint":"Self join: e = employee, b = boss.","db":"enterprise","ord":false},{"s":"joins","q":"Who works in the same department as Joyner (Joyner herself not included)?","sol":"SELECT e.last_name FROM employees j JOIN employees e ON (j.department_id = e.department_id) WHERE j.last_name = 'Joyner' AND e.last_name <> 'Joyner';","hint":"","db":"enterprise","ord":false},{"s":"joins","q":"Who earns less than Joosten? Show last name and salary.","sol":"SELECT e.last_name, e.salary FROM employees e JOIN employees j ON (e.salary < j.salary) WHERE j.last_name = 'Joosten';","hint":"","db":"enterprise","ord":false},{"s":"joins","q":"Show pairs of employees in the same department, each pair only once (department, name 1, name 2).","sol":"SELECT e1.department_id, e1.last_name, e2.last_name FROM employees e1 JOIN employees e2 ON (e1.department_id = e2.department_id AND e1.employee_id < e2.employee_id);","hint":"Use < instead of <>.","db":"enterprise","ord":false},{"s":"joins","q":"Show the employees whose boss's boss is Bordoloi.","sol":"SELECT e.last_name FROM employees e JOIN employees b ON (e.manager_id = b.employee_id) JOIN employees bb ON (b.manager_id = bb.employee_id) WHERE bb.last_name = 'Bordoloi';","hint":"","db":"enterprise","ord":false},{"s":"joins","q":"Show each project name with the name of the department that supports it and the employees (last names) working on it.","sol":"SELECT p.project_name, d.department_name, e.last_name FROM projects p JOIN departments d ON (p.department_id = d.department_id) JOIN tasks t ON (p.project_id = t.project_id) JOIN employees e ON (t.employee_id = e.employee_id);","hint":"","db":"enterprise","ord":false},{"s":"group","q":"How many employees are there, and what is the total of all salaries?","sol":"SELECT COUNT(*), SUM(salary) FROM employees;","hint":"","db":"enterprise","ord":false},{"s":"group","q":"Show the lowest, highest and average salary (average rounded to whole euros).","sol":"SELECT MIN(salary), MAX(salary), ROUND(AVG(salary)) FROM employees;","hint":"","db":"enterprise","ord":false},{"s":"group","q":"How many tasks are there, and for how many are the hours filled in?","sol":"SELECT COUNT(*), COUNT(hours) FROM tasks;","hint":"COUNT(column) skips NULL.","db":"enterprise","ord":false},{"s":"group","q":"How many different employees have at least one task?","sol":"SELECT COUNT(DISTINCT employee_id) FROM tasks;","hint":"","db":"enterprise","ord":false},{"s":"group","q":"What is the birth date of the oldest family member?","sol":"SELECT MIN(birth_date) FROM family_members;","hint":"","db":"enterprise","ord":false},{"s":"group","q":"Show for each department the number of employees.","sol":"SELECT department_id, COUNT(*) FROM employees GROUP BY department_id;","hint":"","db":"enterprise","ord":false},{"s":"group","q":"Show for each gender the average salary, rounded.","sol":"SELECT gender, ROUND(AVG(salary)) FROM employees GROUP BY gender;","hint":"","db":"enterprise","ord":false},{"s":"group","q":"Show for each employee_id the total hours they worked (tasks).","sol":"SELECT employee_id, SUM(hours) FROM tasks GROUP BY employee_id;","hint":"","db":"enterprise","ord":false},{"s":"group","q":"Show for each relationship type (PARTNER, SON, DAUGHTER) how many family members there are.","sol":"SELECT relationship, COUNT(*) FROM family_members GROUP BY relationship;","hint":"","db":"enterprise","ord":false},{"s":"group","q":"Show for each department and gender combination the number of employees.","sol":"SELECT department_id, gender, COUNT(*) FROM employees GROUP BY department_id, gender;","hint":"","db":"enterprise","ord":false},{"s":"group","q":"Show the departments whose total salary cost is more than 100000.","sol":"SELECT department_id, SUM(salary) FROM employees GROUP BY department_id HAVING SUM(salary) > 100000;","hint":"","db":"enterprise","ord":false},{"s":"group","q":"Show the employee_ids that work on more than 2 projects.","sol":"SELECT employee_id, COUNT(*) FROM tasks GROUP BY employee_id HAVING COUNT(*) > 2;","hint":"","db":"enterprise","ord":false},{"s":"group","q":"Show for each department the average salary of the men only, but only departments where that average is above 35000.","sol":"SELECT department_id, AVG(salary) FROM employees WHERE gender = 'M' GROUP BY department_id HAVING AVG(salary) > 35000;","hint":"Men → WHERE. Average → HAVING.","db":"enterprise","ord":false},{"s":"group","q":"Show each department name with its number of employees, sorted from most to fewest.","sol":"SELECT d.department_name, COUNT(*) FROM employees e JOIN departments d ON (e.department_id = d.department_id) GROUP BY d.department_name ORDER BY 2 DESC;","hint":"","db":"enterprise","ord":true},{"s":"group","q":"Show each project name with the total hours worked on it, only projects with more than 40 hours.","sol":"SELECT p.project_name, SUM(t.hours) FROM projects p JOIN tasks t ON (p.project_id = t.project_id) GROUP BY p.project_name HAVING SUM(t.hours) > 40;","hint":"","db":"enterprise","ord":false},{"s":"group","q":"What is the average of the lowest salaries of all departments? (subquery in FROM)","sol":"SELECT ROUND(AVG(min_sal)) FROM (SELECT MIN(salary) AS min_sal FROM employees GROUP BY department_id) x;","hint":"","db":"enterprise","ord":false},{"s":"outer","q":"Show every employee's last name with the names of their family members, also employees without family.","sol":"SELECT e.last_name, f.name FROM employees e LEFT JOIN family_members f ON (e.employee_id = f.employee_id);","hint":"","db":"enterprise","ord":false},{"s":"outer","q":"Show the last names of the employees who have no family members.","sol":"SELECT e.last_name FROM employees e LEFT JOIN family_members f ON (e.employee_id = f.employee_id) WHERE f.employee_id IS NULL;","hint":"Test a column that is never empty in a real family row.","db":"enterprise","ord":false},{"s":"outer","q":"Show every employee with the last name of their boss, the employee without boss included.","sol":"SELECT e.last_name, b.last_name AS boss FROM employees e LEFT JOIN employees b ON (e.manager_id = b.employee_id);","hint":"","db":"enterprise","ord":false},{"s":"outer","q":"Show the last names of employees who manage nobody.","sol":"SELECT e.last_name FROM employees e LEFT JOIN employees s ON (s.manager_id = e.employee_id) WHERE s.employee_id IS NULL;","hint":"","db":"enterprise","ord":false},{"s":"outer","q":"Show for every employee (all of them) how many tasks they have. Employees without tasks must show 0.","sol":"SELECT e.last_name, COUNT(t.project_id) FROM employees e LEFT JOIN tasks t ON (e.employee_id = t.employee_id) GROUP BY e.employee_id, e.last_name;","hint":"COUNT(*) would count the NULL row as 1.","db":"enterprise","ord":false},{"s":"outer","q":"Show every project name with the last names of the people working on it (if any).","sol":"SELECT p.project_name, e.last_name FROM projects p LEFT JOIN tasks t ON (p.project_id = t.project_id) LEFT JOIN employees e ON (t.employee_id = e.employee_id);","hint":"","db":"enterprise","ord":false},{"s":"outer","q":"Show every department name and its projects, written as a RIGHT JOIN (departments must all appear).","sol":"SELECT d.department_name, p.project_name FROM projects p RIGHT JOIN departments d ON (p.department_id = d.department_id);","hint":"","db":"enterprise","ord":false},{"s":"outer","q":"Show for every employee the n function startDB(){

  return pgReady;
}
async function resetDB(){ await startDB(); await pg.exec(SEED); }
let queue = Promise.resolve();
function run(sql, db='enterprise', rollback=true){
  const job = queue.then(async () => {
    await startDB();
    const t0 = performance.now();
    if (rollback) await pg.exec('BEGIN');
    try {
      await pg.exec(`SET search_path TO ${db}; SET datestyle TO ISO, DMY;`);
      const r = await pg.exec(sql, { rowMode: 'array', parsers: PARSERS });
      return { results: r, ms: performance.now() - t0 };
    } finally {
      if (rollback) { try { await pg.exec('ROLLBACK'); } catch(e) {} }
    }
  });
  queue = job.catch(() => {});
  return job;
}

const norm = v => { if (v === null) return '∅'; const s = String(v).trim(); if (/^-?\d+(\.\d+)?$/.test(s)) return String(+s); return s; };
const hasOrder = sql => /\border\s+by\b/i.test(sql.replace(/\([^()]*\)/g, ''));
async function check(ex, userSql){
  let mine, ref;
  try { const r = await run(userSql, ex.db); mine = r.results[r.results.length - 1]; } catch(e) { return { ok: false, msg: 'Your query gives an error: ' + e.message }; }
  const r2 = await run(ex.sol, ex.db); ref = r2.results[r2.results.length - 1];
  if (!mine || !mine.fields) return { ok: false, msg: 'Your statement returns no result table. Write a SELECT.' };
  const A = mine.rows.map(r => r.map(norm)), B = ref.rows.map(r => r.map(norm));
  if (mine.fields.length !== ref.fields.length) return { ok: false, msg: `You return ${mine.fields.length} column(s), the answer has ${ref.fields.length}.`, mine, ref };
  if (A.length !== B.length) return { ok: false, msg: `You return ${A.length} row(s), the answer has ${B.length}.`, mine, ref };
  const key = r => JSON.stringify(r);
  if (ex.ord && hasOrder(ex.sol)) { if (A.every((r, i) => key(r) === key(B[i]))) return { ok: true }; const sa = A.map(key).sort().join(), sb = B.map(key).sort().join(); return { ok: false, msg: sa === sb ? 'Right rows, wrong order. Check your ORDER BY.' : 'The values differ from the expected result.', mine, ref }; }
  const sa = A.map(key).sort().join('|'), sb = B.map(key).sort().join('|');
  return sa === sb ? { ok: true } : { ok: false, msg: 'Same number of rows, but the values differ. Compare with the expected result.', mine, ref };
}

/* split a reference query into readable steps */
const CL = [['select','SELECT','Show these columns'],['from','FROM','Take the rows from'],['join','JOIN','Link the other table(s)'],['where','WHERE','Keep only the rows where'],['group','GROUP BY','Make one group per'],['having','HAVING','Keep only the groups where'],['order','ORDER BY','Sort by'],['offset','OFFSET','Skip'],['fetch','FETCH','Then only take']];
function steps(sql){
  sql = sql.replace(/;\s*$/, '');
  let depth = 0, cuts = [];
  const re = /\(|\)|\b(SELECT|FROM|(?:LEFT |RIGHT |FULL |INNER )?JOIN|WHERE|GROUP BY|HAVING|ORDER BY|OFFSET|FETCH)\b/gi; let m;
  while ((m = re.exec(sql))) { if (m[0] === '(') depth++; else if (m[0] === ')') depth--; else if (!depth) cuts.push([m.index, m[1].toUpperCase()]); }
  const parts = cuts.map(([p, k], n) => ({ k, txt: sql.slice(p, n + 1 < cuts.length ? cuts[n + 1][0] : sql.length).trim() }));
  const kind = k => /JOIN/.test(k) ? 'join' : k.split(' ')[0].toLowerCase();
  const out = [];
  for (const [id, , label] of CL.slice(1).concat([CL[0]]).sort((x, y) => ['from','join','where','group','having','select','order','offset','fetch'].indexOf(x[0]) - ['from','join','where','group','having','select','order','offset','fetch'].indexOf(y[0]))) {
    const ps = parts.filter(p => kind(p.k) === id); if (ps.length) out.push({ label, code: ps.map(p => p.txt).join('\n') });
  }
  return out;
}
const tablesIn = sql => [...new Set([...sql.matchAll(/\b(?:FROM|JOIN)\s+([a-z_]+)/gi)].map(m => m[1].toLowerCase()))].filter(t => SCHEMA.enterprise.some(x => x.name === t));
function dataTable(r, hot){
  const ord = r.fields.map((f, i) => i).sort((x, y) => (hot.has(r.fields[y].name) - hot.has(r.fields[x].name)) || x - y);
  r = { fields: ord.map(i => r.fields[i]), rows: r.rows.map(row => ord.map(i => row[i])) };
  const head = r.fields.map(f => `<th class="${hot.has(f.name) ? 'hot' : ''}">${esc(f.name)}</th>`).join('');
  const rows = r.rows.map(row => '<tr>' + row.map((v, i) => `<td class="${hot.has(r.fields[i].name) ? 'hot' : ''}">${v === null ? '<span class="null">null</span>' : esc(v)}</td>`).join('') + '</tr>').join('');
  return `<table class="rs"><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table>`;
}
/* ---------- explain a reference query in plain words ---------- */
const FEAT = [
  [/\bCOUNT\(\*\)/i, 'COUNT(*) counts rows, NULLs included.'],
  [/\bCOUNT\((?!\*)(?!DISTINCT)[^)]+\)/i, 'COUNT(column) only counts rows where that column is filled in.'],
  [/\bCOUNT\(DISTINCT/i, 'COUNT(DISTINCT …) counts each different value once.'],
  [/\bSUM\(/i, 'SUM adds the values up.'], [/\bAVG\(/i, 'AVG gives the average (NULLs are skipped).'],
  [/\bMIN\(/i, 'MIN takes the smallest value (for dates: the oldest).'], [/\bMAX\(/i, 'MAX takes the biggest value (for dates: the most recent).'],
  [/\bDISTINCT\b(?!\s*\w+\))/i, 'DISTINCT removes duplicate rows from the result.'],
  [/\|\|/, '|| glues text together. If one part is NULL, the whole result becomes NULL.'],
  [/\bCONCAT_WS\(/i, 'CONCAT_WS(separator, …) glues values with a separator and skips NULLs.'],
  [/\bAS\s+"/i, 'An alias in "double quotes" keeps capitals and spaces in the header.'],
  [/\bBETWEEN\b/i, 'BETWEEN low AND high includes both limits; the small value comes first.'],
  [/\bLIKE\b/i, 'LIKE searches with a pattern: % = any number of characters, _ = exactly one.'],
  [/\bNOT IN\b/i, 'NOT IN (…) keeps rows whose value is not in the list.'],
  [/\b(?<!NOT )IN\s*\(/i, 'IN (…) is a short way to write several ORs.'],
  [/\bIS NULL\b/i, 'IS NULL finds empty values. "= NULL" never works.'], [/\bIS NOT NULL\b/i, 'IS NOT NULL keeps only filled-in values.'],
  [/\b(UPPER|LOWER)\(/i, 'UPPER/LOWER make the text comparison independent of capitals.'],
  [/\bINITCAP\(/i, 'INITCAP writes the first letter of every word as a capital.'],
  [/\bTO_CHAR\([^)]*'[^']*(DD|MM|YY|Month|Day)/i, 'TO_CHAR(date, mask) turns a date into text in the layout you want. FM removes padding spaces.'],
  [/\bTO_CHAR\([^)]*'[^']*[90]/i, 'TO_CHAR(number, mask) formats a number: 9 = digit, 0 = forced digit, FM = no leading space.'],
  [/\bage\(/i, 'age(date) gives the time between that date and today (years, months, days).'],
  [/\bdate_part\(/i, "date_part('part', …) takes one piece out of a date: year, month, dow (day of week, Sunday = 0)…"],
  [/\binterval\b/i, "interval '…' is an amount of time you can add to or compare with dates."],
  [/current_date\s*-/i, 'date − date gives a number of days.'],
  [/\bROUND\(/i, 'ROUND rounds; the second number is how many decimals.'], [/\bTRUNC\(/i, 'TRUNC cuts the decimals off without rounding.'],
  [/\bMOD\(/i, 'MOD gives the remainder of a division.'],
  [/\bSUBSTRING\(/i, 'SUBSTRING(text, start, length) takes a piece of the text.'], [/\bPOSITION\(/i, "POSITION('x' IN text) gives where x first appears (0 = not found)."],
  [/\bLENGTH\(/i, 'LENGTH counts the characters, spaces included.'], [/\b[LR]PAD\(/i, 'LPAD/RPAD fill the text up to a length with a character.'],
  [/\bREPLACE\(/i, 'REPLACE(text, old, new) swaps every occurrence.'], [/\bTRIM\(/i, 'TRIM removes characters at the start and/or end.'],
  [/\bCAST\(|::/i, 'CAST converts a value to another type (here text → number).'],
  [/\bUSING\s*\(/i, 'USING (column) joins on a column with the same name in both tables; write it without prefix.'],
  [/\bLEFT JOIN\b/i, 'LEFT JOIN keeps every row of the left table, also when there is no match (the right side becomes NULL).'],
  [/\bRIGHT JOIN\b/i, 'RIGHT JOIN keeps every row of the right table.'],
  [/\bWITH TIES\b/i, 'WITH TIES also keeps the rows that are equal to the last one.'],
  [/\bNULLS (FIRST|LAST)\b/i, 'NULLS FIRST/LAST decides where the empty values go in the sort.'],
  [/\bFROM\s*\(\s*SELECT/i, 'A query in FROM (subquery) is calculated first; the outer query then works on its result.'],
];
const ALLCOLS = [...new Set(SCHEMA.enterprise.flatMap(t => t.cols.map(c => c.name)))];
const colsIn = c => ALLCOLS.filter(n => new RegExp('\\b' + n + '\\b', 'i').test(c));
function describeCol(t){
  const bare = t.replace(/\s+AS\s+.*$/i, '').replace(/\s+"[^"]*"$/, '').trim();
  if (/^[a-z_]+(\.[a-z_]+)?$/i.test(bare) || bare === '*') return `<code>${esc(bare === '*' ? 'all columns' : bare.replace(/^\w+\./, ''))}</code>`;
  const used = colsIn(bare).map(n => `<code>${n}</code>`).join(', ');
  const kind = /COUNT\(/i.test(bare) ? 'a count' : /SUM\(/i.test(bare) ? 'a total' : /AVG\(/i.test(bare) ? 'an average' : /MIN\(/i.test(bare) ? 'the smallest value' : /MAX\(/i.test(bare) ? 'the biggest value' : /TO_CHAR/i.test(bare) ? 'a formatted value' : /age\(|date_part|interval|current_date/i.test(bare) ? 'a date calculation' : /\|\||CONCAT/i.test(bare) ? 'glued-together text' : /UPPER|LOWER|INITCAP|SUBSTRING|POSITION|LENGTH|PAD|REPLACE|TRIM/i.test(bare) ? 'a text function' : /ROUND|TRUNC|MOD|[-+*/]/.test(bare) ? 'a calculation' : 'a calculated value';
  return used ? `${kind} of ${used}` : kind;
}
function explain(sql){
  const st = steps(sql), out = [];
  const names = sql.match(/\b(FROM|JOIN)\s+([a-z_]+)(?:\s+(?!ON\b|USING\b|WHERE\b|JOIN\b|LEFT\b|RIGHT\b|FULL\b|INNER\b|GROUP\b|ORDER\b)([a-z]\w*))?/gi) || [];
  const tbls = tablesIn(sql), selfJoin = names.length > tbls.length && tbls.length;
  for (const x of st) {
    const c = x.code, up = c.toUpperCase();
    let plain = '', why = '';
    if (x.label.startsWith('Take')) { plain = tbls.length ? `The data you need is in ${tbls.map(t => `<code>${t}</code>`).join(', ')}.` : 'No table is needed: you only calculate.'; why = tbls.length > 1 ? 'Every table you take a column from must be in FROM or a JOIN.' : 'FROM says which table to read.'; }
    else if (x.label.startsWith('Link')) { plain = selfJoin ? 'You compare rows of the <b>same table</b> with each other, so the table is used twice with two nicknames (a self join).' : `The question needs columns from more than one table, so the tables are <b>joined</b>.`; why = 'ON (… = …) matches each row with the row in the other table that has the same id (foreign key = primary key).' + (/LEFT|RIGHT|FULL/.test(up) ? ' The question also wants the rows <b>without</b> a match, so it is an outer join.' : ''); }
    else if (x.label.startsWith('Keep only the rows')) { { const cs = colsIn(c); plain = `The question doesn't want every row: only the ones that match a <b>condition</b>${cs.length ? ' on ' + cs.map(n => `<code>${n}</code>`).join(', ') : ''}.`; } why = 'WHERE filters single rows, before any grouping.'; }
    else if (x.label.startsWith('Make one group')) { plain = `The question asks something <b>per</b> ${esc(c.replace(/^GROUP BY\s*/i, '').replace(/\b\w+\./g, ''))} ("for each …"), so you make one group per value.`; why = 'Every column in SELECT that is not inside COUNT/SUM/AVG/MIN/MAX must be in GROUP BY.'; }
    else if (x.label.startsWith('Keep only the groups')) { plain = 'There is also a condition on a <b>total, count or average</b>, so it can only be checked after grouping.'; why = 'The condition uses COUNT/SUM/AVG, which only exist after grouping, so it goes in HAVING. WHERE can\'t use them.'; }
    else if (x.label.startsWith('Show')) { const cols = c.replace(/^SELECT\s+/i, '').split(/,(?![^(]*\))/).map(t => t.trim()); plain = `The answer shows ${cols.length} column${cols.length > 1 ? 's' : ''}: ${cols.map(describeCol).join(', ')}.`; why = /COUNT|SUM|AVG|MIN|MAX/i.test(c) ? 'Aggregate functions turn many rows into one number (per group).' : 'SELECT picks the columns (and calculations) the question asks to see.'; }
    else if (x.label.startsWith('Sort')) { { const cs = colsIn(c); plain = `The question wants the rows in a certain <b>order</b>${cs.length ? ' (by ' + cs.map(n => `<code>${n}</code>`).join(', ') + ')' : ''}.`; } why = 'ORDER BY sorts: ASC (default) small → big / A → Z, DESC big → small. With several columns, the next one decides when the first is equal.'; }
    else if (x.label.startsWith('Skip')) { plain = 'Some rows at the top of the sorted list are skipped.'; why = 'OFFSET n ROWS skips n rows.'; }
    else if (x.label.startsWith('Then')) { plain = 'Only the first few rows of the sorted list are wanted ("top 3", "the youngest").'; why = 'FETCH FIRST n ROWS ONLY cuts the list after n rows; always together with ORDER BY.'; }
    out.push({ ...x, plain, why });
  }
  const notes = FEAT.filter(([re]) => re.test(sql)).map(([, t]) => t);
  return { parts: out, notes };
}

function exercise(i){
  i = +i; const ex = EX[i]; if (!ex) return exercises();
  const list = exIdx(ex.s), k = list.findIndex(([, j]) => j === i), setName = SETS.find(s => s[0] === ex.s)[1];
  const tbls = tablesIn(ex.sol), st = steps(ex.sol), xp = explain(ex.sol);
  app.innerHTML = `<div class="exhead"><a href="#/exercises" class="small">All exercises</a><span class="num">${esc(setName)}, exercise ${k+1} of ${list.length}</span><a class="small" href="#/learn/${ex.s}">Read this chapter</a></div>
    <div class="dots" style="margin:12px 0">${list.map(([e, j], n) => `<a class="dot ${S.done[j] ? 'done' : ''} ${j === i ? 'cur' : ''}" href="#/ex/${j}">${n+1}</a>`).join('')}</div>
    <div class="exflow">

      <section class="exbox"><div class="exn">3</div><div style="min-width:0;flex:1"><h3>What your query must return</h3><p class="small muted" style="margin:2px 0 10px">Your result must have these values${ex.ord ? ', in this order' : ''}. Your column names can be different.</p><div id="xtarget" class="console res" style="max-height:300px"></div></div></section>
      <section class="exbox"><div class="exn">4</div><div style="min-width:0;flex:1"><h3>Write your query</h3><div id="xc" style="margin-top:8px"></div>
        <div class="cbar" style="padding:12px 0;border:0"><button class="btn gold" id="chk">Check</button><button class="btn" id="stp">Help me step by step</button><button class="btn" id="shw">Show answer</button><span class="sp" style="flex:1"></span>${k > 0 ? `<a class="btn" href="#/ex/${list[k-1][1]}">Previous</a>` : ''}${k < list.length - 1 ? `<a class="btn" href="#/ex/${list[k+1][1]}">Next</a>` : ''}</div>
        <div id="xsteps"></div><div id="fb"></div></div></section>
    </div>`;
  (async () => {
    const out = [];
    for (const t of tbls) { try { const r = await run(`SELECT * FROM ${t}`, ex.db); const res = r.results[r.results.length - 1]; const hot = new Set(res.fields.map(f => f.name).filter(n => new RegExp('\\b' + n + '\\b', 'i').test(ex.sol))); out.push(`<div class="dtab"><div class="dname">${t} <span class="muted">${res.rows.length} rows</span></div><div class="console res" style="max-height:230px">${dataTable(res, hot)}</div></div>`); } catch(e) {} }
    $('#xdata').innerHTML = out.join('') || '<p class="small muted">This one works without a table.</p>';
    try { const r = await run(ex.sol, ex.db); $('#xtarget').innerHTML = table(r.results[r.results.length - 1]); } catch(e) {}
  })();
  const c = consoleBox($('#xc'), { sql: S.drafts[i] || '', db: ex.db, compact: true });
  c.ed.el.addEventListener('input', () => { S.drafts[i] = c.ed.get(); save(); });
  const fb = $('#fb');
  $('#chk').onclick = async () => {
    if (!c.ed.get().trim()) { fb.innerHTML = '<div class="verdict no">Write a query first.</div>'; return; }
    fb.innerHTML = '<div class="verdict">Checking…</div>';
    const r = await check(ex, c.ed.get());
    if (r.ok) { S.done[i] = 1; save(); fb.innerHTML = `<div class="verdict ok">Correct. Your result matches step 3.</div>${xp.notes.length ? `<div class="expl"><b>Why this works</b><ul style="margin:4px 0 0;padding-left:18px">${xp.notes.map(n => `<li>${esc(n)}</li>`).join('')}</ul></div>` : ''}${k < list.length - 1 ? `<p><a class="btn pri" href="#/ex/${list[k+1][1]}">Next exercise</a></p>` : ''}`; $$('.dot.cur').forEach(d => d.classList.add('done')); }
    else fb.innerHTML = `<div class="verdict no">${esc(r.msg)}</div>${r.mine && r.mine.fields ? `<p class="small muted">Your result (compare it with step 3):</p><div class="console res" style="max-height:240px">${table(r.mine)}</div>` : ''}`;
  };
  let shown = 0;
  const showSteps = () => {
    $('#xsteps').innerHTML = `<ol class="steps">${xp.parts.slice(0, shown).map(x => `<li><b>${x.label}</b><pre class="code">${hl(x.code)}</pre><div class="why">Why: ${x.why}</div></li>`).join('')}</ol>${ex.hint && shown >= 1 ? `<div class="expl">Tip: ${ex.hint}</div>` : ''}${shown >= st.length && xp.notes.length ? `<div class="expl"><b>Good to know for this query</b><ul style="margin:4px 0 0;padding-left:18px">${xp.notes.map(n => `<li>${esc(n)}</li>`).join('')}</ul></div>` : ''}`;

}

/* ---------- quiz ---------- */
const CHN = Object.fromEntries(NOTES.map(n => [n.id, n.title]));
let QS = null;
function quiz(cat){
  if (cat) { S.qcat = cat; save(); QS = null; history.replaceState(null, '', '#/quiz'); const pool = QZ.filter(q => q.c === cat); QS = { cat, qs: shuffle(pool).slice(0, 30).map(q => ({ ...q, ord: shuffle(q.o.map((_, j) => j)) })), i: 0, ok: 0 }; }
  const cats = [...new Set(QZ.map(q => q.c))];
  const pick = S.qcat || 'all';
  if (!QS) {
    app.innerHTML = `<h1 style="font-size:44px">Quiz</h1><p class="muted">Fifteen random questions. Click an answer to see right away if it's correct and why.</p>
    <div class="chips">${['all', ...cats].map(c => `<button class="chip ${c === pick ? 'on' : ''}" data-c="${c}">${c === 'all' ? 'Everything' : esc(CHN[c] || c)}</button>`).join('')}</div>
    <button class="btn pri" id="qgo">Start</button>
    ${Object.keys(S.quiz).length ? `<p class="small muted" style="margin-top:20px">Best scores: ${Object.entries(S.quiz).map(([k, v]) => `${k === 'all' ? 'Everything' : esc(CHN[k] || k)} ${v}%`).join(', ')}</p>` : ''}`;
    $$('.chip').forEach(b => b.onclick = () => { S.qcat = b.dataset.c; save(); quiz(); });
    $('#qgo').onclick = () => { const pool = QZ.filter(q => pick === 'all' || q.c === pick); QS = { cat: pick, qs: shuffle(pool).slice(0, 15).map(q => ({ ...q, ord: shuffle(q.o.map((_, j) => j)) })), i: 0, ok: 0 }; quiz(); };
    return;
  }
  if (QS.i >= QS.qs.length) {
    const pct = Math.round(100 * QS.ok / QS.qs.length); S.quiz[QS.cat] = Math.max(S.quiz[QS.cat] || 0, pct); save();
    app.innerHTML = `<div class="qcard"><h3>${QS.ok} of ${QS.qs.length} correct (${pct}%)</h3><p class="muted">${pct >= 80 ? 'Solid. Try the exercises next.' : 'Read the chapter again and retry.'}</p><button class="btn pri" id="again">New round</button></div>`;
    $('#again').onclick = () => { QS = null; quiz(); }; return;
  }
  const q = QS.qs[QS.i];
  app.innerHTML = `<div class="small muted">${esc(CHN[q.c] || q.c)}, question ${QS.i + 1} of ${QS.qs.length}</div><div class="progress"><i style="width:${100 * QS.i / QS.qs.length}%"></i></div>
    <div class="qcard"><h3>${esc(q.q)}</h3>${q.code ? `<pre class="code">${hl(q.code)}</pre>` : ''}
    ${q.ord.map(j => `<button class="opt" data-j="${j}"><span class="${/[<>=(*'"_%]/.test(q.o[j]) ? 'c' : ''}">${esc(q.o[j])}</span></button>`).join('')}<div id="ex"></div></div>`;
  let done = false;
  $$('.opt').forEach(b => b.onclick = () => {
    if (done) return; done = true; const j = +b.dataset.j, ok = j === q.a; if (ok) QS.ok++;
    b.classList.add(ok ? 'ok' : 'bad'); $(`.opt[data-j="${q.a}"]`).classList.add('ok');
    $('#ex').innerHTML = `${q.ex ? `<div class="expl">${esc(q.ex)}</div>` : ''}<p><button class="btn pri" id="nx">${QS.i + 1 < QS.qs.length ? 'Next question' : 'See score'}</button></p>`;
    $('#nx').onclick = () => { QS.i++; quiz(); }; $('#nx').focus();
  });
}

    ${S.mock.length ? `<p class="small muted" style="margin-top:20px">Earlier attempts: ${S.mock.slice(-5).map(m => `${m.s}/${m.n}`).join(', ')}</p>` : ''}`;

    ${MK.ids.map((id, n) => `<section class="sec" style="margin-top:30px"><p class="exq"><b>${n+1}.</b> ${EX[id].q}</p><div class="mk" data-id="${id}"></div></section>`).join('')}
    <p style="margin-top:30px"><button class="btn gold" id="hand2">Hand in</button></p>`;

  $('#hand').onclick = $('#hand2').onclick = handIn;

function mockResult(){

/* ---------- learn from zero ---------- */
const LSTEPS = LEARN.flatMap((u, ui) => u.steps.map((st, si) => ({ ...st, ui, si, key: ui + '.' + si })));
function start(k){
  let n = LSTEPS.findIndex(s => s.key === k);
  if (n < 0) { n = LSTEPS.findIndex(s => !S.learn[s.key]); if (n < 0) n = 0; return location.replace('#/start/' + LSTEPS[n].key); }
  const st = LSTEPS[n], u = LEARN[st.ui], doneN = LSTEPS.filter(s => S.learn[s.key]).length;
  app.innerHTML = `<div class="lrn"><nav class="lmap" aria-label="Lessons"><div class="small muted">${doneN} of ${LSTEPS.length} steps done</div>
    ${LEARN.map((un, ui) => `<h4>${ui + 1}. ${esc(un.title)}</h4>${un.steps.map((s2, si) => `<a href="#/start/${ui}.${si}" class="${ui + '.' + si === k ? 'on' : ''}"><span class="ck ${S.learn[ui + '.' + si] ? 'd' : ''}">${S.learn[ui + '.' + si] ? '✓' : ''}</span>${esc(s2.t)}</a>`).join('')}`).join('')}</nav>
    <article class="lstep"><div class="unit">Lesson ${st.ui + 1}: ${esc(u.title)}, step ${st.si + 1} of ${u.steps.length}</div><h1>${esc(st.t)}</h1><div class="x">${st.x}</div>
    ${st.ex ? `<p class="small muted" style="margin-bottom:6px">Example: see which data it reads, what the query says and what comes out. Change the query and run it again.</p><div id="lex"></div>` : ''}
    <div class="yourturn"><h2>Your turn</h2>${st.task ? `<p class="exq" style="font-size:17.5px;margin:6px 0 4px">${st.task.q}</p><div class="understand" style="margin-bottom:12px"><b>What the question wants from you</b><ul>${explain(st.task.sol).parts.map(p => `<li>${p.plain}</li>`).join('')}</ul></div><div id="ltask"></div><div class="cbar" style="padding:12px 0;border:0"><button class="btn gold" id="lchk">Check</button>${st.task.hint ? '<button class="btn" id="lhint">Hint</button>' : ''}<button class="btn" id="lshow">Show answer</button></div>` : `<p class="exq" style="font-size:17.5px;margin:6px 0 4px">${esc(st.mcq.q)}</p><div id="lmcq">${shuffle(st.mcq.o.map((_, j) => j)).map(j => `<button class="opt" data-j="${j}">${esc(st.mcq.o[j])}</button>`).join('')}</div>`}
    <div id="lfb"></div></div>
    <div class="lnav">${n > 0 ? `<a class="btn" href="#/start/${LSTEPS[n - 1].key}">Back</a>` : ''}<span style="flex:1"></span>${n < LSTEPS.length - 1 ? `<a class="btn ${S.learn[st.key] ? 'pri' : ''}" id="lnext" href="#/start/${LSTEPS[n + 1].key}">${S.learn[st.key] ? 'Next step' : 'Skip'}</a>` : `<a class="btn pri" href="#/exercises">Go to the exercises</a>`}</div></article></div>`;
  if (st.ex) lessonBox($('#lex'), st.ex);
  const fb = $('#lfb');
  const pass = msg => { const first = !S.learn[st.key]; S.learn[st.key] = 1; save(); fb.innerHTML = `<div class="verdict ok" style="margin-top:12px">${msg}</div>`; const nx = $('#lnext'); if (nx) { nx.classList.add('pri'); nx.textContent = 'Next step'; nx.focus(); } $$('.lmap a.on .ck').forEach(c => { c.classList.add('d'); c.textContent = '✓'; }); };
  if (st.task) {
    const c = consoleBox($('#ltask'), { sql: S.drafts['L' + st.key] || '', compact: true });
    c.ed.el.addEventListener('input', () => { S.drafts['L' + st.key] = c.ed.get(); save(); });
    $('#lchk').onclick = async () => {
      if (!c.ed.get().trim()) { fb.innerHTML = '<div class="verdict no" style="margin-top:12px">Write your query in the box first.</div>'; return; }
      const r = await check({ sol: st.task.sol, db: 'enterprise', ord: /\border\b|\bsort|first$/i.test(st.task.q) }, c.ed.get());
      if (r.ok) pass('Correct. That is exactly the right result.');
      else fb.innerHTML = `<div class="verdict no" style="margin-top:12px">${esc(r.msg)}</div>${r.ref ? `<p class="small muted">The result should look like this:</p><div class="console res" style="max-height:240px">${table(r.ref)}</div>` : ''}`;
    };
    if (st.task.hint) $('#lhint').onclick = () => { fb.innerHTML = `<div class="expl">Hint: ${st.task.hint}</div>`; };
    $('#lshow').onclick = () => { const xq = explain(st.task.sol); fb.innerHTML = `<p class="small muted" style="margin-top:12px">One correct answer, piece by piece. Type it yourself in the box and press Check, that's how it sticks.</p><ol class="steps">${xq.parts.map(x => `<li><b>${x.label}</b><pre class="code">${hl(x.code)}</pre><div class="why">Why: ${x.why}</div></li>`).join('')}</ol>`; };
  } else {
    let done = false;
    $$('#lmcq .opt').forEach(b => b.onclick = () => { if (done) return; const j = +b.dataset.j; if (j === st.mcq.a) { done = true; b.classList.add('ok'); pass(st.mcq.why ? 'Correct. ' + esc(st.mcq.why) : 'Correct.'); } else { b.classList.add('bad'); fb.innerHTML = '<div class="verdict no" style="margin-top:12px">Not this one. Read the explanation again and try another answer.</div>'; } });
  }
  startDB();
}

function route(){
  const [r, a] = location.hash.replace(/^#\/?/, '').split('/');
  nav(r === 'ex' ? 'exercises' : r || '');
  const f = { '': home, quiz: () => quiz(a), start: () => start(a), learn: () => learn(a), play, exercises: () => exercises(a), ex: () => exercise(a), mock, cheat }[r || ''] || home;
  f(); scrollTo(0, 0);
}
addEventListener('hashchange', route); route();
setTimeout(startDB, 300);
window.__rdb = { run, check, EX, QZ, startDB, norm };
</script>
